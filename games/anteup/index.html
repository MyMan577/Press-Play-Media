  const actions = document.createElement("div");
  actions.className = "pack-actions";
  const skip = document.createElement("button");
  skip.className = "bbtn bbtn-grey";
  skip.innerHTML = `<span class="bbtn-big">Skip</span>`;
  skip.onclick = skipPack;
  actions.appendChild(skip);
  const take = document.createElement("button");
  take.className = "bbtn bbtn-orange";
  const pc = pick != null ? po.choices[pick] : null;
  take.disabled = pc == null || packChoiceFull(pc) || (need && (state.packSel || []).length < need[0]);
  take.innerHTML = `<span class="bbtn-big">${pc && !pc.type ? "Add to deck" : pc && pc.chart ? "Level up" : pc && (pc.spectral || pc.arcana) ? "Use" : "Take"}</span>`;
  take.onclick = () => { if (pick != null) usePackChoiceAnimated(pick); };
  actions.appendChild(take);
  wrap.appendChild(actions);
  wrap.appendChild(spacer());
  return wrap;
}

// Rerolls the charm/item stock (not vouchers) for a price. Each reroll this
// shop visit doubles the cost of the next one; it resets back to base the
// next time the player enters a shop.
function rerollShop() {
  if (state.money < state.rerollCost) return;
  state.money -= state.rerollCost;
  state.shopStock = generateShopStock(6 + voucherSum("shopSizeBonus"));
  state.rerollCost = state.rerollCost * 2;
  state.shopDetail = null;
  saveGame();
  render();
}

// Tapping a charm/item opening or a voucher chit (anywhere but its Buy button)
// opens a popup with its full description. Tapping the backdrop, its own close
// button, or the same slot again closes it.
function openShopDetail(kind, index) {
  if (state.shopDetail && state.shopDetail.kind === kind && state.shopDetail.index === index) {
    state.shopDetail = null;
  } else {
    state.shopDetail = { kind, index };
  }
  render();
}
function closeShopDetail() {
  state.shopDetail = null;
  render();
}

function buyItem(shopIndex) {
  const item = state.shopStock[shopIndex];
  if (!item) return;
  
  const discountedPrice = shopPriceFor(item);
  
  if (state.money < discountedPrice) return;
  
  if (item.type === "playing") {
    state.money -= discountedPrice;
    state.deck = shuffleArray([...state.deck, { ...item.card }]);
    noteAdded(1);
  } else if (item.type === "charm") {
    if (item.sleeve !== "negative" && charmsUsed() >= state.charmSlots) return;
    state.money -= discountedPrice;
    state.charms = [...state.charms, { ...item, uid: Math.random().toString(36).slice(2, 9) }];
  } else {
    if (state.items.length >= getEffectiveItemSlots()) return;
    state.money -= discountedPrice;
    state.items = [...state.items, { ...item, uid: Math.random().toString(36).slice(2, 9) }];
  }
  
  if (state.freeBuy) state.freeBuy = false;
  buzz(20);
  state.shopStock = state.shopStock.map((it, i) => (i === shopIndex ? null : it));
  saveGame();
  render();
}

function buyVoucher(voucherIndex) {
  const voucher = state.voucherStock[voucherIndex];
  if (!voucher) return;
  if (state.money < voucher.price) return;
  
  state.money -= voucher.price;
  state.vouchers = [...state.vouchers, { ...voucher }];
  state.voucherStock = state.voucherStock.map((v, i) => (i === voucherIndex ? null : v));
  const eff = voucher.effect;
  if (eff.type === "extraCharmSlot") state.charmSlots += eff.value;
  if (eff.type === "shopSizeBonus") state.shopStock = [...state.shopStock, ...generateShopStock(eff.value)];
  if (eff.type === "rerollDiscount") state.rerollCost = Math.max(1, state.rerollCost - eff.value);
  if (eff.anteDown) state.ante = Math.max(1, state.ante - eff.anteDown);
  state.redeemedAt = Date.now();
  buzz([20, 30, 40]);
  saveGame();
  render();
}

function sellCharm(uid) {
  const idx = state.charms.findIndex((c) => c.uid === uid);
  if (idx === -1) return;
  const charm = state.charms[idx];
  
  state.lastSoldCharm = { ...charm };
  noteSold();
  // Check if this charm is Specter and if it has played 3+ blinds
  if (charm.effect.type === "specterDuplicate" && (charm.effect.blindCounter || 0) >= 3) {
    // Duplicate a random charm from current inventory (excluding the one being sold)
    const otherCharms = state.charms.filter((c) => c.uid !== uid);
    if (otherCharms.length > 0) {
      const targetCharm = otherCharms[Math.floor(Math.random() * otherCharms.length)];
      const charmDef = CHARM_DEFS.find((d) => d.id === targetCharm.id);
      if (charmDef) {
        const newCharm = { ...charmDef, uid: Math.random().toString(36).substring(7) };
        // Copy any accumulated state (like ratchet bonus)
        if (targetCharm.ratchetBonus !== undefined) {
          newCharm.ratchetBonus = targetCharm.ratchetBonus;
        }
        state.charms.push(newCharm);
        activateCharmSlide(charm, () => {});
      }
    }
  }
  
  state.money += sellValue(charm);
  // Removing the charm updates getEffectiveItemSlots() automatically. If The Fool's
  // slot was occupied, the item in it stays put, it just becomes an overflow item
  // until it's used or a new slot is gained again.
  state.charms = state.charms.filter((c) => c.uid !== uid);
  saveGame();
  render();
}

// Removes an item from the item slots after it's been used, unless an equipped
// Camera charm rolls its preserve chance - in which case the item stays in its
// slot and Camera itself gets a little activation slide so the save is visible.
// Only counts as "destroyed" (for The Joker) if it actually got removed.
// Camera can preserve any single item instance at most 4 times - after that,
// the item is always consumed on use regardless of Camera's roll.
function tryConsumeItem(item, itemUid) {
  state.charms.forEach((c) => { if (c.effect.type === "moneyOnItemUse") state.money += c.effect.value; });
  const cameraCharms = state.charms.filter((c) => c.effect.type === "cameraPreserve");
  const chanceMult = chanceMultiplier();
  const saveCount = item.cameraSaves || 0;
  let preservedBy = null;
  if (saveCount < 4) {
    for (const c of cameraCharms) {
      if (Math.random() < Math.min(1, c.effect.chance * chanceMult)) { preservedBy = c; break; }
    }
  }
  buzz(20);
  if (preservedBy) {
    setTimeout(() => activateCharmSlide(preservedBy, () => {}), 950);
    state.items = state.items.map((i) => (i.uid === itemUid ? { ...i, cameraSaves: saveCount + 1 } : i));
  } else {
    state.lastDestroyedItem = { ...item };
    state.items = state.items.filter((i) => i.uid !== itemUid);
  }
}

// Plays the "card gets sleeved" animation: the target card lifts up and glows
// while a floating label announces it, then settles back into place. Calls
// onComplete once finished so the caller can apply the actual state change,
// which is what makes the persistent sleeve visual (glow + badge) appear.
function playSleeveAnimation(cardId, sleeveType, onComplete) {
  if (ITEM_INSTANT) { if (onComplete) onComplete(); return; }
  const el = document.querySelector(`.hand-fan .card[data-card-id="${cardId}"]`);
  if (!el) { onComplete(); return; }
  const base = el.dataset.finalTransform || "";
  const glowColor = sleeveType === "sparkler" ? "#FFB84D" : "#C9A227";
  el.style.transition = "transform .22s cubic-bezier(.34,1.56,.64,1), filter .22s ease";
  el.style.transform = `${base} translateY(-24px) scale(1.1)`;
  el.style.filter = `brightness(1.35) drop-shadow(0 0 10px ${glowColor})`;
  spawnSleeveFloat(el, "Sleeved!", glowColor);
  setTimeout(() => {
    el.style.transform = base;
    el.style.filter = "brightness(1)";
    setTimeout(() => {
      el.style.transition = "";
      onComplete();
    }, 240);
  }, 250);
}

// Same as playSleeveAnimation but for stamps: lifts/glows the card in its
// stamp color, then applies the stamp via onComplete. Stamps and sleeves are
// independent properties, so this never touches card.sleeve.
function playStampAnimation(cardId, stampType, onComplete) {
  if (ITEM_INSTANT) { if (onComplete) onComplete(); return; }
  const el = document.querySelector(`.hand-fan .card[data-card-id="${cardId}"]`);
  if (!el) { onComplete(); return; }
  const base = el.dataset.finalTransform || "";
  const glowColor = STAMP_COLORS[stampType] || "#F2C94C";
  el.style.transition = "transform .22s cubic-bezier(.34,1.56,.64,1), filter .22s ease";
  el.style.transform = `${base} translateY(-24px) scale(1.1)`;
  el.style.filter = `brightness(1.35) drop-shadow(0 0 10px ${glowColor})`;
  spawnSleeveFloat(el, "Stamped!", glowColor);
  setTimeout(() => {
    el.style.transform = base;
    el.style.filter = "brightness(1)";
    setTimeout(() => {
      el.style.transition = "";
      onComplete();
    }, 240);
  }, 250);
}

// Same fixed-position floating-label trick as spawnChipFloat, reusing its
// entrance/exit animation but with custom text and color.
function spawnSleeveFloat(el, text, color) {
  if (!el) return;
  const rect = el.getBoundingClientRect();
  const float = document.createElement("div");
  float.className = "chip-float";
  float.style.color = color;
  float.style.textShadow = `0 2px 8px rgba(0,0,0,.55), 0 0 14px ${color}77`;
  float.textContent = text;
  float.style.left = (rect.left + rect.width / 2) + "px";
  float.style.top = rect.top + "px";
  document.body.appendChild(float);
  setTimeout(() => float.remove(), 900);
}

function useItem(itemUid) {
  const idx = state.items.findIndex((i) => i.uid === itemUid);
  if (idx === -1) return;
  const item = state.items[idx];
  const eff = item.effect;

  if (eff.type === "eraserRemoveCard") {
    if (state.overlay !== "playing" || state.selected.length === 0) return;
    const idsToRemove = state.selected.slice(0, eff.maxCards);
    activateCharmSlide(item, () => {
      noteDestroyed([...state.hand, ...state.deck].filter((c) => idsToRemove.includes(c.id)));
      state.hand = state.hand.filter((c) => !idsToRemove.includes(c.id));
      state.deck = state.deck.filter((c) => !idsToRemove.includes(c.id));
      state.usedCards = state.usedCards.filter((c) => !idsToRemove.includes(c.id));
      state.selected = state.selected.filter((id) => !idsToRemove.includes(id));
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "duplicatorCopyCard") {
    if (state.overlay !== "playing" || state.selected.length === 0) return;
    const targetId = state.selected[0];
    const source = state.hand.find((c) => c.id === targetId);
    if (!source) return;
    activateCharmSlide(item, () => {
      const clone = { ...source, id: source.id + "_dup_" + Date.now() + "_" + Math.random().toString(36).slice(2), sleeve: undefined };
      state.deck = [...state.deck, clone];
      noteAdded(1);
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "diceRandomMultX") {
    activateCharmSlide(item, () => {
      state.nextHandMultX = eff.min + Math.random() * (eff.max - eff.min);
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "freshDealRedraw") {
    if (state.overlay !== "playing" || state.hand.length === 0) return;
    const allIds = state.hand.map((c) => c.id);
    activateCharmSlide(item, () => {
      const discardedCards = state.hand.filter((c) => allIds.includes(c.id));
      const { newDeck, newHand } = refillHand(state.deck, state.hand, allIds);
      state.deck = newDeck;
      state.hand = newHand;
      state.usedCards = [...state.usedCards, ...discardedCards];
      state.selected = [];
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  // ----- reworked and new items -----
  const quick = (fn) => {
    activateCharmSlide(item, () => {
      fn();
      tryConsumeItem(item, itemUid);
      saveGame();
      render();
    });
  };
  const inPlay = state.overlay === "playing";
  const selectedInOrder = () => getSortedHand().filter((c) => state.selected.includes(c.id));
  const mapHand = (fn) => { state.hand = state.hand.map(fn); };

  if (eff.type === "levelHand") {
    return quick(() => {
      noteChartUsed();
      state.handLevels = { ...(state.handLevels || {}), [eff.hand]: handLevel(eff.hand) + 1 };
      const b = handBase(eff.hand);
      state.bossBlindMessage = `${eff.hand} → Lv ${handLevel(eff.hand)} (${b.chips} × ${b.mult})`;
      setTimeout(() => { state.bossBlindMessage = null; render(); }, 1800);
    });
  }
  if (eff.type === "loversShareMods") {
    const sel = selectedInOrder();
    if (!inPlay || sel.length < 2) return;
    const a = sel[0], b = sel[sel.length - 1];
    return quick(() => mapHand((c) => c.id === a.id ? { ...c, sleeve: b.sleeve, stamp: b.stamp } : c.id === b.id ? { ...c, sleeve: a.sleeve, stamp: a.stamp } : c));
  }
  if (eff.type === "merchantFreeBuy") return quick(() => { state.freeBuy = true; });
  if (eff.type === "gardenerGrowSuit") {
    if (state.hand.length === 0) return;
    return quick(() => {
      const counts = {};
      state.hand.forEach((c) => { counts[c.suit] = (counts[c.suit] || 0) + 1; });
      const suit = Object.keys(counts).sort((x, y) => counts[y] - counts[x])[0];
      for (let n = 0; n < eff.count; n++) state.deck.push(makeCard(randomOf(RANKS), suit));
      noteAdded(eff.count);
      state.deck = shuffleArray(state.deck);
    });
  }
  if (eff.type === "drawExtra") {
    if (!inPlay || state.deck.length === 0) return;
    return quick(() => {
      const drawn = state.deck.slice(0, eff.count);
      state.deck = state.deck.slice(drawn.length);
      tagBossDebuffedCards(drawn);
      state.hand = [...state.hand, ...drawn];
    });
  }
  if (eff.type === "extraPlayNow") {
    if (!inPlay) return;
    return quick(() => { state.playsLeft += eff.value; });
  }
  if (eff.type === "luckyRound") return quick(() => { state.luckyRound = true; });
  if (eff.type === "rankUpHand") {
    if (state.hand.length === 0) return;
    return quick(() => mapHand((c) => ({ ...c, rank: RANKS[(RANKS.indexOf(c.rank) + 1) % RANKS.length] })));
  }
  if (eff.type === "doubleBase") return quick(() => { state.nextHandDoubleBase = true; });
  if (eff.type === "encoreLastScore") {
    if (!state.lastHandScore) return;
    return quick(() => { state.nextHandBonusScore = state.lastHandScore; });
  }
  if (eff.type === "moneyPerCharm") return quick(() => { state.money += state.charms.length * eff.value; });
  if (eff.type === "roundHandSize") {
    if (!inPlay) return;
    return quick(() => {
      state.roundHandSizeBonus = (state.roundHandSizeBonus || 0) + eff.value;
      const { newDeck, newHand } = refillHand(state.deck, state.hand, []);
      state.deck = newDeck;
      state.hand = newHand;
    });
  }
  if (eff.type === "diceRandomChipsX") return quick(() => { state.nextHandChipsX = eff.min + Math.random() * (eff.max - eff.min); });
  if (eff.type === "raiseSellValue") {
    if (state.charms.length === 0) return;
    return quick(() => { state.charms = state.charms.map((c) => ({ ...c, sellBonus: (c.sellBonus || 0) + eff.value })); });
  }
  if (eff.type === "moneyPerActionLeft") return quick(() => { state.money += (state.playsLeft + state.discardsLeft) * eff.value; });
  if (eff.type === "interestNow") return quick(() => { state.money += getInterestBonus(state.items, state.money); });
  if (eff.type === "reshuffleUsed") {
    if (state.usedCards.length === 0) return;
    return quick(() => {
      state.deck = shuffleArray([...state.deck, ...state.usedCards]);
      state.usedCards = [];
    });
  }
  if (eff.type === "spreadSleeve") {
    const lead = getSortedHand()[0];
    if (!lead || !lead.sleeve) return;
    return quick(() => mapHand((c) => (c.rank === lead.rank && c.id !== lead.id ? withSleeve(c, lead.sleeve) : c)));
  }
  if (eff.type === "openPack") {
    activateCharmSlide(item, () => {
      tryConsumeItem(item, itemUid);
      openPack(eff.pack);
    });
    return;
  }
  if (eff.type === "stampRandom") {
    if (state.hand.length === 0) return;
    const ids = shuffleArray(state.hand).slice(0, eff.count).map((c) => c.id);
    return quick(() => mapHand((c) => (ids.includes(c.id) ? { ...c, stamp: randomOf(STAMP_KINDS) } : c)));
  }
  if (eff.type === "echoStamp") {
    const hand = getSortedHand();
    if (hand.length < 2 || !hand[0].stamp) return;
    return quick(() => mapHand((c) => (c.id === hand[1].id ? { ...c, stamp: hand[0].stamp } : c)));
  }
  if (eff.type === "stampSleeved") {
    if (!state.hand.some((c) => c.sleeve)) return;
    return quick(() => mapHand((c) => (c.sleeve ? { ...c, stamp: randomOf(STAMP_KINDS) } : c)));
  }
  if (eff.type === "sleeveRandom") {
    if (state.hand.length === 0) return;
    const ids = shuffleArray(state.hand).slice(0, eff.count).map((c) => c.id);
    return quick(() => mapHand((c) => (ids.includes(c.id) ? withSleeve(c, eff.sleeve) : c)));
  }
  if (eff.type === "moltCapsule") {
    const lead = getSortedHand()[0];
    if (!lead) return;
    return quick(() => mapHand((c) => (c.id === lead.id ? { ...c, sleeve: undefined, moltBuff: (c.moltBuff || 0) + eff.value } : c)));
  }
  if (eff.type === "larvaJar") {
    const lead = getSortedHand()[0];
    if (!lead) return;
    return quick(() => {
      for (let n = 0; n < eff.count; n++) state.deck.push(withSleeve({ ...lead, id: lead.id + "_jar_" + Date.now() + "_" + n + Math.random().toString(36).slice(2, 6) }, "larva"));
      noteAdded(eff.count);
      state.deck = shuffleArray(state.deck);
    });
  }
  if (eff.type === "copycatItem") {
    const others = state.items.filter((i) => i.uid !== itemUid && i.effect.type !== "copycatItem");
    if (others.length === 0) return;
    activateCharmSlide(item, () => {
      const pick = randomOf(others);
      state.items = state.items.map((i) => (i.uid === itemUid ? { ...pick, uid: newUid(), cameraSaves: 0 } : i));
      saveGame();
      render();
    });
    return;
  }
  if (eff.type === "pruneLow") {
    const isLow = (c) => c.rank === "2" || c.rank === "3";
    const count = state.deck.filter(isLow).length + state.usedCards.filter(isLow).length;
    if (count === 0) return;
    return quick(() => {
      state.deck = state.deck.filter((c) => !isLow(c));
      noteDestroyed([...state.deck, ...state.usedCards].filter(isLow));
      state.deck = state.deck.filter((c) => !isLow(c));
      state.usedCards = state.usedCards.filter((c) => !isLow(c));
    });
  }
  if (eff.type === "forgeAce") {
    if (!inPlay || state.selected.length === 0) return;
    const id = state.selected[0];
    return quick(() => mapHand((c) => (c.id === id ? { ...c, rank: "A" } : c)));
  }
  if (eff.type === "jackpotRoll") {
    return quick(() => {
      if (Math.random() < Math.min(1, eff.chance * chanceMultiplier())) {
        state.money += eff.value;
        state.bossBlindMessage = `Jackpot! +$${eff.value}`;
      } else {
        state.bossBlindMessage = "No luck this time";
      }
      setTimeout(() => { state.bossBlindMessage = null; render(); }, 1600);
    });
  }
  if (eff.type === "rallySuit") {
    const lead = getSortedHand()[0];
    if (!lead) return;
    return quick(() => mapHand((c) => ({ ...c, suit: lead.suit })));
  }
  if (eff.type === "swapRanks") {
    const sel = selectedInOrder();
    if (!inPlay || sel.length < 2) return;
    const a = sel[0], b = sel[sel.length - 1];
    return quick(() => mapHand((c) => (c.id === a.id ? { ...c, rank: b.rank } : c.id === b.id ? { ...c, rank: a.rank } : c)));
  }
  if (eff.type === "bountyFaces") return quick(() => { state.money += state.hand.filter((c) => isFace(c)).length * eff.value; });

  if (eff.type === "piggyBankDiscardsToMoney") {
    activateCharmSlide(item, () => {
      state.money += state.discardsLeft * eff.value;
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "flatMoneyGain") {
    activateCharmSlide(item, () => {
      state.money += eff.value;
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "hangedManSellCards") {
    if (state.overlay !== "playing" || state.selected.length === 0) return; // needs cards selected in hand
    const idsToDestroy = state.selected.slice(0, eff.maxCards);
    activateCharmSlide(item, () => {
      const earned = idsToDestroy.length * eff.pricePerCard;
      noteDestroyed(state.hand.filter((c) => idsToDestroy.includes(c.id)));
      state.hand = state.hand.filter((c) => !idsToDestroy.includes(c.id));
      state.deck = state.deck.filter((c) => !idsToDestroy.includes(c.id));
      state.selected = state.selected.filter((id) => !idsToDestroy.includes(id));
      state.money += earned;
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "loversTransformSuit") {
    const visualHand = getSortedHand();
    if (visualHand.length === 0) return;
    const targetId = visualHand[visualHand.length - 1].id;
    activateCharmSlide(item, () => {
      state.hand = state.hand.map((c) => (c.id === targetId ? { ...c, suit: eff.suit } : c));
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "strengthRankUp") {
    if (state.overlay !== "playing" || state.selected.length === 0) return; // needs cards selected in hand
    const idsToRaise = state.selected.slice(0, eff.maxCards);
    activateCharmSlide(item, () => {
      state.hand = state.hand.map((c) => {
        if (!idsToRaise.includes(c.id)) return c;
        const nextIdx = (RANKS.indexOf(c.rank) + eff.value) % RANKS.length;
        return { ...c, rank: RANKS[nextIdx] };
      });
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "temperanceSetRank") {
    if (state.hand.length === 0) return;
    const targetIds = shuffleArray(state.hand).slice(0, eff.count).map((c) => c.id);
    activateCharmSlide(item, () => {
      state.hand = state.hand.map((c) => (targetIds.includes(c.id) ? { ...c, rank: eff.rank } : c));
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "towerRerollRanks") {
    if (state.hand.length === 0) return;
    activateCharmSlide(item, () => {
      state.hand = state.hand.map((c) => ({ ...c, rank: RANKS[Math.floor(Math.random() * RANKS.length)] }));
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "transformRandomSuit") {
    if (state.hand.length === 0) return;
    const targetIds = shuffleArray(state.hand).slice(0, eff.count).map((c) => c.id);
    activateCharmSlide(item, () => {
      state.hand = state.hand.map((c) => (targetIds.includes(c.id) ? { ...c, suit: eff.suit } : c));
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "coinDoubleMult") {
    activateCharmSlide(item, () => {
      state.nextHandDoubleMult = true;
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "justiceBalanceHand") {
    activateCharmSlide(item, () => {
      state.nextHandBalance = true;
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "judgementCreateCharm") {
    if (charmsUsed() >= state.charmSlots) return;
    const hasRingmaster = state.charms.some((c) => c.effect.type === "ringmasterDuplicates");
    const ownedCharmIds = hasRingmaster ? new Set() : new Set(state.charms.map((c) => c.id));
    const pool = CHARM_DEFS.filter((c) => !ownedCharmIds.has(c.id));
    if (pool.length === 0) return;
    const charmDef = pool[Math.floor(Math.random() * pool.length)];
    activateCharmSlide(item, () => {
      const newCharm = { ...charmDef, uid: Math.random().toString(36).slice(2, 9) };
      state.charms.push(newCharm);
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "emperorCreateItems") {
    const hasRingmaster = state.charms.some((c) => c.effect.type === "ringmasterDuplicates");
    activateCharmSlide(item, () => {
      const capacity = getEffectiveItemSlots();
      let currentCount = state.items.filter((i) => i.uid !== itemUid).length;
      const ownedItemIds = hasRingmaster ? new Set() : new Set(state.items.map((i) => i.id));
      for (let n = 0; n < eff.count; n++) {
        if (currentCount >= capacity) break;
        const pool = ITEM_DEFS.filter((i) => !ownedItemIds.has(i.id));
        if (pool.length === 0) break;
        const def = pool[Math.floor(Math.random() * pool.length)];
        const newItem = { ...def, uid: Math.random().toString(36).slice(2, 9) };
        state.items.push(newItem);
        ownedItemIds.add(def.id);
        currentCount++;
      }
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "deathCopyCard") {
    if (state.overlay !== "playing" || state.selected.length < 2) return; // needs at least 2 selected cards
    // Determine leftmost/rightmost among selected cards by their current visual position.
    const visualHand = getSortedHand();
    const selectedInOrder = visualHand.filter((c) => state.selected.includes(c.id));
    const leftmostId = selectedInOrder[0].id;
    const rightmostCard = selectedInOrder[selectedInOrder.length - 1];
    activateCharmSlide(item, () => {
      state.hand = state.hand.map((c) =>
        c.id === leftmostId ? { ...c, rank: rightmostCard.rank, suit: rightmostCard.suit, sleeve: rightmostCard.sleeve, stamp: rightmostCard.stamp } : c
      );
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "magicianSleeveCard") {
    const visualHand = getSortedHand();
    if (visualHand.length === 0) return;
    const targetId = visualHand[0].id; // leftmost card in hand
    activateCharmSlide(item, () => {
      playSleeveAnimation(targetId, eff.sleeve, () => {
        state.hand = state.hand.map((c) => (c.id === targetId ? withSleeve(c, eff.sleeve) : c));
        if (eff.sleeve === "molt") {
          state.moltTargets = { ...state.moltTargets, [targetId]: true };
        }
        tryConsumeItem(item, itemUid);
        saveGame();
        render();
      });
    });
    return;
  }

  if (eff.type === "stampCard") {
    const visualHand = getSortedHand();
    if (visualHand.length === 0) return;
    const targetId = visualHand[0].id; // leftmost card in hand
    activateCharmSlide(item, () => {
      playStampAnimation(targetId, eff.stamp, () => {
        state.hand = state.hand.map((c) => (c.id === targetId ? { ...c, stamp: eff.stamp } : c));
        tryConsumeItem(item, itemUid);
        saveGame();
        render();
      });
    });
    return;
  }

  if (eff.type === "jokerTransform" && state.lastDestroyedItem) {
    activateCharmSlide(item, () => {
      const transformed = { ...state.lastDestroyedItem, uid: Math.random().toString(36).slice(2, 9) };
      state.items = state.items.map((it, i) => (i === idx ? transformed : it));
      // The Joker itself is consumed by transforming, not destroyed as "used" in the
      // traditional sense (it becomes something else), so we don't remove the slot
      // and we don't set lastDestroyedItem here.
      saveGame();
    });
    return;
  }

  activateCharmSlide(item, () => {
    if (eff.type === "devilMultiplier") {
      state.runMultiplier = Math.round(state.runMultiplier * eff.value * 100) / 100;
    } else if (eff.type === "fortuneNextHandChips") {
      state.nextHandChipBonus += eff.value;
    } else if (eff.type === "sunRefillDiscards") {
      state.discardsLeft = 4 + getExtraDiscards(state.items);
    } else if (eff.type === "empressRetrigger") {
      state.nextHandRetrigger = true;
    } else if (eff.type === "hermitDoubleMoney") {
      state.money += Math.min(state.money, eff.cap);
    } else if (eff.type === "starDoubleChips") {
      state.nextHandDoubleChips = true;
    }
    // No prior destroyed item for Joker to become - it just fizzles and is used up.

    // Track this item as the most recently destroyed/used item (for future Joker uses),
    // then remove it from the item slots since it has been consumed - unless a Camera
    // charm preserves it.
    tryConsumeItem(item, itemUid);
    saveGame();
  });
}

function leaveShop() {
  state.charms.filter((c) => c.effect.type === "vaultCopyItem").forEach(() => {
    if (state.items.length) state.items = [...state.items, { ...randomOf(state.items), uid: newUid(), cameraSaves: 0 }];
  });
  goNextBlind();
}

function takeTheWin() {
  state.overlay = "won";
  clearSave();
  render();
}

function goNextBlind() {
  let nextAnte = state.ante;
  let nextBlindIdx = state.blindIdx + 1;
  if (nextBlindIdx > 2) {
    nextBlindIdx = 0;
    nextAnte = state.ante + 1;
  }
  startNextBlind(nextAnte, nextBlindIdx);
}

function setSortMode(mode) {
  if (mode === "manual" && state.sortMode !== "manual") {
    // Seed manual order from whatever's currently displayed so the switch is seamless.
    state.handOrder = getSortedHand().map((c) => c.id);
  }
  state.sortMode = mode;
  render();
}

function getSortedHand() {
  if (state.sortMode === "manual") {
    syncHandOrder();
    return state.handOrder.map((id) => state.hand.find((c) => c.id === id)).filter(Boolean);
  }
  const arr = [...state.hand];
  if (state.sortMode === "suit") {
    arr.sort((a, b) => {
      const s = SUIT_KEYS.indexOf(a.suit) - SUIT_KEYS.indexOf(b.suit);
      return s !== 0 ? s : rankStraightValueHigh(a.rank) - rankStraightValueHigh(b.rank);
    });
  } else {
    arr.sort((a, b) => rankStraightValueHigh(a.rank) - rankStraightValueHigh(b.rank));
  }
  return arr;
}

// Keeps handOrder in sync with state.hand: drops ids no longer in hand,
// appends any new ids (newly dealt/drawn cards) to the end.
function syncHandOrder() {
  const handIds = state.hand.map((c) => c.id);
  const stillValid = state.handOrder.filter((id) => handIds.includes(id));
  const missing = handIds.filter((id) => !stillValid.includes(id));
  state.handOrder = [...stillValid, ...missing];
}

// Reorders a card within the current visual order (used by drag-to-reorder).
// Works no matter which sortMode is active - dragging always switches to manual.
function moveCardToPosition(cardId, targetIndex) {
  const currentVisual = getSortedHand().map((c) => c.id);
  const fromIndex = currentVisual.indexOf(cardId);
  if (fromIndex === -1) return;
  currentVisual.splice(fromIndex, 1);
  const clampedIndex = Math.max(0, Math.min(targetIndex, currentVisual.length));
  currentVisual.splice(clampedIndex, 0, cardId);
  state.handOrder = currentVisual;
}

// A small clickable deck pile + counter, docked bottom-left so it never sits
// over the hand fan, preview text, or action buttons. Clicking opens a modal
// showing every card in the 52-card deck: still-in-deck cards are shown face
// up at full opacity, while cards currently in hand or already played/
// discarded this blind are shown dimmed as sleeved card backs.
function renderDeckWidget() {
  const widget = document.createElement("div");
  widget.className = "deck-widget";

  const stack = document.createElement("div");
  stack.className = "deck-stack";
  const stackW = 26, stackH = 36;
  stack.style.width = stackW + "px";
  stack.style.height = stackH + "px";

  // Draw a few layered card-backs so the pile reads as a physical deck,
  // capped so an empty/near-empty deck doesn't look full.
  const layers = Math.max(1, Math.min(3, Math.ceil(state.deck.length / 17)));
  for (let i = 0; i < layers; i++) {
    const back = document.createElement("div");
    back.className = "deck-card-back";
    back.style.width = stackW + "px";
    back.style.height = stackH + "px";

    inner.className = "deck-card-back-inner";
    back.appendChild(inner);
    stack.appendChild(back);

  const pill = document.createElement("div");
  pill.className = "deck-count-pill";

  widget.appendChild(pill);

  const label = document.createElement("div");
  label.className = "deck-label";
  label.textContent = "Deck";
  widget.appendChild(label);

  widget.onclick = () => {
    state.deckOverlayOpen = true;

/* ============================== FLIP ANIMATION HELPERS ==============================
   Captures on-screen positions of hand cards before a re-render, then after the new
   DOM is built, replays the movement from old->new position (FLIP technique) so cards
   glide to their new spot instead of snapping. Cards with no prior position (newly
   dealt) get a deal-in entrance instead. */
function captureCardRects() {
  const rects = {};
  document.querySelectorAll(".hand-fan .card[data-card-id]").forEach((el) => {
    rects[el.dataset.cardId] = el.getBoundingClientRect();
  });
  return rects;
}
function applyCardFlip(oldRects, isFullDeal) {
  const DEAL_STAGGER_MS = 70; // gap between each card's dealing animation start
  const DEAL_DURATION_MS = 420;

  document.querySelectorAll(".hand-fan .card[data-card-id]").forEach((el) => {
    const id = el.dataset.cardId;
    const finalTransform = el.dataset.finalTransform || "";
    const old = oldRects[id];
    if (old) {
      const newRect = el.getBoundingClientRect();
      const dx = old.left - newRect.left;
      const dy = old.top - newRect.top;
      if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
        el.style.transition = "none";
        el.style.transform = `translate(${dx}px, ${dy}px) ${finalTransform}`;
        void el.offsetWidth; // force reflow so the "from" state is committed
        requestAnimationFrame(() => {
          el.style.transition = "transform .38s cubic-bezier(.22,1,.36,1), box-shadow .18s ease, opacity .28s ease";
          el.style.transform = finalTransform;
        });
      }
    } else if (isFullDeal) {
      // Fresh blind: cards fly in one-by-one from an imaginary deck above the
      // table, like they're being dealt out, instead of all popping in at once.
      const dealIndex = parseInt(el.dataset.dealIndex || "0", 10);
      const delay = dealIndex * DEAL_STAGGER_MS;
      const fromTransform = `translateY(-220px) translateX(${dealIndex % 2 === 0 ? -18 : 18}px) rotate(${dealIndex % 2 === 0 ? -30 : 30}deg) scale(.7)`;

      el.style.transition = "none";
      el.style.opacity = "0";
      el.style.transform = fromTransform;
      el.style.zIndex = 50 + dealIndex;
      void el.offsetWidth;

      setTimeout(() => {
        el.style.transition = `transform ${DEAL_DURATION_MS}ms cubic-bezier(.16,.9,.3,1), opacity .18s ease`;
        el.style.opacity = "1";
        el.style.transform = finalTransform;
        el.classList.remove("card-dealing");
        void el.offsetWidth;
        el.classList.add("card-dealing");
        setTimeout(() => {
          // restore the normal transition + stacking so hover/select feel right again
          el.style.transition = "transform .38s cubic-bezier(.22,1,.36,1), box-shadow .18s ease, opacity .28s ease";
          el.style.zIndex = el.dataset.finalZ || el.style.zIndex;
        }, DEAL_DURATION_MS);
      }, delay);
    } else {
      el.style.transition = "none";
      el.style.opacity = "0";
      el.style.transform = `translateY(80px) scale(.8) ${finalTransform}`;
      void el.offsetWidth;
      requestAnimationFrame(() => {
        el.style.transition = "transform .5s cubic-bezier(.22,1,.36,1), opacity .4s ease, box-shadow .18s ease";
        el.style.opacity = "1";
        el.style.transform = finalTransform;
      });
    }
  });
}

/* ============================== MAIN RENDER ============================== */
// Phones held sideways: a short, wide screen gets its own layout (see the
// "LANDSCAPE" CSS block): score and shelf share the top band, and the deck,
// hand and buttons share the bottom one.
function isLandscape() {
  return window.innerWidth > window.innerHeight && window.innerHeight < 600;
}

function render() {
  if (ITEM_INSTANT || PACK_BUSY) return;
  document.body.classList.toggle("landscape", isLandscape());
  if (state.deckOverlayOpen && state.overlay !== "playing" && state.overlay !== "shop") state.deckOverlayOpen = false;
  const oldCardRects = captureCardRects();
  const app = document.getElementById("app");
  const hadPack = !!app.querySelector(".pack-overlay"), hadPause = !!app.querySelector(".pause-back");
  app.innerHTML = "";
  if (MENU.screen === "main") { app.appendChild(MainMenu()); return; }

  const fanLayout = computeFanLayout();
  const cardScale = fanLayout.scale;
  const fanOverlapPx = fanLayout.overlap * fanLayout.scale;
  const target = targetForAnte(state.ante, state.blindIdx);

  // ===== HEADER =====
  const header = document.createElement("div");
  header.className = "header";

  const left = document.createElement("div");
  left.innerHTML = `
    <div class="blind-label">ANTE ${state.ante} · ${BLIND_TYPES[state.blindIdx].label.toUpperCase()}</div>
    ${state.bossBlind ? `<div class="boss-blind-name serif${state.bossBlind.isFinal ? " boss-blind-final" : ""}" title="${state.bossBlind.desc}">${state.bossBlind.isFinal ? '<span class="boss-blind-final-tag">FINAL BOSS</span>' : ""}${state.bossBlind.name}</div><div class="boss-blind-desc">${state.bossBlind.desc}</div>` : ""}
    <div class="score-line serif">${state.roundScore.toLocaleString()} <span class="score-target">/ ${target.toLocaleString()}</span></div>
  `;
  const progressTrack = document.createElement("div");
  progressTrack.className = "progress-track";
  const progressFill = document.createElement("div");
  progressFill.className = "progress-fill";
  progressFill.style.width = `${Math.min(100, (state.roundScore / target) * 100)}%`;
  progressTrack.appendChild(progressFill);
  left.appendChild(progressTrack);
  header.appendChild(left);

  const statsRow = document.createElement("div");
  statsRow.className = "stats-row";
  statsRow.appendChild(Stat("Plays", state.playsLeft, "#3FA9A0"));
  statsRow.appendChild(Stat("Discards", state.discardsLeft, "#A23B3B"));
  statsRow.appendChild(Stat("$", state.money, "#C9A227"));
  if (state.runMultiplier !== 1) {
    statsRow.appendChild(Stat("Run Mult", `x${state.runMultiplier}`, "#A23B3B"));
  }
  if (state.nextHandChipBonus > 0) {
    statsRow.appendChild(Stat("Next Chips", `+${state.nextHandChipBonus}`, "#3FA9A0"));
  }
  if (state.nextHandDoubleChips) {
    statsRow.appendChild(Stat("Next Chips", "x2", "#4F7FBF"));
  }
  if (state.nextHandDoubleMult) {
    statsRow.appendChild(Stat("Next Mult", "x2", "#C9A227"));
  }
  if (state.nextHandMultX !== 1) {
    statsRow.appendChild(Stat("Next Mult", `x${state.nextHandMultX.toFixed(2)}`, "#C9574A"));
  }
  if (state.nextHandRetrigger) {
    statsRow.appendChild(Stat("Retrigger", "Yes", "#B05FA0"));
  }
  if (state.nextHandBalance) {
    statsRow.appendChild(Stat("Balanced", "Yes", "#9B8B6A"));
  }
  header.appendChild(statsRow);

  app.appendChild(header);

  // ===== GEAR SHELF: artifacts (charms) then items, drawn, across the top =====
  app.appendChild(GearShelf());

  // ===== PREVIEW BAR =====
  const previewBar = document.createElement("div");
  previewBar.className = "preview-bar";
  const selectedCards = state.hand.filter((c) => state.selected.includes(c.id));
  // Same engine as a real play, minus luck rolls (Heartstone, Calculator).
  const preview = (() => {
    // Hidden while a played hand is being counted, so the total isn't given away.
    const r = selectedCards.length && !state.popup && SETTINGS.preview ? previewScore(selectedCards) : null;
    return r ? { name: r.name, totalChips: r.chips, totalMult: r.mult, score: r.score } : null;
  })();
  if (preview) {
    const nameEl = document.createElement("div");
    nameEl.className = "preview-name serif";
    nameEl.innerHTML = `${preview.name}<span class="lv-tag">Lv ${handLevel(preview.name)}</span>`;
    nameEl.onclick = () => { state.gearDetail = { kind: "hands", at: Date.now() }; render(); };
    previewBar.appendChild(nameEl);
    previewBar.appendChild(ChipPill("chips", preview.totalChips, "#3FA9A0"));
    const x = document.createElement("span");
    x.style.color = "#9A917A";
    x.textContent = "×";
    previewBar.appendChild(x);
    previewBar.appendChild(ChipPill("mult", preview.totalMult, "#C9A227"));
    const eq = document.createElement("span");
    eq.style.color = "#9A917A";
    eq.textContent = "=";
    previewBar.appendChild(eq);
    const scoreEl = document.createElement("span");
    scoreEl.className = "serif";
    scoreEl.style.fontSize = "22px";
    scoreEl.style.fontWeight = "700";
    scoreEl.textContent = preview.score;
    previewBar.appendChild(scoreEl);
  } else {
    const placeholder = document.createElement("div");
    placeholder.className = "preview-placeholder";
    const handOnly = !SETTINGS.preview && selectedCards.length && !state.popup ? evaluateSelection(selectedCards) : null;
    placeholder.textContent = state.popup ? "" : handOnly ? handOnly.name : SETTINGS.preview ? "Select cards to preview your hand" : "";
    previewBar.appendChild(placeholder);
  }
  app.appendChild(previewBar);

  const spacer = document.createElement("div");
  spacer.className = "spacer";
  app.appendChild(spacer);

  if (state.bossBlindMessage) {
    const toast = document.createElement("div");
    toast.className = "boss-blind-toast";
    toast.textContent = state.bossBlindMessage;
    app.appendChild(toast);
  }

  // ===== BOTTOM BAR =====
  const bottomBar = document.createElement("div");
  bottomBar.className = "bottom-bar";

  const wasFullDeal = state.dealAnim;
  const handFan = document.createElement("div");
  handFan.className = "hand-fan";
  state.dealAnim = false;
  handFan.style.padding = `${Math.round(6 * cardScale)}px 8px 6px`;
  handFan.style.minHeight = Math.round(170 * cardScale) + "px";

  const sortedHand = getSortedHand();
  sortedHand.forEach((card, i) => {
    const cardEl = renderCard(card, {
      selected: state.selected.includes(card.id),
      scoring: state.scoringIds.includes(card.id),
      dimmed: state.scoringIds.length > 0 && !state.scoringIds.includes(card.id),
      scale: cardScale,
      marginLeft: i === 0 ? 0 : -Math.round(fanOverlapPx),
      arcIndex: i,
      arcCount: sortedHand.length,
      onClick: () => toggleSelect(card.id),
    });
    cardEl.dataset.dealIndex = i;
    handFan.appendChild(cardEl);
  });
  bottomBar.appendChild(handFan);

  const actionsRow = document.createElement("div");
  actionsRow.className = "actions-row";

  actionsRow.appendChild(
    ActionButton("Discard", hasCharm("chainsNoDiscardX") ? "chained" : `${state.discardsLeft} left`, "#A23B3B", false, discard, state.selected.length === 0 || state.discardsLeft === 0 || hasCharm("chainsNoDiscardX"), cardScale)
  );
  actionsRow.appendChild(
    ActionButton("Play Hand", `${state.playsLeft} left`, "#C9A227", true, playHand, state.selected.length === 0 || state.playsLeft === 0, cardScale)
  );
  bottomBar.appendChild(actionsRow);

  const subRow = document.createElement("div");
  subRow.className = "sub-controls-row";

  if (state.overlay === "playing") {
    subRow.appendChild(renderDeckWidget());
  } else {
    subRow.appendChild(document.createElement("div"));
  }

  const sortWrap = document.createElement("div");
  sortWrap.className = "sort-toggle-wrap";
  sortWrap.innerHTML = `<div class="sort-toggle-label" style="font-size:${Math.round(7 * cardScale)}px">Sort</div>`;
  const sortToggle = document.createElement("div");
  sortToggle.className = "sort-toggle";
  ["rank", "suit", "manual"].forEach((key) => {
    const opt = document.createElement("button");
    opt.className = "sort-opt" + (state.sortMode === key ? " active" : "");
    opt.style.fontSize = Math.round(8.5 * cardScale) + "px";
    opt.style.padding = `${Math.round(4.5 * cardScale)}px ${Math.round(7 * cardScale)}px`;
    opt.textContent = key === "rank" ? "Rank" : key === "suit" ? "Suit" : "Move";
    opt.onclick = () => setSortMode(key);
    sortToggle.appendChild(opt);
  });
  sortWrap.appendChild(sortToggle);
  subRow.appendChild(sortWrap);
  subRow.appendChild(OptionsButton());

  bottomBar.appendChild(subRow);

  app.appendChild(bottomBar);

  const spacerBottom = document.createElement("div");
  spacerBottom.style.height = Math.round(170 * cardScale) + 70 + "px";
  app.appendChild(spacerBottom);

  // ===== SCORE POPUP =====
  if (state.popup) {
    const popup = document.createElement("div");
    popup.className = "score-popup";
    const p = state.popup;
    const bumpChips = p.phase === "counting" && (p.bump === "chips");
    const bumpMult = p.phase === "counting" && (p.bump === "mult" || p.bump === "xmult");
    const totalLine = p.phase === "total" ? `<div class="score-popup-total serif">${Number(p.score).toLocaleString()}</div>` : "";
    popup.innerHTML = `
      <div class="score-popup-name serif">${p.name}<span class="lv-tag">Lv ${handLevel(p.name)}</span></div>
      <div class="sp-boxes">
        <div class="sp-box sp-chips${bumpChips ? " bump" : ""}">${Math.round(p.chips).toLocaleString()}</div>
        <div class="sp-x">×</div>
        <div class="sp-box sp-mult${bumpMult ? " bump" : ""}">${fmtNum(p.mult)}</div>
      </div>
      ${totalLine}
    `;
    popup.classList.toggle("is-total", p.phase === "total");
    // The whole #app tree gets rebuilt on every render() call (e.g. when a
    // charm activation shows/hides while this popup is still on screen),
    // which would otherwise restart the popIn/popNameSlide/popTotalPunch
    // entrance animations from scratch each time, making the hand name
    // banner appear to flash repeatedly. Use the same negative
    // animation-delay technique used for charm activation so unrelated
    // renders resume the animation in place instead of replaying it.
    const popupElapsed = state.popupStartedAt ? Date.now() - state.popupStartedAt : 0;
    if (popupElapsed > 0) {
      const delay = `-${popupElapsed}ms`;
      popup.style.animationDelay = delay;
      popup.querySelector(".score-popup-name").style.animationDelay = delay;
      const totalEl = popup.querySelector(".score-popup-total");
      if (totalEl) totalEl.style.animationDelay = delay;
    }
    app.appendChild(popup);
  }

  // ===== OVERLAYS =====
  if (state.overlay === "cleared") {
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    const { base, interest, leftover = 0 } = state.lastRoundEarnings;
    const parts = [`$${base}`];
    if (leftover > 0) parts.push(`$${leftover} unused hands`);
    if (interest > 0) parts.push(`$${interest} interest`);
    const earningsText = `earned ${parts.join(" + ")}`;
    overlay.innerHTML = `
      <div class="overlay-title serif" style="font-size:34px;color:#C9A227">Blind Cleared</div>
      <div class="overlay-sub" style="margin:8px 0 24px">${state.roundScore.toLocaleString()} / ${target.toLocaleString()} · ${earningsText}</div>
    `;
    overlay.appendChild(BigButton("Visit Shop", goToShop));
    app.appendChild(overlay);
  } else if (state.overlay === "victory") {
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    const { base, interest, leftover = 0 } = state.lastRoundEarnings;
    const parts = [`$${base}`];
    if (leftover > 0) parts.push(`$${leftover} unused hands`);
    if (interest > 0) parts.push(`$${interest} interest`);
    const earningsText = `earned ${parts.join(" + ")}`;
    overlay.innerHTML = `
      <div class="overlay-title serif" style="font-size:34px;color:#E9C568">Final Boss Defeated</div>
      <div class="overlay-sub" style="margin:8px 0 12px">${state.roundScore.toLocaleString()} / ${target.toLocaleString()} · ${earningsText}</div>
      <div class="overlay-sub" style="margin:0 0 24px">You've beaten Ante ${FINAL_ANTE}. Bank the win, or keep climbing endless antes for a higher score.</div>
    `;
    overlay.appendChild(BigButton("Take the Win", takeTheWin));
    overlay.appendChild(BigButton("Continue Onward", goToShop));
    app.appendChild(overlay);
  } else if (state.overlay === "won") {
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = `
      <div class="overlay-title serif" style="font-size:34px;color:#E9C568">Victory</div>
      <div class="overlay-sub" style="margin:8px 0 24px">You beat the final boss at Ante ${FINAL_ANTE} with $${state.money.toLocaleString()}. Run complete.</div>
    `;
    overlay.appendChild(BigButton("Start New Run", startGame));
    overlay.appendChild(BigButton("Main Menu", () => { MENU.screen = "main"; render(); }));
    app.appendChild(overlay);
  } else if (state.overlay === "over") {
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = `
      <div class="overlay-title serif" style="font-size:34px;color:#A23B3B">Run Over</div>
      <div class="overlay-sub" style="margin:8px 0 24px">Fell short at Ante ${state.ante}, ${BLIND_TYPES[state.blindIdx].label} — ${state.roundScore.toLocaleString()} / ${target.toLocaleString()}</div>
    `;
    overlay.appendChild(BigButton("Try Again", startGame));
    overlay.appendChild(BigButton("Main Menu", () => { MENU.screen = "main"; render(); }));
    app.appendChild(overlay);
  } else if (state.overlay === "shop") {
    app.appendChild(ShopOverlay());
  }

  // ===== CHARM ACTIVATION DISPLAY =====
  // An artifact or item on the shelf fires in place (see activateCharmSlide);
  // only one that isn't on the shelf falls back to the sliding banner.
  const onShelf = state.activeCharm && [...state.charms, ...state.items].some((d) => d.uid === state.activeCharm.uid);
  if (state.activeCharm && !onShelf) {
    const activation = document.createElement("div");
    activation.className = "charm-activation" + (state.activeCharmClosing ? " out" : "");
    // The whole #app tree gets rebuilt on every render() call, which would
    // normally restart this element's CSS slide-in animation from scratch
    // every time an unrelated render happens during the charm's display
    // window. Use a negative animation-delay based on how long the charm
    // has actually been showing so the animation resumes in place instead
    // of snapping back and replaying.
    if (!state.activeCharmClosing) {
      const elapsed = state.activeCharmStartedAt ? Date.now() - state.activeCharmStartedAt : 0;
      activation.style.animationDelay = `-${Math.max(0, elapsed)}ms`;
    }
    
    const orb = document.createElement("div");
    orb.className = "charm-activation-orb";
    orb.innerHTML = window.AnteArt ? AnteArt.icon(state.activeCharm) : activationIcon(state.activeCharm.name);
    activation.appendChild(orb);
    
    const text = document.createElement("div");
    text.className = "charm-activation-text";
    text.style.color = state.activeCharm.color;
    text.innerHTML = `<strong>${state.activeCharm.name}</strong><br>${state.activeCharm.desc}`;
    activation.appendChild(text);
    
    app.appendChild(activation);
  }

  // ===== BOOSTER PACK (pick one) =====
  if (state.packOpen) app.appendChild(PackOverlay());
  if (state.packToast && Date.now() - state.packToast.at < 2400) {
    const t = document.createElement("div");
    t.className = "pack-toast";
    t.style.animationDelay = -(Date.now() - state.packToast.at) + "ms";
    t.textContent = state.packToast.text;
    app.appendChild(t);
  }

  // ===== CARD NOTE (double-tap a card with a sleeve/stamp) =====
  if (state.cardNote) {
    const noteEl = CardNote();
    if (noteEl) app.appendChild(noteEl);
  }

  // ===== GEAR DETAIL (tap an artifact/item on the shelf) =====
  if (state.gearDetail) {
    const detail = GearDetail();
    if (detail) app.appendChild(detail);
  }

  // ===== DECK PEEK MODAL =====
  if (state.deckOverlayOpen) {
    app.appendChild(renderDeckModal());
  }

  if (MENU.pause) app.appendChild(PauseMenu());
  // A screen that was already up stays still instead of fading/dealing in again.
  if (hadPack) { const po = app.querySelector(".pack-overlay"); if (po) po.classList.add("stay"); }
  if (hadPause) app.querySelectorAll(".pause-back").forEach((el) => el.classList.add("stay"));
  syncLoopingAnimations();
  fitShop();
  applyCardFlip(oldCardRects, wasFullDeal);
}

// Every render rebuilds the screen, which would restart looping animations
// (floating cards, spinning rays) and make them jump. Pinning them all to the
// same start time keeps each one exactly where it was.
function syncLoopingAnimations() {
  if (!document.getAnimations) return;
  for (const a of document.getAnimations()) {
    try { if (a.effect && a.effect.getTiming().iterations === Infinity && a.startTime !== 0) a.startTime = 0; } catch (e) {}
  }
}

// Portrait shop: shrink the wares until the whole panel fits, so it never
// needs scrolling. (It still scrolls as a last resort on tiny screens.)
function fitShop() {
  const shop = document.querySelector(".shop-overlay .bshop");
  if (!shop || isLandscape()) return;
  const over = () => shop.scrollHeight - shop.clientHeight;
  if (over() <= 1) return;
  const face = shop.querySelector(".bshop-wares .bcard-face");
  let w = Math.floor(face ? face.getBoundingClientRect().width : 84);
  shop.classList.add("tight");
  shop.style.setProperty("--face", w + "px");
  for (let i = 0; i < 16 && over() > 1 && w > 40; i++) {
    w -= 3;
    shop.style.setProperty("--face", w + "px");
  }
}

/* ============================== GEAR SHELF ==============================
   Artifacts (charms) and items sit on a shelf across the top of the table,
   drawn as what they are. Tap one to read it. Drag one and drop zones light
   up: Sell (and Use, for items); dropping it back on its own shelf moves it
   to that spot. When a shelf holds more than fits, the pieces overlap. */
const SHELF_PIECE = 46;

function sellValue(def) {
  return Math.max(1, Math.floor((def.price / 2) * voucherBest("sellMultiplier", Math.max))) + (def.sellBonus || 0);
}

function sellItem(uid) {
  const item = state.items.find((i) => i.uid === uid);
  if (!item) return;
  state.money += sellValue(item);
  state.items = state.items.filter((i) => i.uid !== uid);
  noteSold();
  saveGame();
  render();
}

function shelfWidths() {
  const total = isLandscape()
    ? Math.min(Math.round(window.innerWidth * 0.52) - 76, 640)
    : Math.min(window.innerWidth - 32, 640);
  const gap = 12;
  const charmsW = Math.round((total - gap) * 0.6);
  return { total, gap, charmsW, itemsW: total - gap - charmsW };
}

// Horizontal step between pieces: their natural spacing, shrinking (so the
// pieces overlap) once the row would otherwise overflow its width.
function shelfStep(count, width) {
  if (count <= 1) return SHELF_PIECE + 6;
  return Math.max(6, Math.min(SHELF_PIECE + 6, (width - SHELF_PIECE) / (count - 1)));
}

function GearShelf() {
  const { gap, charmsW, itemsW } = shelfWidths();
  const shelf = document.createElement("div");
  shelf.className = "gear-shelf";
  shelf.style.gap = gap + "px";
  shelf.appendChild(ShelfGroup("charm", state.charms, state.charmSlots + state.charms.filter((c) => c.sleeve === "negative").length, charmsW, "Artifacts"));
  shelf.appendChild(ShelfGroup("item", state.items, getEffectiveItemSlots(), itemsW, "Items"));
  return shelf;
}

function ShelfGroup(kind, list, slots, width, title) {
  const group = document.createElement("div");
  group.className = "shelf-group shelf-" + kind;
  group.style.width = width + "px";

  const label = document.createElement("div");
  label.className = "shelf-label";
  label.innerHTML = `<span>${title}</span><span class="shelf-count">${kind === "charm" ? charmsUsed() : list.length}/${kind === "charm" ? state.charmSlots : slots}</span>`;
  if (kind === "item" && state.vouchers.length > 0) {
    const v = document.createElement("button");
    v.className = "shelf-vouchers";
    v.textContent = `${state.vouchers.length} voucher${state.vouchers.length > 1 ? "s" : ""}`;
    v.onclick = () => { state.gearDetail = { kind: "vouchers", at: Date.now() }; render(); };
    label.appendChild(v);
  }
  group.appendChild(label);

  const row = document.createElement("div");
  row.className = "shelf-row";
  row.dataset.kind = kind;
  row.style.height = SHELF_PIECE + 6 + "px";
  const total = Math.max(slots, list.length);
  const step = shelfStep(total, width);
  for (let i = list.length; i < slots; i++) {
    const ghost = document.createElement("div");
    ghost.className = "shelf-ghost";
    ghost.style.left = i * step + "px";
    ghost.style.width = ghost.style.height = SHELF_PIECE + "px";
    row.appendChild(ghost);
  }
  list.forEach((def, i) => {
    const piece = document.createElement("div");
    const firing = state.activeCharm && state.activeCharm.uid === def.uid;
    const overflow = kind === "item" && i >= slots;
    piece.className = "shelf-piece" + (firing ? " firing" : "") + (overflow ? " overflow" : "") + (def.sleeve && kind === "charm" ? " csl-" + def.sleeve : "");
    piece.dataset.uid = def.uid;
    piece.style.left = i * step + "px";
    piece.style.width = piece.style.height = SHELF_PIECE + "px";
    piece.style.zIndex = i + 1;
    piece.innerHTML = AnteArt.icon(def) + (kind === "charm" ? progressOverlay(def) : "");
    attachShelfDrag(piece, kind, def);
    row.appendChild(piece);
  });
  group.appendChild(row);
  return group;
}

// Tap = details. Drag = lift the piece; Sell/Use zones appear, and its own
// shelf accepts it at a new position. Listeners live on window and the drag
// layer on <body>, so a render() mid-drag (timers, activations) can't break it.
function attachShelfDrag(piece, kind, def) {
  piece.addEventListener("pointerdown", (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY;
    const rect = piece.getBoundingClientRect();
    let drag = null;

    const zonesFor = () => {
      const zones = [];
      if (kind === "item") zones.push({ action: "use", label: "Use", sub: def.name });
      zones.push({ action: "sell", label: `Sell $${sellValue(def)}`, sub: def.name });
      return zones;
    };

    const begin = () => {
      const layer = document.createElement("div");
      layer.className = "gear-drag-layer";
      const zoneWrap = document.createElement("div");
      zoneWrap.className = "gear-drop-zones";
      const zones = zonesFor().map((z) => {
        const el = document.createElement("div");
        el.className = "gear-drop-zone zone-" + z.action;
        el.innerHTML = `<div class="zone-label serif">${z.label}</div><div class="zone-sub">${z.sub}</div>`;
        zoneWrap.appendChild(el);
        return { ...z, el };
      });
      layer.appendChild(zoneWrap);
      const ghost = document.createElement("div");
      ghost.className = "gear-drag-ghost";
      ghost.style.width = ghost.style.height = rect.width + "px";
      ghost.innerHTML = AnteArt.icon(def);
      layer.appendChild(ghost);
      const marker = document.createElement("div");
      marker.className = "shelf-insert-marker";
      layer.appendChild(marker);
      document.body.appendChild(layer);
      piece.classList.add("lifted");
      drag = { layer, ghost, zones, marker, target: null };
    };

    const findRow = () => document.querySelector(`.shelf-row[data-kind="${kind}"]`);

    const insertIndex = (row, x) => {
      const pieces = Array.from(row.querySelectorAll(".shelf-piece")).filter((p) => p.dataset.uid !== def.uid);
      let idx = pieces.length;
      for (let i = 0; i < pieces.length; i++) {
        const r = pieces[i].getBoundingClientRect();
        if (x < r.left + r.width / 2) { idx = i; break; }
      }
      return { idx, pieces };
    };

    const move = (ev) => {
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      if (!drag) {
        if (Math.hypot(dx, dy) < 6) return;
        begin();
      }
      ev.preventDefault();
      drag.ghost.style.transform = `translate(${ev.clientX - rect.width / 2}px, ${ev.clientY - rect.height / 2}px) scale(1.15)`;
      drag.target = null;
      drag.zones.forEach((z) => {
        const r = z.el.getBoundingClientRect();
        const hot = ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom;
        z.el.classList.toggle("hot", hot);
        if (hot) drag.target = { type: "zone", action: z.action };
      });
      const row = findRow();
      drag.marker.style.display = "none";
      if (!drag.target && row) {
        const r = row.getBoundingClientRect();
        if (ev.clientX >= r.left - 12 && ev.clientX <= r.right + 12 && ev.clientY >= r.top - 18 && ev.clientY <= r.bottom + 18) {
          const { idx, pieces } = insertIndex(row, ev.clientX);
          const ref = pieces[idx] ? pieces[idx].getBoundingClientRect() : null;
          const last = pieces[pieces.length - 1] ? pieces[pieces.length - 1].getBoundingClientRect() : null;
          const x = ref ? ref.left - 3 : last ? last.right + 3 : r.left;
          drag.marker.style.display = "block";
          drag.marker.style.left = x + "px";
          drag.marker.style.top = r.top + "px";
          drag.marker.style.height = r.height + "px";
          drag.target = { type: "reorder", idx };
        }
      }
    };

    const end = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", end);
      window.removeEventListener("pointercancel", end);
      if (!drag) {
        state.gearDetail = { kind, uid: def.uid, at: Date.now() };
        render();
        return;
      }
      drag.layer.remove();
      const t = drag.target;
      if (t && t.type === "zone" && t.action === "sell") {
        if (kind === "charm") sellCharm(def.uid); else sellItem(def.uid);
      } else if (t && t.type === "zone" && t.action === "use") {
        render();
        useItem(def.uid);
      } else if (t && t.type === "reorder") {
        const key = kind === "charm" ? "charms" : "items";
        const rest = state[key].filter((d) => d.uid !== def.uid);
        rest.splice(Math.min(t.idx, rest.length), 0, state[key].find((d) => d.uid === def.uid));
        state[key] = rest;
        saveGame();
        render();
      } else {
        render();
      }
    };
    window.addEventListener("pointermove", move, { passive: false });
    window.addEventListener("pointerup", end);
    window.addEventListener("pointercancel", end);
  });
}

function GearDetail() {
  const d = state.gearDetail;
  const close = () => { state.gearDetail = null; render(); };
  const backdrop = document.createElement("div");
  backdrop.className = "shop-detail-backdrop";
  // The detail opens on pointerup, and that same tap's click then lands on
  // this freshly drawn backdrop. Ignore backdrop taps for a moment so it
  // doesn't close the instant it opens.
  backdrop.onclick = (e) => {
    if (e.target !== backdrop) return;
    if (Date.now() - (d.at || 0) < 450) return;
    close();
  };
  const card = document.createElement("div");
  card.className = "shop-detail-card";

  if (d.kind === "hands") {
    card.innerHTML = `<div class="shop-detail-type">HAND LEVELS</div><div class="hand-levels"><div class="hl-row hl-head"><span>Level</span><span>Hand</span><span>Played</span><span>Chips × Mult</span></div>` +
      Object.keys(HAND_TABLE).map((h) => {
        const b = handBase(h), lv = handLevel(h);
        const played = (state.handTypeCounts || {})[h] || 0;
        return `<div class="hl-row${lv > 1 ? " up" : ""}"><span class="hl-lv">Lv ${lv}</span><span class="hl-name">${h}</span><span class="hl-played${played ? " has" : ""}">${played}×</span><span class="hl-val"><b class="c">${b.chips}</b> × <b class="m">${b.mult}</b></span></div>`;
      }).join("") + `</div><div class="detail-hint">Star Charts level a hand up. "Played" counts this run. Tap a hand's name above your cards to see this.</div>`;
  } else if (d.kind === "vouchers") {
    card.innerHTML = `<div class="shop-detail-type">VOUCHERS REDEEMED</div>` +
      state.vouchers.map((v) => `<div class="voucher-line"><div class="voucher-line-art">${AnteArt.icon(v)}</div><div><div class="voucher-line-name serif">${v.name}</div><div class="voucher-line-desc">${v.desc}</div></div></div>`).join("");
  } else {
    const list = d.kind === "charm" ? state.charms : state.items;
    const def = list.find((x) => x.uid === d.uid);
    if (!def) { state.gearDetail = null; return null; }
    card.style.setProperty("--glow", def.color);
    let extra = "";
    if (def.effect.type === "ratchetBossMult") extra = ` (currently +${def.ratchetBonus || 0})`;
    if (def.effect.type === "oracleCompoundMult") extra = ` (currently X${(def.oracleMultBonus || 1).toFixed(2)})`;
    if (def.effect.type === "saintFaceDestroyedX") extra = ` (currently X${def.saintX || 1})`;
    if (def.effect.type === "lanternDiscardX") extra = ` (currently X${1 + Math.floor((def.lanternDiscards || 0) / def.effect.per)}, ${def.effect.per - ((def.lanternDiscards || 0) % def.effect.per)} discards to go)`;
    if (def.effect.type === "copyRight" || def.effect.type === "copyLeftmost") { const t = copyTarget(def); extra = t ? ` (copying ${t.name})` : " (nothing to copy right now)"; }
    if (def.effect.type === "mirrorsAddedX") extra = ` (currently X${(1 + (state.cardsAddedRun || 0) * def.effect.value).toFixed(1)})`;
    card.innerHTML = `
      <div class="detail-art">${AnteArt.icon(def)}</div>
      <div class="shop-detail-type">${d.kind === "charm" ? "ARTIFACT" : "ITEM"}</div>
      <div class="shop-detail-name serif">${def.name}</div>
      <div class="shop-detail-desc">${def.desc}${extra}</div>
      ${d.kind === "charm" ? charmSleeveLine(def) + progressBlock(def) : ""}
      <div class="detail-hint">Drag it ${d.kind === "item" ? "to <b>Use</b> or <b>Sell</b>" : "to <b>Sell</b>"}, or along the shelf to move it.</div>
    `;
  }
  const closeBtn = document.createElement("button");
  closeBtn.className = "shop-detail-close";
  closeBtn.textContent = "✕";
  closeBtn.onclick = close;
  card.appendChild(closeBtn);
  backdrop.appendChild(card);
  return backdrop;
}

/* ============================== SHOP UI ============================== */
function ShopOverlay() {
  const overlay = document.createElement("div");
  overlay.className = "shop-overlay";

  const hasStock = state.shopStock.some((item) => item);
  const shopDiscount = shopDiscountFactor();

  // ===== HEADER: title/subtitle left, deck peek + money right ===== 
  const header = document.createElement("div");
  header.className = "shop-header-row";

  const headerLeft = document.createElement("div");
  headerLeft.className = "shop-header-left";
  const title = document.createElement("div");
  title.className = "shop-title serif";
  title.textContent = "The Shop";
  headerLeft.appendChild(title);
  const sub = document.createElement("div");
  sub.className = "shop-sub";
  sub.textContent = "Tap anything for details · drag yours to sell";
  headerLeft.appendChild(sub);
  header.appendChild(headerLeft);

  const headerRight = document.createElement("div");
  headerRight.className = "shop-header-right";
  const deckCorner = document.createElement("div");
  deckCorner.className = "shop-deck-corner";
  deckCorner.appendChild(renderDeckWidget());
  headerRight.appendChild(deckCorner);
  const money = document.createElement("div");
  money.className = "shop-money serif";
  money.textContent = "$" + state.money;
  headerRight.appendChild(money);
  headerRight.appendChild(OptionsButton("compact"));
  header.appendChild(headerRight);

  overlay.appendChild(header);

  // ===== YOUR SHELF: what you own, drag to sell/rearrange right here =====
  overlay.appendChild(GearShelf());

  // ===== THE SHOP: one big panel. Top: Next Round / Reroll beside the wares.
  // Bottom: this ante's voucher on its stand, and the booster packs. =====
  const shop = document.createElement("div");
  shop.className = "bshop";
  shop.innerHTML = `<div class="bshop-sign serif"><span>Shop</span></div>`;

  const top = document.createElement("div");
  top.className = "bshop-top";
  const actions = document.createElement("div");
  actions.className = "bshop-actions";
  const nextBtn = document.createElement("button");
  nextBtn.className = "bbtn bbtn-red";
  nextBtn.innerHTML = `<span class="bbtn-big">Next</span><span class="bbtn-big">Round</span>`;
  nextBtn.onclick = leaveShop;
  const rerollBtn = document.createElement("button");
  rerollBtn.className = "bbtn bbtn-green";
  rerollBtn.disabled = state.money < state.rerollCost;
  rerollBtn.innerHTML = `<span class="bbtn-small">Reroll</span><span class="bbtn-big">$${state.rerollCost}</span>`;
  rerollBtn.onclick = rerollShop;
  actions.append(nextBtn, rerollBtn);
  top.appendChild(actions);

  const wares = document.createElement("div");
  wares.className = "bshop-wares bwell";
  if (!hasStock) wares.innerHTML = `<div class="bshop-soldout serif">Sold out</div>`;
  else state.shopStock.forEach((item, i) => {
    const card = document.createElement("div");
    if (!item) {
      card.className = "bcard sold";
      card.innerHTML = `<div class="bcard-face"></div>`;
      wares.appendChild(card);
      return;
    }
    const price = shopPriceFor(item);
    const slotsFull = item.type === "playing" ? false : item.type === "charm" ? item.sleeve !== "negative" && charmsUsed() >= state.charmSlots : state.items.length >= getEffectiveItemSlots();
    const legendary = item.rarity === "legendary";
    card.className = `bcard kind-${item.type}${legendary ? " legendary" : ""}${state.money < price ? " poor" : ""}`;
    card.style.setProperty("--glow", item.color || "#C9A227");
    card.innerHTML = `
      <span class="bprice">${price < item.price ? `<s>$${item.price}</s>` : ""}$${price}</span>
      <div class="bcard-face full${item.type === "playing" ? " is-playing-ware" : ""}"><div class="bcard-art">${item.type === "playing" ? "" : AnteArt.card({ ...item, arcana: item.type === "item" && !item.chart && !ARCANA_EXCLUDE.has(item.id) })}</div></div>
      <div class="bcard-name">${item.name}</div>${item.sleeve && CHARM_SLEEVES[item.sleeve] ? `<span class="bcard-sleeve" style="--sc:${CHARM_SLEEVES[item.sleeve].color}">${CHARM_SLEEVES[item.sleeve].name}</span>` : ""}
      <button class="bbuy" ${state.money < price || slotsFull ? "disabled" : ""}>${slotsFull ? "Full" : "Buy"}</button>`;
    if (item.type === "playing") card.querySelector(".bcard-art").appendChild(playingCardEl(item.card, 1.25));
    card.querySelector(".bbuy").onclick = (e) => { e.stopPropagation(); buyItem(i); };
    card.addEventListener("click", (e) => { if (!e.target.closest(".bbuy")) openShopDetail("stock", i); });
    wares.appendChild(card);
  });
  top.appendChild(wares);
  shop.appendChild(top);

  const bottom = document.createElement("div");
  bottom.className = "bshop-bottom";

  // This ante's voucher, standing on its plinth.
  const vslot = document.createElement("div");
  vslot.className = "bshop-voucher bwell";
  const nextAnte = state.blindIdx === 2 ? state.ante + 1 : state.ante;
  vslot.innerHTML = `<div class="bwell-label">Ante ${nextAnte} Voucher</div>`;
  const voucherIdx = state.voucherStock.findIndex((v) => v);
  const voucher = state.voucherStock[voucherIdx];
  if (voucher) {
    const v = document.createElement("div");
    v.className = "bvoucher" + (state.money < voucher.price ? " poor" : "");
    v.innerHTML = `
      <span class="bprice">$${voucher.price}</span>
      <div class="bvoucher-art">${AnteArt.voucher(voucher)}</div>
      <div class="bvoucher-plinth"></div>
      <div class="bcard-name">${voucher.name}</div>
      <button class="bbuy bbuy-redeem" ${state.money < voucher.price ? "disabled" : ""}>Redeem</button>`;
    v.querySelector(".bbuy").onclick = (e) => { e.stopPropagation(); buyVoucher(voucherIdx); };
    v.addEventListener("click", (e) => { if (!e.target.closest(".bbuy")) openShopDetail("voucher", voucherIdx); });
    vslot.appendChild(v);
  } else {
    const redeemed = state.voucherStock.length > 0;
    const fresh = redeemed && state.redeemedAt && Date.now() - state.redeemedAt < 1500;
    vslot.insertAdjacentHTML("beforeend", `<div class="bvoucher empty"><div class="bvoucher-ghost">${redeemed ? `<span class="bredeemed serif${fresh ? " fresh" : ""}">Redeemed</span>` : `<span class="bvoucher-none">A new voucher comes after the boss</span>`}</div><div class="bvoucher-plinth"></div></div>`);
  }
  bottom.appendChild(vslot);

  // Booster packs.
  const packs = document.createElement("div");
  packs.className = "bshop-packs bwell";
  packs.innerHTML = `<div class="bwell-label">Booster Packs</div>`;
  const packRow = document.createElement("div");
  packRow.className = "bpack-row";
  (state.packStock || []).forEach((pack, i) => {
    const el = document.createElement("div");
    if (!pack) {
      el.className = "bcard is-pack sold";
      el.innerHTML = `<div class="bcard-face"></div>`;
      packRow.appendChild(el);
      return;
    }
    const price = shopPriceFor(pack);
    el.className = "bcard is-pack" + (pack.rare ? " legendary" : "") + (state.money < price ? " poor" : "");
    el.innerHTML = `
      <span class="bprice">${price < pack.price ? `<s>$${pack.price}</s>` : ""}$${price}</span>
      <div class="bcard-face"><div class="bcard-art">${AnteArt.icon(pack)}</div></div>
      <div class="bcard-name">${pack.name}</div>
      <button class="bbuy" ${state.money < price ? "disabled" : ""}>Open</button>`;
    el.querySelector(".bbuy").onclick = (e) => { e.stopPropagation(); buyPack(i); };
    el.addEventListener("click", (e) => { if (!e.target.closest(".bbuy")) openShopDetail("pack", i); });
    packRow.appendChild(el);
  });
  packs.appendChild(packRow);
  bottom.appendChild(packs);
  shop.appendChild(bottom);
  overlay.appendChild(shop);

  // ===== DETAIL POPUP: full name/description for whichever slot was tapped =====
  if (state.shopDetail) {
    const { kind, index } = state.shopDetail;
    const entry = kind === "voucher" ? state.voucherStock[index] : kind === "pack" ? (state.packStock || [])[index] : state.shopStock[index];
    if (entry) {
      const backdrop = document.createElement("div");
      backdrop.className = "shop-detail-backdrop";
      backdrop.onclick = (e) => { if (e.target === backdrop) closeShopDetail(); };

      const card = document.createElement("div");
      card.className = "shop-detail-card";
      card.style.setProperty("--glow", entry.color);

      const isVoucher = kind === "voucher";
      const discountedPrice = isVoucher ? entry.price : shopPriceFor(entry);
      const disabled = isVoucher
        ? state.money < entry.price
        : kind === "pack" ? state.money < discountedPrice : (state.money < discountedPrice) || (entry.type === "playing" ? false : entry.type === "charm"
            ? entry.sleeve !== "negative" && charmsUsed() >= state.charmSlots
            : state.items.length >= getEffectiveItemSlots());
      const isPack = kind === "pack";
      const typeLabel = entry.type === "playing" ? "PLAYING CARD" : isVoucher ? (entry.tier === 2 ? "VOUCHER · UPGRADE" : "VOUCHER") : isPack ? "BOOSTER PACK" : entry.rarity === "legendary" ? "LEGENDARY ARTIFACT" : (entry.type === "charm" ? "ARTIFACT" : "ITEM");
      const slotsFull = !isVoucher && !isPack && entry.type === "charm"
        ? entry.sleeve !== "negative" && charmsUsed() >= state.charmSlots
        : (!isVoucher && !isPack && state.items.length >= getEffectiveItemSlots());

      // Set all static content in a single innerHTML assignment first — appending
      // the close button afterwards (rather than before, via +=) avoids the whole
      // card being re-serialized and re-parsed, which would silently strip any
      // JS-assigned onclick handler already attached to a live child element.
      card.innerHTML = `
        <div class="detail-art${isVoucher || entry.type === "charm" || entry.type === "item" ? " is-voucher" : ""}">${entry.type === "charm" || entry.type === "item" ? AnteArt.card(entry) : entry.type === "playing" ? "" : AnteArt.icon(entry)}</div>
        <div class="shop-detail-type">${typeLabel}</div>
        <div class="shop-detail-name serif">${entry.name}</div>
        <div class="shop-detail-desc">${entry.desc}</div>
        ${isVoucher ? voucherHint(entry) : charmSleeveLine(entry)}
        <div class="shop-detail-price">${!isVoucher && shopDiscount < 1 ? `<s>$${entry.price}</s> $${discountedPrice}` : `$${discountedPrice}`}</div>
        <button class="shop-detail-buy-btn" ${disabled ? "disabled" : ""}>${slotsFull ? "Slots Full" : disabled ? "Can't Afford" : isVoucher ? "Redeem" : isPack ? "Open" : "Buy"}</button>
      `;
      card.querySelector(".shop-detail-buy-btn").onclick = () => {
        if (isVoucher) buyVoucher(index); else if (isPack) { closeShopDetail(); buyPack(index); return; } else buyItem(index);
        closeShopDetail();
      };

      if (entry.type === "playing") card.querySelector(".detail-art").appendChild(playingCardEl(entry.card, 1.3));
      const closeBtn = document.createElement("button");
      closeBtn.className = "shop-detail-close";
      closeBtn.textContent = "✕";
      closeBtn.onclick = closeShopDetail;
      card.appendChild(closeBtn);

      backdrop.appendChild(card);
      overlay.appendChild(backdrop);
    }
  }

  return overlay;
}

window.addEventListener("resize", render);
window.addEventListener("orientationchange", render);

// Open on the main menu. A saved run is loaded behind it, ready to continue.
applySkins();
loadGame();
render();
</script>
