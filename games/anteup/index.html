      state.activeCharmClosing = true;
      render();

      setTimeout(() => {
        state.activeCharm = null;
        state.activeCharmStartedAt = null;
        state.activeCharmClosing = false;
        render();
      }, 300);
    }, 600);
  }, 300);
}


/* ============================== SCORING ENGINE ==============================
   Works a hand out the way it is shown: as an ordered list of trigger events.
     1. the hand type's base Chips and Mult
     2. each scoring card, left to right: its chips, Gold stamp money, Molt
        marks and every artifact that cares about that card. A retrigger
        (Crimson stamp, Low Tide, Encore Mask, Eternal Engine, Calculator,
        The Empress) plays the whole card again, marked "Again!"
     3. cards held in hand (Duke, Gilded Hand)
     4. artifacts that act on the whole hand, left to right along the shelf
     5. next-hand boosts from items, the Boss Blind, the run multiplier
   Each event carries the running Chips and Mult after it, so the animation
   can simply step through them. live=false is the preview: no luck rolls. */
const FACE_RANKS = ["J", "Q", "K"];
// Artifact effects resolved per scoring card (step 2) or per held card (step 3).
const PER_CARD_EFFECTS = new Set([
  "crownFaceCardMult", "prismChipsPerCard", "abacusCardChipsBoost", "blueprintSleeveChips",
  "midasGoldStampChips", "redThreadCrimsonMult", "curatorStampedCardChips", "spiralRanksMult",
  "evenRanksMult", "oddRanksChips", "portraitFirstFaceX", "thronesKingQueenX", "hydraSleeveX",
  "heartstoneChance", "dukeKingMult", "gildedHeldX",
]);
// Whole-hand artifact effects that multiply Mult (the rest add).
const X_EFFECTS = new Set([
  "pppEncore", "dukeKingMult", "monumentHandTypeMult", "amplifierMultX", "alchemistDoubleMultNoDiscards",
  "oracleCompoundMult", "zenithLastPlayMult", "cascadeMultPerExtraCard", "solitaireHighCardX", "duetPairX",
  "checkmateStraightX", "firstHandX", "midnightSunX", "grandLedgerX", "chainsNoDiscardX", "rainbowAllSuitsX",
  "tidepoolFlushX", "mirrorsAddedX", "saintFaceDestroyedX", "lanternDiscardX",
]);

function fmtNum(n) {
  const r = Math.round(n * 100) / 100;
  return Number.isInteger(r) ? String(r) : r.toFixed(2).replace(/0$/, "");
}

// Preview: a played hand counts itself before it scores (hands played, hand
// types this round, Streak, Monument, last play), so the preview does the same
// on a scratch copy of those counters and then puts them back.
function previewScore(selectedCards) {
  const base = evaluateSelection(selectedCards);
  if (!base) return null;
  const keys = ["handTypesPlayedThisRound", "handTypeCounts", "streakCounter", "handsPlayedRun", "isLastPlayThisRound", "consecutiveHandsWithoutMostPlayed"];
  const saved = {};
  keys.forEach((k) => { saved[k] = state[k]; });
  try {
    state.handTypesPlayedThisRound = [...(state.handTypesPlayedThisRound || []), base.name];
    state.handTypeCounts = { ...(state.handTypeCounts || {}), [base.name]: ((state.handTypeCounts || {})[base.name] || 0) + 1 };
    state.streakCounter = (state.streakCounter || 0) + 1;
    state.handsPlayedRun = (state.handsPlayedRun || 0) + 1;
    state.isLastPlayThisRound = state.playsLeft - 1 === 0;
    if (state.charms.some((c) => c.effect.type === "monumentHandTypeMult") && state.mostPlayedHandType && base.name !== state.mostPlayedHandType) {
      state.consecutiveHandsWithoutMostPlayed = (state.consecutiveHandsWithoutMostPlayed || 0) + 1;
    }
    return scoreHand(selectedCards, { live: false });
  } finally {
    keys.forEach((k) => { state[k] = saved[k]; });
  }
}

function scoreHand(selectedCards, { live = false } = {}) {
  const base = evaluateSelection(selectedCards);
  if (!base) return null;
  const hb = handBase(base.name);
  let chips = hb.chips, mult = hb.mult, money = 0;
  const events = [];
  const push = (ev) => events.push({ ...ev, chips, mult });
  push({ target: "hand", kind: "base", text: base.name });
  if (state.nextHandDoubleBase) {
    chips += hb.chips; mult += hb.mult;
    push({ target: "hand", kind: "chips", text: "Double Down" });
  }

  // scoring cards in the order they sit in the hand
  const order = getSortedHand().map((c) => c.id);
  const cards = [...base.scoringCards].sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
  // Live-only growth that depends on this hand's cards, done before scoring.
  if (live) {
    const leeches = state.charms.filter((c) => c.effect.type === "leechX");
    if (leeches.length) {
      let eaten = 0;
      cards.forEach((c) => { if (c.sleeve || c.stamp) { eaten++; c.sleeve = undefined; c.stamp = undefined; } });
      if (eaten) leeches.forEach((l) => { l.leechBonus = (l.leechBonus || 0) + eaten * l.effect.value; });
    }
    const anyFace = cards.some((c) => isFace(c));
    state.charms.forEach((c) => {
      if (c.effect.type === "commuterMult") c.busCount = anyFace ? 0 : (c.busCount || 0) + 1;
      if (c.effect.type === "deuceChips") c.deuceBonus = (c.deuceBonus || 0) + cards.filter((x) => x.rank === "2" && !isCardDebuffed(x)).length * c.effect.value;
    });
  }
  const charms = effectiveCharms();
  const has = (type) => charms.find((c) => c.effect.type === type);
  const calc = has("calculatorReplay");
  const calculatorFires = live && calc && Math.random() < Math.min(1, calc.effect.chance * chanceMultiplier());
  const heart = has("heartstoneChance");
  let portraitCardId = null;
  const firstFace = cards.find((c) => !isCardDebuffed(c) && isFace(c));
  if (firstFace) portraitCardId = firstFace.id;

  cards.forEach((card) => {
    if (isCardDebuffed(card)) {
      push({ target: "card", id: card.id, kind: "info", text: "Debuffed" });
      return;
    }
    // every way this card gets played again
    const again = [];
    if (card.stamp === "crimson") again.push({ label: "Crimson" });
    const engine = has("engineRetrigger");
    if (engine) again.push({ label: engine.name, uid: engine.uid });
    const tide = has("lowTideRetrigger");
    if (tide && ["2", "3", "4", "5"].includes(card.rank)) again.push({ label: tide.name, uid: tide.uid });
    const mask = has("maskFaceRetrigger");
    if (mask && isFace(card)) again.push({ label: mask.name, uid: mask.uid });
    if (calculatorFires) again.push({ label: calc.name, uid: calc.uid });
    if (state.nextHandRetrigger) again.push({ label: "The Empress" });
    charms.forEach((c) => {
      if (c.effect.type === "fizzRetrigger" && (c.fizzLeft ?? c.effect.hands) > 0) again.push({ label: c.name, uid: c.uid });
      if (c.effect.type === "twilightRetrigger" && state.isLastPlayThisRound) again.push({ label: c.name, uid: c.uid });
    });

    [{ label: null }, ...again].forEach((round, k) => {
      if (k > 0) push({ target: "card", id: card.id, kind: "again", text: "Again!", sub: round.label, from: round.uid });
      const cardChips = rankChipValue(card.rank) + (card.sleeve === "sparkler" ? 20 : 0) + (card.bonusChips || 0);
      chips += cardChips;
      push({ target: "card", id: card.id, kind: "chips", text: `+${cardChips}` });
      // Trail Mark: the card keeps +5 Chips for good, every time it scores.
      if (live) charms.filter((c) => c.effect.type === "trailMark").forEach((c) => {
        card.bonusChips = (card.bonusChips || 0) + c.effect.value;
        push({ target: "card", id: card.id, kind: "info", text: "Marked +5", from: c.uid });
      });
      if (card.stamp === "gold") {
        money += 3;
        push({ target: "card", id: card.id, kind: "money", text: "+$3" });
      }
      if (card.moltBuff) {
        mult += card.moltBuff;
        push({ target: "card", id: card.id, kind: "mult", text: `+${card.moltBuff} Mult` });
      }
      charms.forEach((c) => {
        const e = c.effect;
        const addC = (n) => { chips += n; push({ target: "card", id: card.id, kind: "chips", text: `+${fmtNum(n)}`, from: c.uid }); };
        const addM = (n) => { mult += n; push({ target: "card", id: card.id, kind: "mult", text: `+${fmtNum(n)} Mult`, from: c.uid }); };
        const xM = (n) => { mult *= n; push({ target: "card", id: card.id, kind: "xmult", text: `X${fmtNum(n)} Mult`, from: c.uid }); };
        switch (e.type) {
          case "crownFaceCardMult": if (isFace(card)) addM(e.value); break;
          case "prismChipsPerCard": addC(e.value); break;
          case "abacusCardChipsBoost": addC(Math.round(rankChipValue(card.rank) * e.value)); break;
          case "blueprintSleeveChips": if (card.sleeve) addC(e.value); break;
          case "midasGoldStampChips": if (card.stamp === "gold") addC(e.value); break;
          case "redThreadCrimsonMult": if (card.stamp === "crimson") addM(e.value); break;
          case "curatorStampedCardChips": if (card.stamp) addC(e.value); break;
          case "spiralRanksMult": if (["A", "2", "3", "5", "8"].includes(card.rank)) addM(e.value); break;
          case "evenRanksMult": if (["2", "4", "6", "8", "10"].includes(card.rank)) addM(e.value); break;
          case "oddRanksChips": if (["A", "3", "5", "7", "9"].includes(card.rank)) addC(e.value); break;
          case "portraitFirstFaceX": if (card.id === portraitCardId) xM(e.value); break;
          case "thronesKingQueenX": if (card.rank === "K" || card.rank === "Q") xM(e.value); break;
          case "hydraSleeveX": if (card.sleeve) xM(e.value); break;
          case "heartstoneChance":
            if (live && card.suit === "hearts" && Math.random() < Math.min(1, e.chance * chanceMultiplier())) xM(e.value);
            break;
          default: break;
        }
      });
    });
  });
  const chipsAfterCards = chips;

  // cards held in hand
  // (Understudy plays every held-in-hand effect once more.)
  const held = state.hand.filter((c) => !selectedCards.some((s) => s.id === c.id));
  const heldRounds = 1 + charms.filter((c) => c.effect.type === "mimeHeld").length;
  const fists = charms.filter((c) => c.effect.type === "fistMult");
  const lowest = held.filter((c) => !isCardDebuffed(c)).reduce((lo, c) => (!lo || rankChipValue(c.rank) <= rankChipValue(lo.rank) ? c : lo), null);
  held.forEach((card) => {
    if (isCardDebuffed(card)) return;
    for (let r = 0; r < heldRounds; r++) {
      if (r > 0 && (card.rank === "K" || card.stamp === "gold" || (fists.length && card === lowest))) push({ target: "card", id: card.id, kind: "again", text: "Again!", sub: "Understudy", held: true });
      charms.forEach((c) => {
        const e = c.effect;
        if (e.type === "dukeKingMult" && card.rank === "K") { mult *= e.value; push({ target: "card", id: card.id, kind: "xmult", text: `X${fmtNum(e.value)} Mult`, from: c.uid, held: true }); }
        if (e.type === "gildedHeldX" && card.stamp === "gold") { mult *= e.value; push({ target: "card", id: card.id, kind: "xmult", text: `X${fmtNum(e.value)} Mult`, from: c.uid, held: true }); }
        if (e.type === "fistMult" && card === lowest) { const n = rankChipValue(card.rank) * 2; mult += n; push({ target: "card", id: card.id, kind: "mult", text: `+${n} Mult`, from: c.uid, held: true }); }
      });
    }
  });

  // whole-hand artifacts, in shelf order
  charms.forEach((c) => {
    const e = c.effect;
    if (PER_CARD_EFFECTS.has(e.type)) return;
    if (e.type === "gamblerMult") { mult += e.value; push({ target: "charm", uid: c.uid, kind: "mult", text: `+${e.value} Mult` }); return; }
    // the artifacts added from the genre's classics
    const addMH = (n) => { if (!n) return; mult += n; push({ target: "charm", uid: c.uid, kind: "mult", text: `+${fmtNum(n)} Mult` }); };
    const addCH = (n) => { if (!n) return; chips += n; push({ target: "charm", uid: c.uid, kind: "chips", text: `+${fmtNum(n)} Chips` }); };
    const xMH = (n) => { if (!n || n === 1) return; mult *= n; push({ target: "charm", uid: c.uid, kind: "xmult", text: `X${fmtNum(n)} Mult` }); };
    switch (e.type) {
      case "plumMult": return addMH(e.value);
      case "ripePlumX": return xMH(e.value);
      case "chalkboardX": return xMH(held.every((h) => h.suit === "spades" || h.suit === "clubs") ? e.value : 1);
      case "leechX": return xMH(1 + (c.leechBonus || 0));
      case "bonfireX": return xMH(1 + (c.bonfireBonus || 0));
      case "commuterMult": return addMH((c.busCount || 0) * e.value);
      case "stargazerX": return xMH(1 + (c.stars || 0) * e.value);
      case "sundaeChips": return addCH(c.chipsLeft ?? e.value);
      case "popcornMult": return addMH(c.multLeft ?? e.value);
      case "bullionChips": return addCH(Math.max(0, state.money) * e.value);
      case "dejaVuX": return xMH((state.handTypesPlayedThisRound || []).filter((h) => h === base.name).length >= 2 ? e.value : 1);
      case "stencilX": return xMH(Math.max(1, state.charmSlots - charmsUsed() + state.charms.filter((x) => x.effect.type === "stencilX").length));
      case "punchCardX": return xMH((state.handsPlayedRun || 0) % e.everyN === 0 ? e.value : 1);
      case "jackknifeX": return xMH(1 + (c.jackBonus || 0));
      case "deuceChips": return addCH(c.deuceBonus || 0);
      case "cosmonautLevel":
        if (live && Math.random() < Math.min(1, e.chance * chanceMultiplier())) {
          state.handLevels = { ...(state.handLevels || {}), [base.name]: handLevel(base.name) + 1 };
          push({ target: "charm", uid: c.uid, kind: "info", text: "Level up!" });
        }
        return;
      case "mimeHeld": case "fistMult": case "fizzRetrigger": case "twilightRetrigger": case "trailMark": case "splashAllScore":
      case "pareidoliaFaces": case "shortcutStraights": case "nestEgg": case "burglarHands": case "copyRight": case "copyLeftmost":
        return;
    }
    const r = applyCharmEffects({ name: base.name, totalChips: chips, totalMult: mult }, cards, [c]);
    const dc = r.totalChips - Math.round(chips);
    if (dc) { chips += dc; push({ target: "charm", uid: c.uid, kind: "chips", text: `+${fmtNum(dc)} Chips` }); }
    if (Math.abs(r.totalMult - mult) > 0.001) {
      if (X_EFFECTS.has(e.type) && mult) {
        const x = r.totalMult / mult;
        mult = r.totalMult;
        push({ target: "charm", uid: c.uid, kind: "xmult", text: `X${fmtNum(x)} Mult` });
      } else {
        const d = r.totalMult - mult;
        mult = r.totalMult;
        push({ target: "charm", uid: c.uid, kind: "mult", text: `${d >= 0 ? "+" : ""}${fmtNum(d)} Mult` });
      }
    }
  });

  // artifact sleeves, in shelf order
  charms.forEach((c) => {
    if (c.sleeve === "sparkler") { chips += 50; push({ target: "charm", uid: c.uid, kind: "chips", text: "+50 Chips" }); }
    if (c.sleeve === "gilded") { mult += 10; push({ target: "charm", uid: c.uid, kind: "mult", text: "+10 Mult" }); }
    if (c.sleeve === "prismatic") { mult *= 1.5; push({ target: "charm", uid: c.uid, kind: "xmult", text: "X1.5 Mult" }); }
  });

  // items held with a scoring effect (older item kinds)
  state.items.forEach((it) => {
    const r = applyItemEffects({ name: base.name, totalChips: chips, totalMult: mult }, cards, [it]);
    if (r.totalChips !== Math.round(chips)) { const d = r.totalChips - Math.round(chips); chips += d; push({ target: "item", uid: it.uid, kind: "chips", text: `+${d} Chips` }); }
    if (Math.abs(r.totalMult - mult) > 0.001) { mult = r.totalMult; push({ target: "item", uid: it.uid, kind: "mult", text: "Mult" }); }
  });

  // next-hand boosts from items used earlier
  if (state.nextHandChipBonus) { chips += state.nextHandChipBonus; push({ target: "hand", kind: "chips", text: `+${state.nextHandChipBonus} Chips` }); }
  if (state.nextHandDoubleChips) { chips *= 2; push({ target: "hand", kind: "chips", text: "X2 Chips" }); }
  if (state.nextHandChipsX && state.nextHandChipsX !== 1) { chips *= state.nextHandChipsX; push({ target: "hand", kind: "chips", text: `X${fmtNum(state.nextHandChipsX)} Chips` }); }
  if (state.nextHandDoubleMult) { mult *= 2; push({ target: "hand", kind: "xmult", text: "X2 Mult" }); }
  if (state.nextHandMultX && state.nextHandMultX !== 1) { mult *= state.nextHandMultX; push({ target: "hand", kind: "xmult", text: `X${fmtNum(state.nextHandMultX)} Mult` }); }
  if (state.nextHandBalance) { const avg = (chips + mult) / 2; chips = avg; mult = avg; push({ target: "hand", kind: "info", text: "Balanced" }); }

  // Boss Blind
  const boss = state.bossBlind;
  if (boss && boss.multPenaltyPerCard) {
    const m2 = Math.max(1, mult - cards.length * boss.multPenaltyPerCard);
    if (m2 !== mult) { mult = m2; push({ target: "hand", kind: "mult", text: `${boss.name}: -Mult` }); }
  }
  if (state.runMultiplier !== 1) push({ target: "hand", kind: "xmult", text: `Run X${fmtNum(state.runMultiplier)}` });

  chips = Math.round(chips);
  mult = Math.round(mult * 100) / 100;
  const score = Math.round(chips * mult * state.runMultiplier);
  return { name: base.name, scoringCards: cards, chips, mult, score, events, money, chipsAfterCards };
}

// Floating trigger label ("+11", "+4 Mult", "X2 Mult", "+$3", "Again!")
// above a card or under an artifact. Fixed to <body> so render() can't eat it.
function spawnTriggerLabel(el, text, kind, where, sub) {
  if (!el) return;
  const r = el.getBoundingClientRect();
  const lab = document.createElement("div");
  lab.className = `trig-label trig-${kind}`;
  lab.innerHTML = `<span>${text}</span>${sub ? `<small>${sub}</small>` : ""}`;
  document.body.appendChild(lab);
  const w = lab.offsetWidth, h = lab.offsetHeight;
  lab.style.left = Math.max(4, Math.min(window.innerWidth - w - 4, r.left + r.width / 2 - w / 2)) + "px";
  lab.style.top = (where === "below" ? r.bottom + 4 : r.top - h - 4) + "px";
  setTimeout(() => lab.remove(), 900);
}

function jiggleShelfPiece(uid) {
  const piece = uid && document.querySelector(`.shelf-piece[data-uid="${uid}"]`);
  if (!piece) return null;
  piece.classList.remove("trig-jiggle");
  void piece.offsetWidth;
  piece.classList.add("trig-jiggle");
  return piece;
}

// Steps through a scored hand's events: each one updates the Chips/Mult
// boxes and pops whatever fired, then the total lands.
function animateScoring(result, onDone) {
  const evs = result.events;
  const delay = Math.max(110, Math.min(360, 520 - evs.length * 14)) / gameSpeed();
  let i = 0;
  const first = evs[0];
  state.popup = { name: result.name, chips: first.chips, mult: first.mult, phase: "counting", score: null };
  state.popupStartedAt = Date.now();
  render();
  const step = () => {
    if (i >= evs.length) {
      state.popup = { ...state.popup, chips: result.chips, mult: result.mult, score: result.score, phase: "total" };
      render();
      buzz(result.score >= targetForAnte(state.ante, state.blindIdx) - state.roundScore ? [30, 40, 60] : 25);
      setTimeout(onDone, 700 / gameSpeed());
      return;
    }
    const ev = evs[i++];
    state.popup = { ...state.popup, chips: ev.chips, mult: ev.mult, bump: ev.kind };
    render();
    if (ev.target === "card") {
      const el = document.querySelector(`.hand-fan .card[data-card-id="${ev.id}"]`);
      if (el) {
        void el.offsetWidth;
        el.classList.add(ev.kind === "again" ? "card-again" : "card-ping");
        spawnTriggerLabel(el, ev.text, ev.kind, "above", ev.sub);
      }
      jiggleShelfPiece(ev.from);
    } else if (ev.target === "charm" || ev.target === "item") {
      spawnTriggerLabel(jiggleShelfPiece(ev.uid), ev.text, ev.kind, "below");
    } else if (ev.target === "hand" && ev.kind !== "base") {
      spawnTriggerLabel(document.querySelector(".score-popup .sp-boxes"), ev.text, ev.kind, "below");
    }
    setTimeout(step, ev.kind === "again" ? Math.round(delay * 1.2) : delay);
  };
  setTimeout(step, 380 / gameSpeed());
}

function triggerCharmEffects(result, cards) {
  // Process each charm and trigger effects
  let cardsToReplay = [];
  const chanceMult = chanceMultiplier();

  state.charms.forEach((charm) => {
    if (charm.effect.type === "engineRetrigger") return;
    if (charm.effect.type === "calculatorReplay") {
      if (Math.random() < Math.min(1, charm.effect.chance * chanceMult)) {
        // Trigger Calculator: replay scoring cards
        cardsToReplay = [...result.scoringCards];
        activateCharmSlide(charm, () => {
          // Charm effect was applied - cardsToReplay will be used
        });
      }
    }
  });
  
  return cardsToReplay;
}

// Spawns a floating "+N" chip label above a card element, positioned via a
// fixed-position node appended to <body> so it survives the next render()
// (which wipes and rebuilds #app) and can finish its own animation/removal.
function spawnChipFloat(el, amount) {
  if (!el || !amount) return;
  const rect = el.getBoundingClientRect();
  const float = document.createElement("div");
  float.className = "chip-float";
  float.textContent = "+" + amount;
  float.style.left = (rect.left + rect.width / 2) + "px";
  float.style.top = rect.top + "px";
  document.body.appendChild(float);
  setTimeout(() => float.remove(), 900);
}

function playHand() {
  if (state.selected.length === 0 || state.playsLeft <= 0 || state.overlay !== "playing") return;
  const selectedCards = state.hand.filter((c) => state.selected.includes(c.id));
  const baseResult = evaluateSelection(selectedCards);

  // Boss Blind hand-type restrictions (The Echo / The Mirage) block the play
  // entirely, without spending a hand, if violated.
  const violation = bossBlindHandTypeViolation(baseResult.name);
  if (violation) {
    state.bossBlindMessage = violation;
    render();
    setTimeout(() => {
      state.bossBlindMessage = null;
      render();
    }, 1800);
    return;
  }
  if (!state.firstHandTypeThisRound) state.firstHandTypeThisRound = baseResult.name;
  state.handTypesPlayedThisRound = [...(state.handTypesPlayedThisRound || []), baseResult.name];
  state.handTypeCounts = state.handTypeCounts || {};
  state.handTypeCounts[baseResult.name] = (state.handTypeCounts[baseResult.name] || 0) + 1;
  if (state.bossBlind && state.bossBlind.moneyResetOnMostPlayed) {
    const maxCount = Math.max(...Object.values(state.handTypeCounts));
    if (state.handTypeCounts[baseResult.name] === maxCount) {
      state.money = 0;
    }
  }

  const scoringCards = baseResult.scoringCards;
  const scoringIds = scoringCards.map((c) => c.id);
  const newPlaysLeft = state.playsLeft - 1;

  // Handle Monument: track consecutive hands without most played hand type
  const hasMonument = state.charms.some((c) => c.effect.type === "monumentHandTypeMult");
  if (hasMonument) {
    if (state.mostPlayedHandType === null) {
      state.mostPlayedHandType = baseResult.name;
      state.consecutiveHandsWithoutMostPlayed = 0;
    } else if (baseResult.name === state.mostPlayedHandType) {
      state.consecutiveHandsWithoutMostPlayed = 0;
    } else {
      state.consecutiveHandsWithoutMostPlayed += 1;
    }
  }
  
  // Handle Mirror: if first hand of round is single card, duplicate it
  if (state.selected.length === 1) {
    const totalPlays = 4 + getExtraPlays(state.items);
    if (newPlaysLeft === totalPlays - 1) { // First hand of round
      const hasMirror = state.charms.some((c) => c.effect.type === "mirrorSingleCard");
      if (hasMirror) {
        const card = selectedCards[0];
        if (card) {
          const cardCopy = { ...card, id: card.id + "_mirror_" + Date.now() + "_" + Math.random().toString(36).slice(2) };
          state.deck.push(cardCopy);
          noteAdded(1);
        }
      }
    }
  }

  // Trigger random charm effects at start of hand
  state.rouletteBonus = 0;
  state.coinMultBonus = false;
  state.coinMoneyPenalty = 0;
  state.stampMoneyBonus = 0;
  
  state.charms.forEach((charm) => {
    if (charm.effect.type === "rouletteRandomBonus") {
      const chanceMult = chanceMultiplier();
      const chipsChance = Math.min(1, charm.effect.chipsChance * chanceMult);
      const moneyChance = Math.min(1 - chipsChance, charm.effect.moneyChance * chanceMult);
      const rand = Math.random();
      if (rand < chipsChance) {
        state.rouletteBonus = charm.effect.chipsValue;
      } else if (rand < chipsChance + moneyChance) {
        state.money += charm.effect.moneyValue;
      }
    }
    if (charm.effect.type === "coinFlip") {
      if (Math.random() < Math.min(1, 0.5 * chanceMultiplier())) {
        state.coinMultBonus = true;
      } else {
        state.money += charm.effect.moneyGain;
      }
    }
  });
  
  // Apply Roulette bonus chips
  if (state.rouletteBonus > 0) {
    state.nextHandChipBonus += state.rouletteBonus;
  }
  
  // Increment streak counter
  state.streakCounter += 1;

  // Increment run-wide hands-played counter and grow Oracle's permanent
  // multiplier every 3rd hand played this run (accumulates on the charm
  // instance itself, same pattern as Ratchet's boss-clear bonus).
  state.handsPlayedRun = (state.handsPlayedRun || 0) + 1;
  state.charms.forEach((charm) => {
    if (charm.effect.type === "oracleCompoundMult" && state.handsPlayedRun % charm.effect.everyN === 0) {
      charm.oracleMultBonus = (charm.oracleMultBonus || 1) * charm.effect.value;
    }
  });

  // Zenith: flag whether this is the last play of the round before scoring resolves
  state.isLastPlayThisRound = newPlaysLeft === 0;
  
  // Apply money for Chains charm
  state.charms.forEach((charm) => {
    if (charm.effect.type === "chainsMoneyPerHand") {
      state.money += charm.effect.value;
    }
  });

  state.scoringIds = scoringIds;

  // Work the whole hand out (luck rolled now), use up the next-hand boosts,
  // then show it trigger by trigger.
  const result = scoreHand(selectedCards, { live: true });
  state.nextHandDoubleBase = false;
  state.nextHandChipBonus = 0;
  state.nextHandDoubleChips = false;
  state.nextHandChipsX = 1;
  state.nextHandDoubleMult = false;
  state.nextHandMultX = 1;
  state.nextHandBalance = false;
  state.nextHandRetrigger = false;
  state.stampMoneyBonus = (state.stampMoneyBonus || 0) + result.money;
  // Bell: $1 per 35 chips scored by the cards themselves
  state.bellMoneyBonus = 0;
  state.charms.forEach((charm) => {
    if (charm.effect.type === "bellMoneyPerChips") state.bellMoneyBonus = Math.floor(result.chipsAfterCards / charm.effect.chipsPerDollar);
  });
  animateScoring(result, () => finishPlay(result.score, newPlaysLeft));
}

function finishPlay(finalScore, newPlaysLeft) {
  afterHandCharms();
  // Encore Ticket: this hand also scores the previous hand's score again.
  const handScore = finalScore;
  if (state.nextHandBonusScore) {
    finalScore += state.nextHandBonusScore;
    state.nextHandBonusScore = 0;
  }
  state.lastHandScore = handScore;
  state.heartstoneHits = 0;
  setTimeout(() => {
    // fly the scoring cards up and fade the popup before the hand refills
    const popupEl = document.querySelector(".score-popup");
    if (popupEl) popupEl.classList.add("popup-out");
    state.scoringIds.forEach((id) => {
      const el = document.querySelector(`.hand-fan .card[data-card-id="${id}"]`);
      if (!el) return;
      el.style.transition = "transform .3s cubic-bezier(.4,0,.7,.3), opacity .3s ease";
      el.style.transform = `${el.dataset.finalTransform} translateY(-70px) scale(1.15)`;
      el.style.opacity = "0";
    });

    setTimeout(() => {
      state.popup = null;
      state.popupStartedAt = null;
      
      // Handle Mirror sleeve clones - clone played Mirror cards before clearing scoringIds.
      // Use all played cards (not just scoringIds) since a card's sleeve applies whether
      // or not it ended up contributing to the scored hand (e.g. a kicker).
      const playedCardsForMirror = state.hand.filter((c) => state.selected.includes(c.id));
      const mirrorClones = playedCardsForMirror.map((card) => {
        if (card && card.sleeve === "mirror") {
          return { ...card, id: card.id + "_mirror_" + Date.now() + "_" + Math.random().toString(36).slice(2), sleeve: undefined };
        }
        return null;
      }).filter(Boolean);
      
      state.scoringIds = [];
      const playedCards = state.hand.filter((c) => state.selected.includes(c.id));
      const { newDeck, newHand } = refillHand(state.deck, state.hand, state.selected);
      state.deck = [...newDeck, ...mirrorClones];
      noteAdded(mirrorClones.length);
      state.hand = newHand;
      state.usedCards = [...state.usedCards, ...playedCards];

      // The Butcher: force-discard random cards from the freshly refilled hand.
      if (state.bossBlind && state.bossBlind.discardAfterPlay) {
        const shuffledHand = shuffleArray(state.hand);
        const forcedIds = shuffledHand.slice(0, Math.min(state.bossBlind.discardAfterPlay, state.hand.length)).map((c) => c.id);
        if (forcedIds.length) {
          const forcedDiscarded = state.hand.filter((c) => forcedIds.includes(c.id));
          const refill2 = refillHand(state.deck, state.hand, forcedIds);
          state.deck = refill2.newDeck;
          state.hand = refill2.newHand;
          state.usedCards = [...state.usedCards, ...forcedDiscarded];
        }
      }
      state.selected = [];
      state.roundScore = state.roundScore + finalScore;
      state.playsLeft = newPlaysLeft;
      state.money += getTollboothBonus(state.charms);
      if (state.bellMoneyBonus) {
        state.money += state.bellMoneyBonus;
        state.bellMoneyBonus = 0;
      }
      if (state.stampMoneyBonus) {
        state.money += state.stampMoneyBonus;
        state.stampMoneyBonus = 0;
      }
      if (state.coinMoneyPenalty > 0) {
        state.money -= state.coinMoneyPenalty;
        state.coinMoneyPenalty = 0;
      }
      state.coinMultBonus = false;

      // Apply Thorns penalty for unused plays
      state.charms.forEach((charm) => {
        if (charm.effect.type === "thornsMultPerCard") {
          const playsUsed = 4 + getExtraPlays(state.items) - state.playsLeft;
          const totalPlays = 4 + getExtraPlays(state.items);
          const unusedPlays = Math.max(0, totalPlays - playsUsed);
          const penalty = Math.min(unusedPlays * charm.effect.moneyLossPerUnusedPlay, charm.effect.maxLoss);
          state.money -= penalty;
        }
      });

      const target = targetForAnte(state.ante, state.blindIdx);
      const firstHandOfRound = (state.handsThisRound || 0) === 0;
      state.handsThisRound = (state.handsThisRound || 0) + 1;
      let cleared = state.roundScore >= target;
      // Phoenix Feather: once per run, a lost blind counts as cleared.
      if (!cleared && newPlaysLeft <= 0) {
        const feather = state.charms.find((c) => c.effect.type === "phoenixSave");
        if (feather) {
          state.charms = state.charms.filter((c) => c.uid !== feather.uid);
          cleared = true;
          setTimeout(() => activateCharmSlide(feather, () => {}), 100);
        }
      }
      if (cleared) {
        roundEndCharms(state.blindIdx === 2);
        state.charms.forEach((c) => {
          if (c.effect.type === "deadlineFirstHandClear" && firstHandOfRound) state.money += c.effect.value;
          if (c.effect.type === "investorMoneyPerCharm") state.money += state.charms.length * c.effect.value;
          if (c.effect.type === "satchelItemOnClear" && state.items.length < getEffectiveItemSlots()) {
            state.items = [...state.items, { ...randomOf(ITEM_DEFS), uid: newUid() }];
          }
        });
        const interest = getInterestBonus(state.items, state.money);
        const base = 3 + state.blindIdx;
        const leftover = getLeftoverHandsBonus(state.playsLeft, state.discardsLeft);
        state.lastRoundEarnings = { base, interest, leftover };
        state.money = state.money + base + interest + leftover;
        state.overlay = (state.blindIdx === 2 && state.ante === FINAL_ANTE) ? "victory" : "cleared";
        PPHub.event('blind');
        PPHub.best('ante', state.ante);
        if (state.blindIdx === 2) PPHub.event('boss');
        if (state.overlay === "victory") PPHub.event('win');
        if (state.blindIdx === 2) {
          // Boss Blind cleared - Ratchet's bonus is permanent, so it accumulates
          // on the charm instance itself rather than being recomputed live.
          state.charms.forEach((c) => {
            if (c.effect.type === "ratchetBossMult") {
              c.ratchetBonus = (c.ratchetBonus || 0) + c.effect.value;
            }
          });
        }
      } else if (newPlaysLeft <= 0) {
        state.overlay = "over";
        PPHub.event('run');
      }

      // The hand's outcome (score, money, deck/hand state, and win/loss) is now
      // fully resolved. Persist it before it's ever rendered/revealed. A lost
      // run has no save to resume — wipe it instead of writing a dead one.
      if (state.overlay === "over") {
        clearSave();
      } else {
        saveGame();
      }
      render();
    }, 260);
  }, 950);
}

function discard() {
  if (state.selected.length === 0 || state.discardsLeft <= 0 || state.overlay !== "playing") return;
  if (hasCharm("chainsNoDiscardX")) {
    state.bossBlindMessage = "Chains: you can't discard";
    render();
    setTimeout(() => { state.bossBlindMessage = null; render(); }, 1600);
    return;
  }
  // fly discarded cards downward and fade before refilling
  state.selected.forEach((id) => {
    const el = document.querySelector(`.hand-fan .card[data-card-id="${id}"]`);
    if (!el) return;
    el.style.transition = "transform .3s cubic-bezier(.4,0,.7,.3), opacity .3s ease";
    el.style.transform = `${el.dataset.finalTransform} translateY(130px) rotate(14deg) scale(.82)`;
    el.style.opacity = "0";
  });

  setTimeout(() => {
    // Check for Tithe sleeves and add money bonus
    const discardedCards = state.hand.filter(c => state.selected.includes(c.id));
    const titheBonus = discardedCards.filter(c => c.sleeve === "tithe").length * 5;
    // Collector: a lone first discard of the round is destroyed for cash.
    let collected = [];
    if (!state.collectorUsedThisRound) {
      state.collectorUsedThisRound = true;
      const collector = state.charms.find((c) => c.effect.type === "collectorFirstDiscard");
      if (collector && discardedCards.length === 1) {
        collected = discardedCards;
        state.money += collector.effect.value;
        noteDestroyed(discardedCards);
      }
    }
    
    const { newDeck, newHand } = refillHand(state.deck, state.hand, state.selected);
    state.deck = newDeck;
    state.hand = newHand;
    state.usedCards = [...state.usedCards, ...discardedCards.filter((c) => !collected.includes(c))];
    state.selected = [];
    state.discardsLeft -= 1;
    state.totalDiscardedRun = (state.totalDiscardedRun || 0) + discardedCards.length;
    state.charms = state.charms.map((c) => (c.effect.type === "lanternDiscardX" ? { ...c, lanternDiscards: (c.lanternDiscards || 0) + discardedCards.length } : c));
    const jacks = discardedCards.filter((c) => c.rank === "J").length;
    if (jacks) state.charms = state.charms.map((c) => (c.effect.type === "jackknifeX" ? { ...c, jackBonus: (c.jackBonus || 0) + jacks * c.effect.value } : c));
    state.money += getMoneyOnDiscard(state.items) + titheBonus;
    state.streakCounter = 0; // Reset Streak when discarding
    saveGame();
    render();
  }, 260);
}

/* ============================== ITEMS & SHOP ACTIONS ============================== */
function closeSidebar() {
  state.sidebarProgress = 0;
  render();
}

const SIDEBAR_PANEL_WIDTH = 132; // must match .item-panel width in CSS

let sidebarDrag = null;

function sidebarDragStart(e) {
  e.preventDefault();
  const point = e.touches ? e.touches[0] : e;
  sidebarDrag = {
    startX: point.clientX,
    startY: point.clientY,
    startYPct: state.sidebarY,
    startProgress: state.sidebarProgress,
    mode: null, // decided once the drag moves enough: "horizontal" (open/close) or "vertical" (reposition)
  };
  // Disable the CSS transition while live-dragging so the panel tracks the finger/cursor
  // 1:1 with no delay or eased "snap" motion; the transition comes back on the next render.
  const panel = document.querySelector(".item-panel");
  if (panel) panel.style.transition = "none";
  window.addEventListener("mousemove", sidebarDragMove);
  window.addEventListener("touchmove", sidebarDragMove, { passive: false });
  window.addEventListener("mouseup", sidebarDragEnd);
  window.addEventListener("touchend", sidebarDragEnd);
}

function sidebarDragMove(e) {
  if (!sidebarDrag) return;
  e.preventDefault();
  const point = e.touches ? e.touches[0] : e;
  const dx = point.clientX - sidebarDrag.startX;
  const dy = point.clientY - sidebarDrag.startY;

  if (!sidebarDrag.mode) {
    if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return; // ignore tiny jitter before committing to an axis
    sidebarDrag.mode = Math.abs(dx) > Math.abs(dy) ? "horizontal" : "vertical";
  }

  const tab = document.querySelector(".item-tab");
  const panel = document.querySelector(".item-panel");

  if (sidebarDrag.mode === "horizontal") {
    // Dragging the tab left reveals more of the panel. This is a direct 1:1 drag —
    // wherever you let go is exactly where it stays, no snapping to open/closed.
    const deltaProgress = -dx / SIDEBAR_PANEL_WIDTH;
    const progress = Math.max(0, Math.min(1, sidebarDrag.startProgress + deltaProgress));
    state.sidebarProgress = progress;
    if (tab) tab.style.right = (progress * SIDEBAR_PANEL_WIDTH) + "px";
    if (panel) panel.style.transform = `translateY(-50%) translateX(${(1 - progress) * 100}%)`;
  } else {
    const vh = window.innerHeight;
    const startPx = (sidebarDrag.startYPct / 100) * vh;
    const clampedPx = Math.max(36, Math.min(vh - 36, startPx + dy));
    const pct = (clampedPx / vh) * 100;
    state.sidebarY = pct;
    if (tab) tab.style.top = pct + "%";
    if (panel) panel.style.top = pct + "%";
  }
}

function sidebarDragEnd() {
  window.removeEventListener("mousemove", sidebarDragMove);
  window.removeEventListener("touchmove", sidebarDragMove);
  window.removeEventListener("mouseup", sidebarDragEnd);
  window.removeEventListener("touchend", sidebarDragEnd);
  sidebarDrag = null;
  render();
}

function goToShop() {
  const shopSize = 6 + voucherSum("shopSizeBonus");
  state.shopStock = generateShopStock(shopSize);
  state.rerollCost = baseRerollCost();
  state.shopDetail = null;

  // One voucher per ante: a fresh one after each boss (and in the run's first
  // shop). An unbought voucher waits for you in the next shop of the ante.
  if (state.blindIdx === 2 || !state.voucherReady) {
    const v = rollVoucher();
    state.voucherStock = v ? [v] : [];
    state.voucherReady = true;
  }

  // Booster packs: two per visit (rerolling doesn't change them); a Legend
  // Pack turns up in a slot 12% of the time.
  // Spectral Packs are scarcer. Each pack is a Major 28% of the time and a
  // Mega 12% of the time.
  const commonBases = PACK_BASES.filter((p) => !p.rare);
  const weights = commonBases.map((p) => (p.scarce ? 0.45 : 1));
  const rollBase = () => {
    let r = Math.random() * weights.reduce((a, b) => a + b, 0);
    let i = 0;
    while (i < weights.length - 1 && r > weights[i]) r -= weights[i++];
    return commonBases[i].id;
  };
  state.packStock = Array.from({ length: 2 + voucherSum("packSlots") }, () => {
    if (Math.random() < 0.12) return { ...PACK_DEFS.find((p) => p.rare) };
    const r = Math.random();
    const id = rollBase() + (r < 0.12 ? "_mega" : r < 0.4 ? "_major" : "");
    return { ...PACK_DEFS.find((p) => p.id === id) };
  });

  state.overlay = "shop";
  saveGame();
  render();
}

function buyPack(index) {
  const pack = state.packStock && state.packStock[index];
  if (!pack) return;
  const price = shopPriceFor(pack);
  if (state.money < price) return;
  state.money -= price;
  if (state.freeBuy) state.freeBuy = false;
  state.packStock = state.packStock.map((p, i) => (i === index ? null : p));
  openPack(pack.id);
}

// Opens a pack: rolls its choices and shows the pick-one screen.
function openPack(packId) {
  const pack = PACK_DEFS.find((p) => p.id === packId);
  if (!pack) return;
  const kind = pack.base || pack.id;
  const ringmaster = hasCharm("ringmasterDuplicates");
  const owned = new Set(state.charms.map((c) => c.id));
  const pickDefs = (pool, n) => shuffleArray(pool).slice(0, n).map((d) => ({ ...d }));
  const n = pack.choices + state.vouchers.filter((v) => v.effect.type === "packExtraChoices" && v.effect.pack === kind).reduce((s, v) => s + v.effect.value, 0);
  let choices = [];
  if (kind === "artifactPack") choices = pickDefs(artifactPool().filter((c) => ringmaster || !owned.has(c.id)), n).map(rollCharmSleeve);
  if (kind === "itemPack") {
    // Tea Leaves: one more card. Omen Globe: any card can be a Spectral one.
    const spectralChance = voucherSum("arcanaSpectral");
    choices = pickDefs(arcanaPool(), n + voucherSum("arcanaExtra")).map((d) => (Math.random() < spectralChance ? pickSpectrals(1)[0] : { ...d, arcana: true }));
  }
  if (kind === "celestialPack") {
    // secret hands' charts only once you've played that hand
    choices = pickDefs(ITEM_DEFS.filter((d) => d.chart && (!d.secret || (state.handTypeCounts || {})[d.effect.hand])), n);
    // Clairvoyance: the chart for your most played hand is always in the pack.
    const counts = state.handTypeCounts || {};
    const fav = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
    const favChart = fav && voucherSum("chartFavourite") && ITEM_DEFS.find((d) => d.chart && d.effect.hand === fav);
    if (favChart && !choices.some((c) => c.id === favChart.id)) choices[0] = { ...favChart };
  }
  if (kind === "spectralPack") choices = pickSpectrals(n);
  if (kind === "legendPack") choices = pickDefs(LEGENDARY_DEFS.filter((c) => !owned.has(c.id)), n);
  if (kind === "cardPack") choices = Array.from({ length: n }, () => makeCard(randomOf(RANKS), randomOf(SUIT_KEYS), Math.random() < 0.25 ? { stamp: randomOf(STAMP_KINDS) } : {}));
  if (kind === "ornatePack") choices = Array.from({ length: n }, () => makeCard(randomOf(RANKS), randomOf(SUIT_KEYS), { sleeve: Math.random() < 0.05 ? "negative" : randomOf(SLEEVE_KINDS), stamp: randomOf(STAMP_KINDS) }));
  state.packOpen = { id: packId, name: pack.name, choices, picks: pack.picks || 1, openedAt: SETTINGS.packAnim ? Date.now() : 0, hand: kind === "spectralPack" || kind === "itemPack" ? packHandIds() : null, note: null };
  state.packPick = null;
  state.packSel = [];
  state.shopDetail = null;
  saveGame();
  render();
}

function takePackChoice(index) {
  const po = state.packOpen;
  if (!po) return;
  const choice = po.choices[index];
  if (!choice) return;
  let note = null;
  if (choice.arcana) {
    const need = arcanaSelection(choice);
    const sel = (state.packSel || []).slice(0, need ? need[1] : 0);
    if (need && sel.length < need[0]) return;
    if (!useArcana(choice, sel)) {
      po.note = `${choice.name} had nothing to work on`;
      state.packPick = null;
      render();
      return;
    }
    note = `${choice.name} used`;
    state.packSel = [];
  } else if (choice.spectral) {
    note = useSpectral(choice);
  } else if (choice.type === "charm") {
    if (choice.sleeve !== "negative" && charmsUsed() >= state.charmSlots) return;
    state.charms = [...state.charms, { ...choice, uid: newUid() }];
  } else if (choice.type === "item" && choice.chart) {
    state.handLevels = { ...(state.handLevels || {}), [choice.effect.hand]: handLevel(choice.effect.hand) + 1 };
    noteChartUsed();
  } else if (choice.type === "item") {
    if (state.items.length >= getEffectiveItemSlots()) return;
    state.items = [...state.items, { ...choice, uid: newUid() }];
  } else {
    // a playing card: straight into the deck
    state.deck = shuffleArray([...state.deck, { ...choice }]);
    noteAdded(1);
  }
  state.packPick = null;
  if ((po.picks || 1) > 1) {
    // Mega pack: take another
    po.choices = po.choices.filter((_, i) => i !== index);
    po.picks -= 1;
    po.note = note;
  } else {
    state.packOpen = null;
    if (note) state.packToast = { text: note, at: Date.now() };
  }
  saveGame();
  render();
}

// Using an Arcana or Spectral card plays out on the pack's hand: the card
// rises and is drawn down into the hand, the cards it works on glow, cards it
// destroys burn away, and changed or new cards flip in. Then the screen moves on.
let PACK_BUSY = false;
function usePackChoiceAnimated(index) {
  const po = state.packOpen;
  const choice = po && po.choices[index];
  if (!choice || PACK_BUSY) return;
  const wrap = document.querySelector(".pack-overlay");
  const cardEl = wrap && wrap.querySelectorAll(".pack-fan .pchoice")[index];
  if (!po.hand || !(choice.arcana || choice.spectral) || !wrap || !cardEl) { takePackChoice(index); return; }
  if (choice.arcana) {
    const need = arcanaSelection(choice);
    if (need && (state.packSel || []).length < need[0]) return;
  }
  const slow = !SETTINGS.reduceMotion;
  const before = new Map(packHandCards().map((c) => [c.id, JSON.stringify(c)]));
  const sel = new Set(state.packSel || []);
  const handRow = wrap.querySelector(".pack-hand-cards");
  PACK_BUSY = true;
  wrap.classList.add("busy");
  const finish = () => {
    if (!PACK_BUSY) return;
    PACK_BUSY = false;
    if (state.packToast) state.packToast.at = Date.now();
    render();
  };
  const safety = setTimeout(finish, 5000);
  const done = () => { clearTimeout(safety); finish(); };
  // 1. the card lifts, glows and is drawn into the hand
  if (handRow) {
    const hr = handRow.getBoundingClientRect(), cr = cardEl.getBoundingClientRect();
    cardEl.style.setProperty("--to-x", Math.round(hr.left + hr.width / 2 - (cr.left + cr.width / 2)) + "px");
    cardEl.style.setProperty("--to-y", Math.round(hr.top + hr.height / 2 - (cr.top + cr.height / 2)) + "px");
    handRow.querySelectorAll(".pack-hand-card").forEach((s) => { if (sel.has(s.dataset.id)) s.classList.add("charging"); });
  }
  cardEl.classList.add("using");
  buzz(20);
  setTimeout(() => {
    // 2. it takes effect (the screen holds still: PACK_BUSY stops renders)
    try { takePackChoice(index); } catch (e) { done(); throw e; }
    if (!handRow) { done(); return; }
    const afterCards = packHandOrdered(po);
    const afterIds = new Set(afterCards.map((c) => c.id));
    let gone = 0;
    handRow.querySelectorAll(".pack-hand-card").forEach((s) => {
      s.classList.remove("charging");
      if (!afterIds.has(s.dataset.id)) { s.classList.add("vanish"); gone++; }
    });
    setTimeout(() => {
      // 3. the hand as it is now: changed and new cards flip in
      handRow.innerHTML = "";
      let changed = 0;
      afterCards.forEach((c) => {
        const isChanged = before.get(c.id) !== JSON.stringify(c);
        const slot = packHandSlot(c, isChanged ? "changed" : "");
        if (isChanged) slot.style.setProperty("--d", changed++ * 70 + "ms");
        handRow.appendChild(slot);
      });
      layPackHand(handRow, afterCards);
      if (changed) buzz(25);
      setTimeout(done, slow ? (changed ? 750 + changed * 70 : gone ? 350 : 250) : 150);
    }, gone && slow ? 380 : 0);
  }, slow ? 560 : 60);
}

function skipPack() {
  if (PACK_BUSY) return;
  state.packOpen = null;
  saveGame();
  render();
}

// Opened pack: the same top bar as the shop (money, deck and your shelf, so
// you can sell to make room), then the choices dealt in a fan on a panel.
// Tap a card to look at it; Take adds it, Skip leaves the rest.
function packChoiceFull(choice) {
  if (choice.arcana || choice.spectral) return false;
  if (choice.type === "charm" && choice.sleeve === "negative") return false;
  if (choice.type === "charm") return charmsUsed() >= state.charmSlots;
  if (choice.type === "item" && !choice.chart) return state.items.length >= getEffectiveItemSlots();
  return false;
}
// The pack's hand in the order you see it: your own sort mid-round,
// lowest to highest otherwise (so "leftmost" means the same everywhere).
// A playing card drawn at a fixed zoom, for shop wares and popups.
function playingCardEl(card, zoom) {
  const el = renderCard(card, { selected: false, scoring: false, dimmed: false, scale: 1, marginLeft: 0, arcIndex: 0, arcCount: 1, onClick: () => {} });
  el.classList.add("pack-card");
  el.style.transform = "none";
  el.dataset.finalTransform = "none";
  el.style.zoom = String(zoom);
  return el;
}
function packHandOrdered(po = state.packOpen) {
  const cards = packHandCards(po);
  if (state.overlay === "playing") {
    const ids = new Set(cards.map((c) => c.id));
    return getSortedHand().filter((c) => ids.has(c.id));
  }
  const sorted = [...cards].sort((a, b) => rankStraightValueHigh(a.rank) - rankStraightValueHigh(b.rank));
  if (!po || !po.order) return sorted;
  // moved by hand: that order first, any new cards after it
  const byId = new Map(cards.map((c) => [c.id, c]));
  const ordered = po.order.map((id) => byId.get(id)).filter(Boolean);
  return [...ordered, ...sorted.filter((c) => !po.order.includes(c.id))];
}
// Drag a card in the pack's hand to a new spot. Mid-round that is your real
// hand, so it moves there too (and the hand switches to Move order).
function movePackHandCard(id, to) {
  const po = state.packOpen;
  if (!po) return;
  const ids = packHandOrdered().map((c) => c.id);
  const from = ids.indexOf(id);
  if (from < 0 || from === to) return;
  ids.splice(from, 1);
  ids.splice(Math.max(0, Math.min(to, ids.length)), 0, id);
  if (state.overlay === "playing") {
    const rest = getSortedHand().map((c) => c.id).filter((x) => !ids.includes(x));
    state.handOrder = [...ids, ...rest];
    state.sortMode = "manual";
  } else {
    po.order = ids;
  }
  saveGame();
  render();
}
function attachPackHandDrag(slot, index, slots, step, onTap) {
  slot.addEventListener("pointerdown", (e) => {
    if (PACK_BUSY || (e.button !== undefined && e.button !== 0)) return;
    const startX = e.clientX, startY = e.clientY, pid = e.pointerId;
    let drag = false, target = index;
    const move = (ev) => {
      if (ev.pointerId !== pid) return;
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      if (!drag) {
        if (Math.abs(dx) < 8 || Math.abs(dx) < Math.abs(dy)) {
          if (Math.abs(dy) > 12) cleanup();
          return;
        }
        drag = true;
        try { slot.setPointerCapture(pid); } catch (err) {}
        slot.classList.add("dragging");
        slots.forEach((s) => { if (s !== slot) s.classList.add("shift"); });
      }
      ev.preventDefault();
      target = Math.max(0, Math.min(slots.length - 1, index + Math.round(dx / step)));
      slot.style.transform = `translate(${dx}px, -10px) scale(1.08)`;
      slots.forEach((s, j) => {
        if (s === slot) return;
        const shift = index < target && j > index && j <= target ? -step : target < index && j >= target && j < index ? step : 0;
        s.style.transform = shift ? `translateX(${shift}px)` : "";
      });
    };
    const up = (ev) => {
      if (ev.pointerId !== pid) return;
      cleanup();
      if (drag) {
        if (target !== index) movePackHandCard(slot.dataset.id, target);
        else { slot.classList.remove("dragging"); slot.style.transform = ""; slots.forEach((s) => { s.style.transform = ""; }); }
      } else if (ev.type === "pointerup" && onTap) onTap();
    };
    const cleanup = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", up);
    };
    window.addEventListener("pointermove", move, { passive: false });
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", up);
  });
}
// One card in the pack's hand.
function packHandSlot(c, cls) {
  const cardEl = renderCard(c, { selected: false, scoring: false, dimmed: false, scale: 1, marginLeft: 0, arcIndex: 0, arcCount: 1, onClick: () => {} });
  cardEl.classList.add("pack-card");
  cardEl.style.transform = "none";
  cardEl.dataset.finalTransform = "none";
  cardEl.style.zoom = "0.82";
  const slot = document.createElement("div");
  slot.className = "pack-hand-card" + (cls ? " " + cls : "");
  slot.dataset.id = c.id;
  slot.appendChild(cardEl);
  return slot;
}
// Width of each card's step in the pack's hand, so the row fits the panel.
function packHandStep(n) {
  const cardW = isLandscape() ? 41 : 51;
  const inner = Math.min(isLandscape() ? 760 : 640, window.innerWidth - 28) - 28;
  return { cardW, step: Math.max(14, Math.min(44, Math.floor((inner - cardW) / Math.max(1, n - 1)))) };
}
function layPackHand(cards, handCards) {
  const { cardW, step } = packHandStep(handCards.length);
  cards.style.setProperty("--hw", step + "px");
  const last = cards.lastElementChild;
  if (last && last.classList.contains("pack-hand-card")) { last.style.flexBasis = cardW + "px"; last.style.width = cardW + "px"; }
  return step;
}
function togglePackSel(id, max) {
  if (PACK_BUSY) return;
  const sel = state.packSel || [];
  state.packSel = sel.includes(id) ? sel.filter((x) => x !== id) : [...sel, id].slice(-max);
  render();
}
function pickPackChoice(i) {
  if (PACK_BUSY) return;
  state.packPick = state.packPick === i ? null : i;
  state.packSel = [];
  render();
}
function PackOverlay() {
  const po = state.packOpen;
  const def = PACK_DEFS.find((p) => p.id === po.id) || {};
  const wrap = document.createElement("div");
  wrap.className = "pack-overlay";
  wrap.style.setProperty("--pc", def.color || "#C9A227");

  // ===== TOP BAR: as in the shop =====
  const header = document.createElement("div");
  header.className = "shop-header-row pack-header";
  header.innerHTML = `
    <div class="shop-header-left">
      <div class="shop-title serif">${po.name}</div>

    </div>`;
  const right = document.createElement("div");
  right.className = "shop-header-right";
  const deckCorner = document.createElement("div");
  deckCorner.className = "shop-deck-corner";
  deckCorner.appendChild(renderDeckWidget());
  right.appendChild(deckCorner);
  right.insertAdjacentHTML("beforeend", `<div class="shop-money serif">$${state.money}</div>`);
  right.appendChild(OptionsButton("compact"));
  header.appendChild(right);
  wrap.appendChild(header);
  wrap.appendChild(GearShelf());
  const spacer = () => { const d = document.createElement("div"); d.className = "pack-spacer"; return d; };
  wrap.appendChild(spacer());

  // ===== THE STAGE: torn pack, cards fanned out =====
  const stage = document.createElement("div");
  stage.className = "pack-stage";
  // Opening: the pack shakes, tears open with a flash, and the cards are
  // dealt out of it. Timed from when it was opened, so a re-render mid-way
  // carries on where it was instead of starting again.
  const elapsed = Date.now() - (po.openedAt || 0);
  const opening = elapsed < 1500;
  const dealAt = opening ? 950 - elapsed : 0;
  stage.style.setProperty("--t", -Math.min(elapsed, 1500) + "ms");
  stage.innerHTML = `<div class="pack-rays"></div><div class="bshop-sign pack-sign serif"><span>${(po.picks || 1) > 1 ? `Pick ${po.picks}` : "Pick One"}</span></div><div class="pack-torn">${AnteArt.icon(def)}</div>` +
    (opening ? `<div class="pack-opening"><div class="po-flash"></div>` +

      `<div class="po-pack"><div class="po-top">${AnteArt.icon(def)}</div><div class="po-bottom">${AnteArt.icon(def)}</div></div></div>` : "");
  stage.classList.toggle("is-opening", opening);
  const fan = document.createElement("div");
  fan.className = "pack-fan";
  // Card width: as big as fits the row, up to 96px (78px sideways).
  const room = Math.min(isLandscape() ? 760 : 640, window.innerWidth - 28) - 24;
  const cw = Math.floor(Math.min(isLandscape() ? (po.hand ? 60 : 78) : 112, (room - (po.choices.length - 1) * 8) / po.choices.length));
  fan.style.setProperty("--cw", cw + "px");
  const pick = state.packPick != null && po.choices[state.packPick] ? state.packPick : null;
  const mid = (po.choices.length - 1) / 2;
  po.choices.forEach((choice, i) => {
    const el = document.createElement("button");
    const isCard = !choice.type;
    const legendary = choice.rarity === "legendary";
    el.className = "pchoice" + (i === pick ? " picked" : "") + (packChoiceFull(choice) ? " full" : "") + (legendary ? " legendary" : "");
    el.style.setProperty("--rot", ((i - mid) * 5).toFixed(1) + "deg");
    el.style.setProperty("--drop", (Math.abs(i - mid) * 5).toFixed(1) + "px");
    el.style.setProperty("--delay", dealAt + i * 80 + "ms");
    if (isCard) {
      const cardEl = renderCard(choice, { selected: false, scoring: false, dimmed: false, scale: 1, marginLeft: 0, arcIndex: 0, arcCount: 1, onClick: () => {} });
      cardEl.classList.add("pack-card");
      cardEl.style.transform = "none";
      cardEl.dataset.finalTransform = "none";
      cardEl.style.zoom = (cw / 62).toFixed(3);
      const face = document.createElement("div");
      face.className = "pchoice-face is-playing";
      face.appendChild(cardEl);
      el.appendChild(face);
    } else if (choice.spectral) {

  });
  stage.appendChild(fan);

  if (po.hand) {

    const sel = state.packSel || [];

    cards.className = "pack-hand-cards";

      cards.appendChild(slot);
      return slot;
    });
    const step = layPackHand(cards, handCards);
    slots.forEach((slot, i) => attachPackHandDrag(slot, i, slots, step, need ? () => togglePackSel(handCards[i].id, need[1]) : null));
    if (!handCards.length) cards.innerHTML = `<div class="pack-info-hint">No cards</div>`;

  // ===== WHAT YOU'RE LOOKING AT, and the buttons =====

    } else {
      kind = c.rarity === "legendary" ? "Legendary artifact" : c.type === "charm" ? "Artifact" : "Item";
      name = c.name;
      desc = c.desc + (c.sleeve && CHARM_SLEEVES[c.sleeve] ? `<br><b>${CHARM_SLEEVES[c.sleeve].name} sleeve</b> ${CHARM_SLEEVES[c.sleeve].desc}` : "");

  }
