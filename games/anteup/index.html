      setTimeout(() => {
        state.activeCharm = null;
        state.activeCharmStartedAt = null;
        state.activeCharmClosing = false;
        render();
      }, 300);
    }, 600);
  }, 300);
}


/* ============================== SCORING ENGINE ==============================
   Works a hand out the way it is shown: as an ordered list of trigger events.
     1. the hand type's base Chips and Mult
     2. each scoring card, left to right: its chips, Gold stamp money, Molt
        marks and every artifact that cares about that card. A retrigger
        (Crimson stamp, Low Tide, Encore Mask, Eternal Engine, Calculator,
        The Empress) plays the whole card again, marked "Again!"
     3. cards held in hand (Duke, Gilded Hand)
     4. artifacts that act on the whole hand, left to right along the shelf
     5. next-hand boosts from items, the Boss Blind, the run multiplier
   Each event carries the running Chips and Mult after it, so the animation
   can simply step through them. live=false is the preview: no luck rolls. */
const FACE_RANKS = ["J", "Q", "K"];
// Artifact effects resolved per scoring card (step 2) or per held card (step 3).
const PER_CARD_EFFECTS = new Set([
  "crownFaceCardMult", "prismChipsPerCard", "abacusCardChipsBoost", "blueprintSleeveChips",
  "midasGoldStampChips", "redThreadCrimsonMult", "curatorStampedCardChips", "spiralRanksMult",
  "evenRanksMult", "oddRanksChips", "portraitFirstFaceX", "thronesKingQueenX", "hydraSleeveX",
  "heartstoneChance", "dukeKingMult", "gildedHeldX",
]);
// Whole-hand artifact effects that multiply Mult (the rest add).
const X_EFFECTS = new Set([
  "pppEncore", "dukeKingMult", "monumentHandTypeMult", "amplifierMultX", "alchemistDoubleMultNoDiscards",
  "oracleCompoundMult", "zenithLastPlayMult", "cascadeMultPerExtraCard", "solitaireHighCardX", "duetPairX",
  "checkmateStraightX", "firstHandX", "midnightSunX", "grandLedgerX", "chainsNoDiscardX", "rainbowAllSuitsX",
  "tidepoolFlushX", "mirrorsAddedX", "saintFaceDestroyedX", "lanternDiscardX",
]);

function fmtNum(n) {
  const r = Math.round(n * 100) / 100;
  return Number.isInteger(r) ? String(r) : r.toFixed(2).replace(/0$/, "");
}

// Preview: a played hand counts itself before it scores (hands played, hand
// types this round, Streak, Monument, last play), so the preview does the same
// on a scratch copy of those counters and then puts them back.
function previewScore(selectedCards) {
  const base = evaluateSelection(selectedCards);
  if (!base) return null;
  const keys = ["handTypesPlayedThisRound", "handTypeCounts", "streakCounter", "handsPlayedRun", "isLastPlayThisRound", "consecutiveHandsWithoutMostPlayed"];
  const saved = {};
  keys.forEach((k) => { saved[k] = state[k]; });
  try {
    state.handTypesPlayedThisRound = [...(state.handTypesPlayedThisRound || []), base.name];
    state.handTypeCounts = { ...(state.handTypeCounts || {}), [base.name]: ((state.handTypeCounts || {})[base.name] || 0) + 1 };
    state.streakCounter = (state.streakCounter || 0) + 1;
    state.handsPlayedRun = (state.handsPlayedRun || 0) + 1;
    state.isLastPlayThisRound = state.playsLeft - 1 === 0;
    if (state.charms.some((c) => c.effect.type === "monumentHandTypeMult") && state.mostPlayedHandType && base.name !== state.mostPlayedHandType) {
      state.consecutiveHandsWithoutMostPlayed = (state.consecutiveHandsWithoutMostPlayed || 0) + 1;
    }
    return scoreHand(selectedCards, { live: false });
  } finally {
    keys.forEach((k) => { state[k] = saved[k]; });
  }
}

function scoreHand(selectedCards, { live = false } = {}) {
  const base = evaluateSelection(selectedCards);
  if (!base) return null;
  const hb = handBase(base.name);
  let chips = hb.chips, mult = hb.mult, money = 0;
  const events = [];
  const push = (ev) => events.push({ ...ev, chips, mult });
  push({ target: "hand", kind: "base", text: base.name });
  if (state.nextHandDoubleBase) {
    chips += hb.chips; mult += hb.mult;
    push({ target: "hand", kind: "chips", text: "Double Down" });
  }

  // scoring cards in the order they sit in the hand
  const order = getSortedHand().map((c) => c.id);
  const cards = [...base.scoringCards].sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
  const charms = state.charms;
  const has = (type) => charms.find((c) => c.effect.type === type);
  const calc = has("calculatorReplay");
  const calculatorFires = live && calc && Math.random() < Math.min(1, calc.effect.chance * chanceMultiplier());
  const heart = has("heartstoneChance");
  let portraitCardId = null;
  const firstFace = cards.find((c) => !isCardDebuffed(c) && FACE_RANKS.includes(c.rank));
  if (firstFace) portraitCardId = firstFace.id;

  cards.forEach((card) => {
    if (isCardDebuffed(card)) {
      push({ target: "card", id: card.id, kind: "info", text: "Debuffed" });
      return;
    }
    // every way this card gets played again
    const again = [];
    if (card.stamp === "crimson") again.push({ label: "Crimson" });
    const engine = has("engineRetrigger");
    if (engine) again.push({ label: engine.name, uid: engine.uid });
    const tide = has("lowTideRetrigger");
    if (tide && ["2", "3", "4", "5"].includes(card.rank)) again.push({ label: tide.name, uid: tide.uid });
    const mask = has("maskFaceRetrigger");
    if (mask && FACE_RANKS.includes(card.rank)) again.push({ label: mask.name, uid: mask.uid });
    if (calculatorFires) again.push({ label: calc.name, uid: calc.uid });
    if (state.nextHandRetrigger) again.push({ label: "The Empress" });

    [{ label: null }, ...again].forEach((round, k) => {
      if (k > 0) push({ target: "card", id: card.id, kind: "again", text: "Again!", sub: round.label, from: round.uid });
      const cardChips = rankChipValue(card.rank) + (card.sleeve === "sparkler" ? 20 : 0);
      chips += cardChips;
      push({ target: "card", id: card.id, kind: "chips", text: `+${cardChips}` });
      if (card.stamp === "gold") {
        money += 3;
        push({ target: "card", id: card.id, kind: "money", text: "+$3" });
      }
      if (card.moltBuff) {
        mult += card.moltBuff;
        push({ target: "card", id: card.id, kind: "mult", text: `+${card.moltBuff} Mult` });
      }
      charms.forEach((c) => {
        const e = c.effect;
        const addC = (n) => { chips += n; push({ target: "card", id: card.id, kind: "chips", text: `+${fmtNum(n)}`, from: c.uid }); };
        const addM = (n) => { mult += n; push({ target: "card", id: card.id, kind: "mult", text: `+${fmtNum(n)} Mult`, from: c.uid }); };
        const xM = (n) => { mult *= n; push({ target: "card", id: card.id, kind: "xmult", text: `X${fmtNum(n)} Mult`, from: c.uid }); };
        switch (e.type) {
          case "crownFaceCardMult": if (FACE_RANKS.includes(card.rank)) addM(e.value); break;
          case "prismChipsPerCard": addC(e.value); break;
          case "abacusCardChipsBoost": addC(Math.round(rankChipValue(card.rank) * e.value)); break;
          case "blueprintSleeveChips": if (card.sleeve) addC(e.value); break;
          case "midasGoldStampChips": if (card.stamp === "gold") addC(e.value); break;
          case "redThreadCrimsonMult": if (card.stamp === "crimson") addM(e.value); break;
          case "curatorStampedCardChips": if (card.stamp) addC(e.value); break;
          case "spiralRanksMult": if (["A", "2", "3", "5", "8"].includes(card.rank)) addM(e.value); break;
          case "evenRanksMult": if (["2", "4", "6", "8", "10"].includes(card.rank)) addM(e.value); break;
          case "oddRanksChips": if (["A", "3", "5", "7", "9"].includes(card.rank)) addC(e.value); break;
          case "portraitFirstFaceX": if (card.id === portraitCardId) xM(e.value); break;
          case "thronesKingQueenX": if (card.rank === "K" || card.rank === "Q") xM(e.value); break;
          case "hydraSleeveX": if (card.sleeve) xM(e.value); break;
          case "heartstoneChance":
            if (live && card.suit === "hearts" && Math.random() < Math.min(1, e.chance * chanceMultiplier())) xM(e.value);
            break;
          default: break;
        }
      });
    });
  });
  const chipsAfterCards = chips;

  // cards held in hand
  state.hand.filter((c) => !selectedCards.some((s) => s.id === c.id)).forEach((card) => {
    if (isCardDebuffed(card)) return;
    charms.forEach((c) => {
      const e = c.effect;
      if (e.type === "dukeKingMult" && card.rank === "K") { mult *= e.value; push({ target: "card", id: card.id, kind: "xmult", text: `X${fmtNum(e.value)} Mult`, from: c.uid, held: true }); }
      if (e.type === "gildedHeldX" && card.stamp === "gold") { mult *= e.value; push({ target: "card", id: card.id, kind: "xmult", text: `X${fmtNum(e.value)} Mult`, from: c.uid, held: true }); }
    });
  });

  // whole-hand artifacts, in shelf order
  charms.forEach((c) => {
    const e = c.effect;
    if (PER_CARD_EFFECTS.has(e.type)) return;
    if (e.type === "gamblerMult") { mult += e.value; push({ target: "charm", uid: c.uid, kind: "mult", text: `+${e.value} Mult` }); return; }
    const r = applyCharmEffects({ name: base.name, totalChips: chips, totalMult: mult }, cards, [c]);
    const dc = r.totalChips - Math.round(chips);
    if (dc) { chips += dc; push({ target: "charm", uid: c.uid, kind: "chips", text: `+${fmtNum(dc)} Chips` }); }
    if (Math.abs(r.totalMult - mult) > 0.001) {
      if (X_EFFECTS.has(e.type) && mult) {
        const x = r.totalMult / mult;
        mult = r.totalMult;
        push({ target: "charm", uid: c.uid, kind: "xmult", text: `X${fmtNum(x)} Mult` });
      } else {
        const d = r.totalMult - mult;
        mult = r.totalMult;
        push({ target: "charm", uid: c.uid, kind: "mult", text: `${d >= 0 ? "+" : ""}${fmtNum(d)} Mult` });
      }
    }
  });

  // items held with a scoring effect (older item kinds)
  state.items.forEach((it) => {
    const r = applyItemEffects({ name: base.name, totalChips: chips, totalMult: mult }, cards, [it]);
    if (r.totalChips !== Math.round(chips)) { const d = r.totalChips - Math.round(chips); chips += d; push({ target: "item", uid: it.uid, kind: "chips", text: `+${d} Chips` }); }
    if (Math.abs(r.totalMult - mult) > 0.001) { mult = r.totalMult; push({ target: "item", uid: it.uid, kind: "mult", text: "Mult" }); }
  });

  // next-hand boosts from items used earlier
  if (state.nextHandChipBonus) { chips += state.nextHandChipBonus; push({ target: "hand", kind: "chips", text: `+${state.nextHandChipBonus} Chips` }); }
  if (state.nextHandDoubleChips) { chips *= 2; push({ target: "hand", kind: "chips", text: "X2 Chips" }); }
  if (state.nextHandChipsX && state.nextHandChipsX !== 1) { chips *= state.nextHandChipsX; push({ target: "hand", kind: "chips", text: `X${fmtNum(state.nextHandChipsX)} Chips` }); }
  if (state.nextHandDoubleMult) { mult *= 2; push({ target: "hand", kind: "xmult", text: "X2 Mult" }); }
  if (state.nextHandMultX && state.nextHandMultX !== 1) { mult *= state.nextHandMultX; push({ target: "hand", kind: "xmult", text: `X${fmtNum(state.nextHandMultX)} Mult` }); }
  if (state.nextHandBalance) { const avg = (chips + mult) / 2; chips = avg; mult = avg; push({ target: "hand", kind: "info", text: "Balanced" }); }

  // Boss Blind
  const boss = state.bossBlind;
  if (boss && boss.multPenaltyPerCard) {
    const m2 = Math.max(1, mult - cards.length * boss.multPenaltyPerCard);
    if (m2 !== mult) { mult = m2; push({ target: "hand", kind: "mult", text: `${boss.name}: -Mult` }); }
  }
  if (state.runMultiplier !== 1) push({ target: "hand", kind: "xmult", text: `Run X${fmtNum(state.runMultiplier)}` });

  chips = Math.round(chips);
  mult = Math.round(mult * 100) / 100;
  const score = Math.round(chips * mult * state.runMultiplier);
  return { name: base.name, scoringCards: cards, chips, mult, score, events, money, chipsAfterCards };
}

// Floating trigger label ("+11", "+4 Mult", "X2 Mult", "+$3", "Again!")
// above a card or under an artifact. Fixed to <body> so render() can't eat it.
function spawnTriggerLabel(el, text, kind, where, sub) {
  if (!el) return;
  const r = el.getBoundingClientRect();
  const lab = document.createElement("div");
  lab.className = `trig-label trig-${kind}`;
  lab.innerHTML = `<span>${text}</span>${sub ? `<small>${sub}</small>` : ""}`;
  document.body.appendChild(lab);
  const w = lab.offsetWidth, h = lab.offsetHeight;
  lab.style.left = Math.max(4, Math.min(window.innerWidth - w - 4, r.left + r.width / 2 - w / 2)) + "px";
  lab.style.top = (where === "below" ? r.bottom + 4 : r.top - h - 4) + "px";
  setTimeout(() => lab.remove(), 900);
}

function jiggleShelfPiece(uid) {
  const piece = uid && document.querySelector(`.shelf-piece[data-uid="${uid}"]`);
  if (!piece) return null;
  piece.classList.remove("trig-jiggle");
  void piece.offsetWidth;
  piece.classList.add("trig-jiggle");
  return piece;
}

// Steps through a scored hand's events: each one updates the Chips/Mult
// boxes and pops whatever fired, then the total lands.
function animateScoring(result, onDone) {
  const evs = result.events;
  const delay = Math.max(110, Math.min(360, 520 - evs.length * 14));
  let i = 0;
  const first = evs[0];
  state.popup = { name: result.name, chips: first.chips, mult: first.mult, phase: "counting", score: null };
  state.popupStartedAt = Date.now();
  render();
  const step = () => {
    if (i >= evs.length) {
      state.popup = { ...state.popup, chips: result.chips, mult: result.mult, score: result.score, phase: "total" };
      render();
      setTimeout(onDone, 700);
      return;
    }
    const ev = evs[i++];
    state.popup = { ...state.popup, chips: ev.chips, mult: ev.mult, bump: ev.kind };
    render();
    if (ev.target === "card") {
      const el = document.querySelector(`.hand-fan .card[data-card-id="${ev.id}"]`);
      if (el) {
        void el.offsetWidth;
        el.classList.add(ev.kind === "again" ? "card-again" : "card-ping");
        spawnTriggerLabel(el, ev.text, ev.kind, "above", ev.sub);
      }
      jiggleShelfPiece(ev.from);
    } else if (ev.target === "charm" || ev.target === "item") {
      spawnTriggerLabel(jiggleShelfPiece(ev.uid), ev.text, ev.kind, "below");
    } else if (ev.target === "hand" && ev.kind !== "base") {
      spawnTriggerLabel(document.querySelector(".score-popup .sp-boxes"), ev.text, ev.kind, "below");
    }
    setTimeout(step, ev.kind === "again" ? Math.round(delay * 1.2) : delay);
  };
  setTimeout(step, 380);
}

function triggerCharmEffects(result, cards) {
  // Process each charm and trigger effects
  let cardsToReplay = [];
  const chanceMult = chanceMultiplier();

  state.charms.forEach((charm) => {
    if (charm.effect.type === "engineRetrigger") return;
    if (charm.effect.type === "calculatorReplay") {
      if (Math.random() < Math.min(1, charm.effect.chance * chanceMult)) {
        // Trigger Calculator: replay scoring cards
        cardsToReplay = [...result.scoringCards];
        activateCharmSlide(charm, () => {
          // Charm effect was applied - cardsToReplay will be used
        });
      }
    }
  });
  
  return cardsToReplay;
}

// Spawns a floating "+N" chip label above a card element, positioned via a
// fixed-position node appended to <body> so it survives the next render()
// (which wipes and rebuilds #app) and can finish its own animation/removal.
function spawnChipFloat(el, amount) {
  if (!el || !amount) return;
  const rect = el.getBoundingClientRect();
  const float = document.createElement("div");
  float.className = "chip-float";
  float.textContent = "+" + amount;
  float.style.left = (rect.left + rect.width / 2) + "px";
  float.style.top = rect.top + "px";
  document.body.appendChild(float);
  setTimeout(() => float.remove(), 900);
}

function playHand() {
  if (state.selected.length === 0 || state.playsLeft <= 0 || state.overlay !== "playing") return;
  const selectedCards = state.hand.filter((c) => state.selected.includes(c.id));
  const baseResult = evaluateSelection(selectedCards);

  // Boss Blind hand-type restrictions (The Echo / The Mirage) block the play
  // entirely, without spending a hand, if violated.
  const violation = bossBlindHandTypeViolation(baseResult.name);
  if (violation) {
    state.bossBlindMessage = violation;
    render();
    setTimeout(() => {
      state.bossBlindMessage = null;
      render();
    }, 1800);
    return;
  }
  if (!state.firstHandTypeThisRound) state.firstHandTypeThisRound = baseResult.name;
  state.handTypesPlayedThisRound = [...(state.handTypesPlayedThisRound || []), baseResult.name];
  state.handTypeCounts = state.handTypeCounts || {};
  state.handTypeCounts[baseResult.name] = (state.handTypeCounts[baseResult.name] || 0) + 1;
  if (state.bossBlind && state.bossBlind.moneyResetOnMostPlayed) {
    const maxCount = Math.max(...Object.values(state.handTypeCounts));
    if (state.handTypeCounts[baseResult.name] === maxCount) {
      state.money = 0;
    }
  }

  const scoringCards = baseResult.scoringCards;
  const scoringIds = scoringCards.map((c) => c.id);
  const newPlaysLeft = state.playsLeft - 1;

  // Handle Monument: track consecutive hands without most played hand type
  const hasMonument = state.charms.some((c) => c.effect.type === "monumentHandTypeMult");
  if (hasMonument) {
    if (state.mostPlayedHandType === null) {
      state.mostPlayedHandType = baseResult.name;
      state.consecutiveHandsWithoutMostPlayed = 0;
    } else if (baseResult.name === state.mostPlayedHandType) {
      state.consecutiveHandsWithoutMostPlayed = 0;
    } else {
      state.consecutiveHandsWithoutMostPlayed += 1;
    }
  }
  
  // Handle Mirror: if first hand of round is single card, duplicate it
  if (state.selected.length === 1) {
    const totalPlays = 4 + getExtraPlays(state.items);
    if (newPlaysLeft === totalPlays - 1) { // First hand of round
      const hasMirror = state.charms.some((c) => c.effect.type === "mirrorSingleCard");
      if (hasMirror) {
        const card = selectedCards[0];
        if (card) {
          const cardCopy = { ...card, id: card.id + "_mirror_" + Date.now() + "_" + Math.random().toString(36).slice(2) };
          state.deck.push(cardCopy);
          noteAdded(1);
        }
      }
    }
  }

  // Trigger random charm effects at start of hand
  state.rouletteBonus = 0;
  state.coinMultBonus = false;
  state.coinMoneyPenalty = 0;
  state.stampMoneyBonus = 0;
  
  state.charms.forEach((charm) => {
    if (charm.effect.type === "rouletteRandomBonus") {
      const chanceMult = chanceMultiplier();
      const chipsChance = Math.min(1, charm.effect.chipsChance * chanceMult);
      const moneyChance = Math.min(1 - chipsChance, charm.effect.moneyChance * chanceMult);
      const rand = Math.random();
      if (rand < chipsChance) {
        state.rouletteBonus = charm.effect.chipsValue;
      } else if (rand < chipsChance + moneyChance) {
        state.money += charm.effect.moneyValue;
      }
    }
    if (charm.effect.type === "coinFlip") {
      if (Math.random() < Math.min(1, 0.5 * chanceMultiplier())) {
        state.coinMultBonus = true;
      } else {
        state.money += charm.effect.moneyGain;
      }
    }
  });
  
  // Apply Roulette bonus chips
  if (state.rouletteBonus > 0) {
    state.nextHandChipBonus += state.rouletteBonus;
  }
  
  // Increment streak counter
  state.streakCounter += 1;

  // Increment run-wide hands-played counter and grow Oracle's permanent
  // multiplier every 3rd hand played this run (accumulates on the charm
  // instance itself, same pattern as Ratchet's boss-clear bonus).
  state.handsPlayedRun = (state.handsPlayedRun || 0) + 1;
  state.charms.forEach((charm) => {
    if (charm.effect.type === "oracleCompoundMult" && state.handsPlayedRun % charm.effect.everyN === 0) {
      charm.oracleMultBonus = (charm.oracleMultBonus || 1) * charm.effect.value;
    }
  });

  // Zenith: flag whether this is the last play of the round before scoring resolves
  state.isLastPlayThisRound = newPlaysLeft === 0;
  
  // Apply money for Chains charm
  state.charms.forEach((charm) => {
    if (charm.effect.type === "chainsMoneyPerHand") {
      state.money += charm.effect.value;
    }
  });

  state.scoringIds = scoringIds;

  // Work the whole hand out (luck rolled now), use up the next-hand boosts,
  // then show it trigger by trigger.
  const result = scoreHand(selectedCards, { live: true });
  state.nextHandDoubleBase = false;
  state.nextHandChipBonus = 0;
  state.nextHandDoubleChips = false;
  state.nextHandChipsX = 1;
  state.nextHandDoubleMult = false;
  state.nextHandMultX = 1;
  state.nextHandBalance = false;
  state.nextHandRetrigger = false;
  state.stampMoneyBonus = (state.stampMoneyBonus || 0) + result.money;
  // Bell: $1 per 35 chips scored by the cards themselves
  state.bellMoneyBonus = 0;
  state.charms.forEach((charm) => {
    if (charm.effect.type === "bellMoneyPerChips") state.bellMoneyBonus = Math.floor(result.chipsAfterCards / charm.effect.chipsPerDollar);
  });
  animateScoring(result, () => finishPlay(result.score, newPlaysLeft));
}

function finishPlay(finalScore, newPlaysLeft) {
  // Encore Ticket: this hand also scores the previous hand's score again.
  const handScore = finalScore;
  if (state.nextHandBonusScore) {
    finalScore += state.nextHandBonusScore;
    state.nextHandBonusScore = 0;
  }
  state.lastHandScore = handScore;
  state.heartstoneHits = 0;
  setTimeout(() => {
    // fly the scoring cards up and fade the popup before the hand refills
    const popupEl = document.querySelector(".score-popup");
    if (popupEl) popupEl.classList.add("popup-out");
    state.scoringIds.forEach((id) => {
      const el = document.querySelector(`.hand-fan .card[data-card-id="${id}"]`);
      if (!el) return;
      el.style.transition = "transform .3s cubic-bezier(.4,0,.7,.3), opacity .3s ease";
      el.style.transform = `${el.dataset.finalTransform} translateY(-70px) scale(1.15)`;
      el.style.opacity = "0";
    });

    setTimeout(() => {
      state.popup = null;
      state.popupStartedAt = null;
      
      // Handle Mirror sleeve clones - clone played Mirror cards before clearing scoringIds.
      // Use all played cards (not just scoringIds) since a card's sleeve applies whether
      // or not it ended up contributing to the scored hand (e.g. a kicker).
      const playedCardsForMirror = state.hand.filter((c) => state.selected.includes(c.id));
      const mirrorClones = playedCardsForMirror.map((card) => {
        if (card && card.sleeve === "mirror") {
          return { ...card, id: card.id + "_mirror_" + Date.now() + "_" + Math.random().toString(36).slice(2), sleeve: undefined };
        }
        return null;
      }).filter(Boolean);
      
      state.scoringIds = [];
      const playedCards = state.hand.filter((c) => state.selected.includes(c.id));
      const { newDeck, newHand } = refillHand(state.deck, state.hand, state.selected);
      state.deck = [...newDeck, ...mirrorClones];
      noteAdded(mirrorClones.length);
      state.hand = newHand;
      state.usedCards = [...state.usedCards, ...playedCards];

      // The Butcher: force-discard random cards from the freshly refilled hand.
      if (state.bossBlind && state.bossBlind.discardAfterPlay) {
        const shuffledHand = shuffleArray(state.hand);
        const forcedIds = shuffledHand.slice(0, Math.min(state.bossBlind.discardAfterPlay, state.hand.length)).map((c) => c.id);
        if (forcedIds.length) {
          const forcedDiscarded = state.hand.filter((c) => forcedIds.includes(c.id));
          const refill2 = refillHand(state.deck, state.hand, forcedIds);
          state.deck = refill2.newDeck;
          state.hand = refill2.newHand;
          state.usedCards = [...state.usedCards, ...forcedDiscarded];
        }
      }
      state.selected = [];
      state.roundScore = state.roundScore + finalScore;
      state.playsLeft = newPlaysLeft;
      state.money += getTollboothBonus(state.charms);
      if (state.bellMoneyBonus) {
        state.money += state.bellMoneyBonus;
        state.bellMoneyBonus = 0;
      }
      if (state.stampMoneyBonus) {
        state.money += state.stampMoneyBonus;
        state.stampMoneyBonus = 0;
      }
      if (state.coinMoneyPenalty > 0) {
        state.money -= state.coinMoneyPenalty;
        state.coinMoneyPenalty = 0;
      }
      state.coinMultBonus = false;

      // Apply Thorns penalty for unused plays
      state.charms.forEach((charm) => {
        if (charm.effect.type === "thornsMultPerCard") {
          const playsUsed = 4 + getExtraPlays(state.items) - state.playsLeft;
          const totalPlays = 4 + getExtraPlays(state.items);
          const unusedPlays = Math.max(0, totalPlays - playsUsed);
          const penalty = Math.min(unusedPlays * charm.effect.moneyLossPerUnusedPlay, charm.effect.maxLoss);
          state.money -= penalty;
        }
      });

      const target = targetForAnte(state.ante, state.blindIdx);
      const firstHandOfRound = (state.handsThisRound || 0) === 0;
      state.handsThisRound = (state.handsThisRound || 0) + 1;
      let cleared = state.roundScore >= target;
      // Phoenix Feather: once per run, a lost blind counts as cleared.
      if (!cleared && newPlaysLeft <= 0) {
        const feather = state.charms.find((c) => c.effect.type === "phoenixSave");
        if (feather) {
          state.charms = state.charms.filter((c) => c.uid !== feather.uid);
          cleared = true;
          setTimeout(() => activateCharmSlide(feather, () => {}), 100);
        }
      }
      if (cleared) {
        state.charms.forEach((c) => {
          if (c.effect.type === "deadlineFirstHandClear" && firstHandOfRound) state.money += c.effect.value;
          if (c.effect.type === "investorMoneyPerCharm") state.money += state.charms.length * c.effect.value;
          if (c.effect.type === "satchelItemOnClear" && state.items.length < getEffectiveItemSlots()) {
            state.items = [...state.items, { ...randomOf(ITEM_DEFS), uid: newUid() }];
          }
        });
        const interest = getInterestBonus(state.items, state.money);
        const base = 3 + state.blindIdx;
        const leftover = getLeftoverHandsBonus(state.playsLeft, state.discardsLeft);
        state.lastRoundEarnings = { base, interest, leftover };
        state.money = state.money + base + interest + leftover;
        state.overlay = (state.blindIdx === 2 && state.ante === FINAL_ANTE) ? "victory" : "cleared";
        PPHub.event('blind');
        PPHub.best('ante', state.ante);
        if (state.blindIdx === 2) PPHub.event('boss');
        if (state.overlay === "victory") PPHub.event('win');
        if (state.blindIdx === 2) {
          // Boss Blind cleared - Ratchet's bonus is permanent, so it accumulates
          // on the charm instance itself rather than being recomputed live.
          state.charms.forEach((c) => {
            if (c.effect.type === "ratchetBossMult") {
              c.ratchetBonus = (c.ratchetBonus || 0) + c.effect.value;
            }
          });
        }
      } else if (newPlaysLeft <= 0) {
        state.overlay = "over";
        PPHub.event('run');
      }

      // The hand's outcome (score, money, deck/hand state, and win/loss) is now
      // fully resolved. Persist it before it's ever rendered/revealed. A lost
      // run has no save to resume — wipe it instead of writing a dead one.
      if (state.overlay === "over") {
        clearSave();
      } else {
        saveGame();
      }
      render();
    }, 260);
  }, 950);
}

function discard() {
  if (state.selected.length === 0 || state.discardsLeft <= 0 || state.overlay !== "playing") return;
  if (hasCharm("chainsNoDiscardX")) {
    state.bossBlindMessage = "Chains: you can't discard";
    render();
    setTimeout(() => { state.bossBlindMessage = null; render(); }, 1600);
    return;
  }
  // fly discarded cards downward and fade before refilling
  state.selected.forEach((id) => {
    const el = document.querySelector(`.hand-fan .card[data-card-id="${id}"]`);
    if (!el) return;
    el.style.transition = "transform .3s cubic-bezier(.4,0,.7,.3), opacity .3s ease";
    el.style.transform = `${el.dataset.finalTransform} translateY(130px) rotate(14deg) scale(.82)`;
    el.style.opacity = "0";
  });

  setTimeout(() => {
    // Check for Tithe sleeves and add money bonus
    const discardedCards = state.hand.filter(c => state.selected.includes(c.id));
    const titheBonus = discardedCards.filter(c => c.sleeve === "tithe").length * 5;
    // Collector: a lone first discard of the round is destroyed for cash.
    let collected = [];
    if (!state.collectorUsedThisRound) {
      state.collectorUsedThisRound = true;
      const collector = state.charms.find((c) => c.effect.type === "collectorFirstDiscard");
      if (collector && discardedCards.length === 1) {
        collected = discardedCards;
        state.money += collector.effect.value;
        noteDestroyed(discardedCards);
      }
    }
    
    const { newDeck, newHand } = refillHand(state.deck, state.hand, state.selected);
    state.deck = newDeck;
    state.hand = newHand;
    state.usedCards = [...state.usedCards, ...discardedCards.filter((c) => !collected.includes(c))];
    state.selected = [];
    state.discardsLeft -= 1;
    state.totalDiscardedRun = (state.totalDiscardedRun || 0) + discardedCards.length;
    state.charms = state.charms.map((c) => (c.effect.type === "lanternDiscardX" ? { ...c, lanternDiscards: (c.lanternDiscards || 0) + discardedCards.length } : c));
    state.money += getMoneyOnDiscard(state.items) + titheBonus;
    state.streakCounter = 0; // Reset Streak when discarding
    saveGame();
    render();
  }, 260);
}

/* ============================== ITEMS & SHOP ACTIONS ============================== */
function closeSidebar() {
  state.sidebarProgress = 0;
  render();
}

const SIDEBAR_PANEL_WIDTH = 132; // must match .item-panel width in CSS

let sidebarDrag = null;

function sidebarDragStart(e) {
  e.preventDefault();
  const point = e.touches ? e.touches[0] : e;
  sidebarDrag = {
    startX: point.clientX,
    startY: point.clientY,
    startYPct: state.sidebarY,
    startProgress: state.sidebarProgress,
    mode: null, // decided once the drag moves enough: "horizontal" (open/close) or "vertical" (reposition)
  };
  // Disable the CSS transition while live-dragging so the panel tracks the finger/cursor
  // 1:1 with no delay or eased "snap" motion; the transition comes back on the next render.
  const panel = document.querySelector(".item-panel");
  if (panel) panel.style.transition = "none";
  window.addEventListener("mousemove", sidebarDragMove);
  window.addEventListener("touchmove", sidebarDragMove, { passive: false });
  window.addEventListener("mouseup", sidebarDragEnd);
  window.addEventListener("touchend", sidebarDragEnd);
}

function sidebarDragMove(e) {
  if (!sidebarDrag) return;
  e.preventDefault();
  const point = e.touches ? e.touches[0] : e;
  const dx = point.clientX - sidebarDrag.startX;
  const dy = point.clientY - sidebarDrag.startY;

  if (!sidebarDrag.mode) {
    if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return; // ignore tiny jitter before committing to an axis
    sidebarDrag.mode = Math.abs(dx) > Math.abs(dy) ? "horizontal" : "vertical";
  }

  const tab = document.querySelector(".item-tab");
  const panel = document.querySelector(".item-panel");

  if (sidebarDrag.mode === "horizontal") {
    // Dragging the tab left reveals more of the panel. This is a direct 1:1 drag —
    // wherever you let go is exactly where it stays, no snapping to open/closed.
    const deltaProgress = -dx / SIDEBAR_PANEL_WIDTH;
    const progress = Math.max(0, Math.min(1, sidebarDrag.startProgress + deltaProgress));
    state.sidebarProgress = progress;
    if (tab) tab.style.right = (progress * SIDEBAR_PANEL_WIDTH) + "px";
    if (panel) panel.style.transform = `translateY(-50%) translateX(${(1 - progress) * 100}%)`;
  } else {
    const vh = window.innerHeight;
    const startPx = (sidebarDrag.startYPct / 100) * vh;
    const clampedPx = Math.max(36, Math.min(vh - 36, startPx + dy));
    const pct = (clampedPx / vh) * 100;
    state.sidebarY = pct;
    if (tab) tab.style.top = pct + "%";
    if (panel) panel.style.top = pct + "%";
  }
}

function sidebarDragEnd() {
  window.removeEventListener("mousemove", sidebarDragMove);
  window.removeEventListener("touchmove", sidebarDragMove);
  window.removeEventListener("mouseup", sidebarDragEnd);
  window.removeEventListener("touchend", sidebarDragEnd);
  sidebarDrag = null;
  render();
}

function goToShop() {
  // Calculate shop size from Overstock voucher
  const overstockBonus = state.vouchers.filter((v) => v.effect.type === "shopSizeBonus").reduce((s, v) => s + v.effect.value, 0);
  const shopSize = 6 + overstockBonus;
  
  state.shopStock = generateShopStock(shopSize);
  state.rerollCost = 5;
  state.shopDetail = null;
  
  // Generate voucher stock (up to 6 vouchers, vouchers that are already owned won't appear)
  const voucherPool = VOUCHERS.filter(v => !state.vouchers.some(owned => owned.id === v.id));
  state.voucherStock = [];
  for (let i = 0; i < Math.min(4, voucherPool.length); i++) {
    const randomIdx = Math.floor(Math.random() * voucherPool.length);
    state.voucherStock.push(voucherPool[randomIdx]);
    voucherPool.splice(randomIdx, 1);
  }
  
  // Booster packs: two per visit (rerolling doesn't change them); a Legend
  // Pack turns up in a slot 12% of the time.
  const commonPacks = PACK_DEFS.filter((p) => !p.rare);
  state.packStock = [0, 1].map(() => ({ ...(Math.random() < 0.12 ? PACK_DEFS.find((p) => p.rare) : randomOf(commonPacks)) }));

  state.overlay = "shop";
  saveGame();
  render();
}

function buyPack(index) {
  const pack = state.packStock && state.packStock[index];
  if (!pack) return;
  const price = shopPriceFor(pack);
  if (state.money < price) return;
  state.money -= price;
  if (state.freeBuy) state.freeBuy = false;
  state.packStock = state.packStock.map((p, i) => (i === index ? null : p));
  openPack(pack.id);
}

// Opens a pack: rolls its choices and shows the pick-one screen.
function openPack(packId) {
  const pack = PACK_DEFS.find((p) => p.id === packId);
  if (!pack) return;
  const ringmaster = hasCharm("ringmasterDuplicates");
  const owned = new Set(state.charms.map((c) => c.id));
  const pickDefs = (pool, n) => shuffleArray(pool).slice(0, n).map((d) => ({ ...d }));
  let choices = [];
  if (packId === "artifactPack") choices = pickDefs(CHARM_DEFS.filter((c) => ringmaster || !owned.has(c.id)), pack.choices);
  if (packId === "itemPack") choices = pickDefs(ITEM_DEFS.filter((d) => !d.secret), pack.choices);
  // secret hands' charts only once you've played that hand
  if (packId === "celestialPack") choices = pickDefs(ITEM_DEFS.filter((d) => d.chart && (!d.secret || (state.handTypeCounts || {})[d.effect.hand])), pack.choices);
  if (packId === "legendPack") choices = pickDefs(LEGENDARY_DEFS.filter((c) => !owned.has(c.id)), pack.choices);
  if (packId === "cardPack") choices = Array.from({ length: pack.choices }, () => makeCard(randomOf(RANKS), randomOf(SUIT_KEYS), Math.random() < 0.25 ? { stamp: randomOf(STAMP_KINDS) } : {}));
  if (packId === "ornatePack") choices = Array.from({ length: pack.choices }, () => makeCard(randomOf(RANKS), randomOf(SUIT_KEYS), { sleeve: randomOf(SLEEVE_KINDS), stamp: randomOf(STAMP_KINDS) }));
  state.packOpen = { id: packId, name: pack.name, choices };
  state.shopDetail = null;
  saveGame();
  render();
}

function takePackChoice(index) {
  const po = state.packOpen;
  if (!po) return;
  const choice = po.choices[index];
  if (!choice) return;
  if (choice.type === "charm") {
    if (state.charms.length >= state.charmSlots) return;
    state.charms = [...state.charms, { ...choice, uid: newUid() }];
  } else if (choice.type === "item" && choice.chart) {
    state.handLevels = { ...(state.handLevels || {}), [choice.effect.hand]: handLevel(choice.effect.hand) + 1 };
  } else if (choice.type === "item") {
    if (state.items.length >= getEffectiveItemSlots()) return;
    state.items = [...state.items, { ...choice, uid: newUid() }];
  } else {
    // a playing card: straight into the deck
    state.deck = shuffleArray([...state.deck, { ...choice }]);
    noteAdded(1);
  }
  state.packOpen = null;
  saveGame();
  render();
}

function skipPack() {
  state.packOpen = null;
  saveGame();
  render();
}

function PackOverlay() {
  const po = state.packOpen;
  const wrap = document.createElement("div");
  wrap.className = "pack-overlay";
  const def = PACK_DEFS.find((p) => p.id === po.id) || {};
  wrap.innerHTML = `
    <div class="pack-head">
      <div class="pack-art">${AnteArt.icon(def)}</div>
      <div>
        <div class="pack-title serif">${po.name}</div>
        <div class="pack-sub">Choose one</div>
      </div>
    </div>`;
  const grid = document.createElement("div");
  grid.className = "pack-choices";
  po.choices.forEach((choice, i) => {
    const tile = document.createElement("button");
    tile.className = "pack-choice";
    const isCard = !choice.type;
    let full = false;
    if (choice.type === "charm") full = state.charms.length >= state.charmSlots;
    if (choice.type === "item" && !choice.chart) full = state.items.length >= getEffectiveItemSlots();
    if (isCard) {
      const cardEl = renderCard(choice, { selected: false, scoring: false, dimmed: false, scale: 1, marginLeft: 0, arcIndex: 0, arcCount: 1, onClick: () => takePackChoice(i) });
      cardEl.classList.add("pack-card");
      cardEl.style.transform = "none";
      cardEl.dataset.finalTransform = "none";
      tile.appendChild(cardEl);
      const lines = [];
      if (choice.sleeve) lines.push(`<b>${AnteArt.sleeveLabel(choice.sleeve)}</b> ${SLEEVE_INFO[choice.sleeve]}`);
      if (choice.stamp) lines.push(`<b>${STAMP_LABELS[choice.stamp]} stamp</b> ${STAMP_INFO[choice.stamp]}`);
      tile.insertAdjacentHTML("beforeend", `<div class="pack-choice-desc">${lines.join("<br>") || "Plain card"}</div>`);
    } else {
      tile.innerHTML = `
        <div class="pack-choice-art${choice.rarity === "legendary" ? " legendary" : ""}">${AnteArt.icon(choice)}</div>
        <div class="pack-choice-name serif">${choice.name}</div>
        <div class="pack-choice-desc">${choice.desc}</div>
        ${full ? `<div class="pack-choice-full">Slots full</div>` : ""}`;
    }
    tile.disabled = full;
    tile.onclick = () => takePackChoice(i);
    grid.appendChild(tile);
  });
  wrap.appendChild(grid);
  const skip = document.createElement("button");
  skip.className = "pack-skip";
  skip.textContent = "Skip";
  skip.onclick = skipPack;
  wrap.appendChild(skip);
  return wrap;
}

// Rerolls the charm/item stock (not vouchers) for a price. Each reroll this
// shop visit doubles the cost of the next one; it resets back to base the
// next time the player enters a shop.
function rerollShop() {
  if (state.money < state.rerollCost) return;
  const overstockBonus = state.vouchers.filter((v) => v.effect.type === "shopSizeBonus").reduce((s, v) => s + v.effect.value, 0);
  const shopSize = 6 + overstockBonus;

  state.money -= state.rerollCost;
  state.shopStock = generateShopStock(shopSize);
  state.rerollCost = state.rerollCost * 2;
  state.shopDetail = null;
  saveGame();
  render();
}

// Tapping a charm/item opening or a voucher chit (anywhere but its Buy button)
// opens a popup with its full description. Tapping the backdrop, its own close
// button, or the same slot again closes it.
function openShopDetail(kind, index) {
  if (state.shopDetail && state.shopDetail.kind === kind && state.shopDetail.index === index) {
    state.shopDetail = null;
  } else {
    state.shopDetail = { kind, index };
  }
  render();
}
function closeShopDetail() {
  state.shopDetail = null;
  render();
}

function buyItem(shopIndex) {
  const item = state.shopStock[shopIndex];
  if (!item) return;
  
  // Calculate shop discount from Clearance Sale voucher
  const shopDiscount = state.vouchers.filter((v) => v.effect.type === "shopDiscount").reduce((m, v) => m * v.effect.value, 1);
  const discountedPrice = shopPriceFor(item);
  
  if (state.money < discountedPrice) return;
  
  if (item.type === "charm") {
    if (state.charms.length >= state.charmSlots) return;
    state.money -= discountedPrice;
    state.charms = [...state.charms, { ...item, uid: Math.random().toString(36).slice(2, 9) }];
  } else {
    if (state.items.length >= getEffectiveItemSlots()) return;
    state.money -= discountedPrice;
    state.items = [...state.items, { ...item, uid: Math.random().toString(36).slice(2, 9) }];
  }
  
  if (state.freeBuy) state.freeBuy = false;
  state.shopStock = state.shopStock.map((it, i) => (i === shopIndex ? null : it));
  saveGame();
  render();
}

function buyVoucher(voucherIndex) {
  const voucher = state.voucherStock[voucherIndex];
  if (!voucher) return;
  if (state.money < voucher.price) return;
  
  state.money -= voucher.price;
  state.vouchers = [...state.vouchers, { ...voucher }];
  state.voucherStock = state.voucherStock.map((v, i) => (i === voucherIndex ? null : v));
  saveGame();
  render();
}

function sellCharm(uid) {
  const idx = state.charms.findIndex((c) => c.uid === uid);
  if (idx === -1) return;
  const charm = state.charms[idx];
  
  // Check if this charm is Specter and if it has played 3+ blinds
  if (charm.effect.type === "specterDuplicate" && (charm.effect.blindCounter || 0) >= 3) {
    // Duplicate a random charm from current inventory (excluding the one being sold)
    const otherCharms = state.charms.filter((c) => c.uid !== uid);
    if (otherCharms.length > 0) {
      const targetCharm = otherCharms[Math.floor(Math.random() * otherCharms.length)];
      const charmDef = CHARM_DEFS.find((d) => d.id === targetCharm.id);
      if (charmDef) {
        const newCharm = { ...charmDef, uid: Math.random().toString(36).substring(7) };
        // Copy any accumulated state (like ratchet bonus)
        if (targetCharm.ratchetBonus !== undefined) {
          newCharm.ratchetBonus = targetCharm.ratchetBonus;
        }
        state.charms.push(newCharm);
        activateCharmSlide(charm, () => {});
      }
    }
  }
  
  state.money += sellValue(charm);
  // Removing the charm updates getEffectiveItemSlots() automatically. If The Fool's
  // slot was occupied, the item in it stays put, it just becomes an overflow item
  // until it's used or a new slot is gained again.
  state.charms = state.charms.filter((c) => c.uid !== uid);
  saveGame();
  render();
}

// Removes an item from the item slots after it's been used, unless an equipped
// Camera charm rolls its preserve chance - in which case the item stays in its
// slot and Camera itself gets a little activation slide so the save is visible.
// Only counts as "destroyed" (for The Joker) if it actually got removed.
// Camera can preserve any single item instance at most 4 times - after that,
// the item is always consumed on use regardless of Camera's roll.
function tryConsumeItem(item, itemUid) {
  state.charms.forEach((c) => { if (c.effect.type === "moneyOnItemUse") state.money += c.effect.value; });
  const cameraCharms = state.charms.filter((c) => c.effect.type === "cameraPreserve");
  const chanceMult = chanceMultiplier();
  const saveCount = item.cameraSaves || 0;
  let preservedBy = null;
  if (saveCount < 4) {
    for (const c of cameraCharms) {
      if (Math.random() < Math.min(1, c.effect.chance * chanceMult)) { preservedBy = c; break; }
    }
  }
  if (preservedBy) {
    setTimeout(() => activateCharmSlide(preservedBy, () => {}), 950);
    state.items = state.items.map((i) => (i.uid === itemUid ? { ...i, cameraSaves: saveCount + 1 } : i));
  } else {
    state.lastDestroyedItem = { ...item };
    state.items = state.items.filter((i) => i.uid !== itemUid);
  }
}

// Plays the "card gets sleeved" animation: the target card lifts up and glows
// while a floating label announces it, then settles back into place. Calls
// onComplete once finished so the caller can apply the actual state change,
// which is what makes the persistent sleeve visual (glow + badge) appear.
function playSleeveAnimation(cardId, sleeveType, onComplete) {
  const el = document.querySelector(`.hand-fan .card[data-card-id="${cardId}"]`);
  if (!el) { onComplete(); return; }
  const base = el.dataset.finalTransform || "";
  const glowColor = sleeveType === "sparkler" ? "#FFB84D" : "#C9A227";
  el.style.transition = "transform .22s cubic-bezier(.34,1.56,.64,1), filter .22s ease";
  el.style.transform = `${base} translateY(-24px) scale(1.1)`;
  el.style.filter = `brightness(1.35) drop-shadow(0 0 10px ${glowColor})`;
  spawnSleeveFloat(el, "Sleeved!", glowColor);
  setTimeout(() => {
    el.style.transform = base;
    el.style.filter = "brightness(1)";
    setTimeout(() => {
      el.style.transition = "";
      onComplete();
    }, 240);
  }, 250);
}

// Same as playSleeveAnimation but for stamps: lifts/glows the card in its
// stamp color, then applies the stamp via onComplete. Stamps and sleeves are
// independent properties, so this never touches card.sleeve.
function playStampAnimation(cardId, stampType, onComplete) {
  const el = document.querySelector(`.hand-fan .card[data-card-id="${cardId}"]`);
  if (!el) { onComplete(); return; }
  const base = el.dataset.finalTransform || "";
  const glowColor = STAMP_COLORS[stampType] || "#F2C94C";
  el.style.transition = "transform .22s cubic-bezier(.34,1.56,.64,1), filter .22s ease";
  el.style.transform = `${base} translateY(-24px) scale(1.1)`;
  el.style.filter = `brightness(1.35) drop-shadow(0 0 10px ${glowColor})`;
  spawnSleeveFloat(el, "Stamped!", glowColor);
  setTimeout(() => {
    el.style.transform = base;
    el.style.filter = "brightness(1)";
    setTimeout(() => {
      el.style.transition = "";
      onComplete();
    }, 240);
  }, 250);
}

// Same fixed-position floating-label trick as spawnChipFloat, reusing its
// entrance/exit animation but with custom text and color.
function spawnSleeveFloat(el, text, color) {
  if (!el) return;
  const rect = el.getBoundingClientRect();
  const float = document.createElement("div");
  float.className = "chip-float";
  float.style.color = color;
  float.style.textShadow = `0 2px 8px rgba(0,0,0,.55), 0 0 14px ${color}77`;
  float.textContent = text;
  float.style.left = (rect.left + rect.width / 2) + "px";
  float.style.top = rect.top + "px";
  document.body.appendChild(float);
  setTimeout(() => float.remove(), 900);
}

function useItem(itemUid) {
  const idx = state.items.findIndex((i) => i.uid === itemUid);
  if (idx === -1) return;
  const item = state.items[idx];
  const eff = item.effect;

  if (eff.type === "eraserRemoveCard") {
    if (state.overlay !== "playing" || state.selected.length === 0) return;
    const idsToRemove = state.selected.slice(0, eff.maxCards);
    activateCharmSlide(item, () => {
      noteDestroyed([...state.hand, ...state.deck].filter((c) => idsToRemove.includes(c.id)));
      state.hand = state.hand.filter((c) => !idsToRemove.includes(c.id));
      state.deck = state.deck.filter((c) => !idsToRemove.includes(c.id));
      state.usedCards = state.usedCards.filter((c) => !idsToRemove.includes(c.id));
      state.selected = state.selected.filter((id) => !idsToRemove.includes(id));
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "duplicatorCopyCard") {
    if (state.overlay !== "playing" || state.selected.length === 0) return;
    const targetId = state.selected[0];
    const source = state.hand.find((c) => c.id === targetId);
    if (!source) return;
    activateCharmSlide(item, () => {
      const clone = { ...source, id: source.id + "_dup_" + Date.now() + "_" + Math.random().toString(36).slice(2), sleeve: undefined };
      state.deck = [...state.deck, clone];
      noteAdded(1);
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "diceRandomMultX") {
    activateCharmSlide(item, () => {
      state.nextHandMultX = eff.min + Math.random() * (eff.max - eff.min);
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "freshDealRedraw") {
    if (state.overlay !== "playing" || state.hand.length === 0) return;
    const allIds = state.hand.map((c) => c.id);
    activateCharmSlide(item, () => {
      const discardedCards = state.hand.filter((c) => allIds.includes(c.id));
      const { newDeck, newHand } = refillHand(state.deck, state.hand, allIds);
      state.deck = newDeck;
      state.hand = newHand;
      state.usedCards = [...state.usedCards, ...discardedCards];
      state.selected = [];
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  // ----- reworked and new items -----
  const quick = (fn) => {
    activateCharmSlide(item, () => {
      fn();
      tryConsumeItem(item, itemUid);
      saveGame();
      render();
    });
  };
  const inPlay = state.overlay === "playing";
  const selectedInOrder = () => getSortedHand().filter((c) => state.selected.includes(c.id));
  const mapHand = (fn) => { state.hand = state.hand.map(fn); };

  if (eff.type === "levelHand") {
    return quick(() => {
      state.handLevels = { ...(state.handLevels || {}), [eff.hand]: handLevel(eff.hand) + 1 };
      const b = handBase(eff.hand);
      state.bossBlindMessage = `${eff.hand} → Lv ${handLevel(eff.hand)} (${b.chips} × ${b.mult})`;
      setTimeout(() => { state.bossBlindMessage = null; render(); }, 1800);
    });
  }
  if (eff.type === "loversShareMods") {
    const sel = selectedInOrder();
    if (!inPlay || sel.length < 2) return;
    const a = sel[0], b = sel[sel.length - 1];
    return quick(() => mapHand((c) => c.id === a.id ? { ...c, sleeve: b.sleeve, stamp: b.stamp } : c.id === b.id ? { ...c, sleeve: a.sleeve, stamp: a.stamp } : c));
  }
  if (eff.type === "merchantFreeBuy") return quick(() => { state.freeBuy = true; });
  if (eff.type === "gardenerGrowSuit") {
    if (state.hand.length === 0) return;
    return quick(() => {
      const counts = {};
      state.hand.forEach((c) => { counts[c.suit] = (counts[c.suit] || 0) + 1; });
      const suit = Object.keys(counts).sort((x, y) => counts[y] - counts[x])[0];
      for (let n = 0; n < eff.count; n++) state.deck.push(makeCard(randomOf(RANKS), suit));
      noteAdded(eff.count);
      state.deck = shuffleArray(state.deck);
    });
  }
  if (eff.type === "drawExtra") {
    if (!inPlay || state.deck.length === 0) return;
    return quick(() => {
      const drawn = state.deck.slice(0, eff.count);
      state.deck = state.deck.slice(drawn.length);
      tagBossDebuffedCards(drawn);
      state.hand = [...state.hand, ...drawn];
    });
  }
  if (eff.type === "extraPlayNow") {
    if (!inPlay) return;
    return quick(() => { state.playsLeft += eff.value; });
  }
  if (eff.type === "luckyRound") return quick(() => { state.luckyRound = true; });
  if (eff.type === "rankUpHand") {
    if (state.hand.length === 0) return;
    return quick(() => mapHand((c) => ({ ...c, rank: RANKS[(RANKS.indexOf(c.rank) + 1) % RANKS.length] })));
  }
  if (eff.type === "doubleBase") return quick(() => { state.nextHandDoubleBase = true; });
  if (eff.type === "encoreLastScore") {
    if (!state.lastHandScore) return;
    return quick(() => { state.nextHandBonusScore = state.lastHandScore; });
  }
  if (eff.type === "moneyPerCharm") return quick(() => { state.money += state.charms.length * eff.value; });
  if (eff.type === "roundHandSize") {
    if (!inPlay) return;
    return quick(() => {
      state.roundHandSizeBonus = (state.roundHandSizeBonus || 0) + eff.value;
      const { newDeck, newHand } = refillHand(state.deck, state.hand, []);
      state.deck = newDeck;
      state.hand = newHand;
    });
  }
  if (eff.type === "diceRandomChipsX") return quick(() => { state.nextHandChipsX = eff.min + Math.random() * (eff.max - eff.min); });
  if (eff.type === "raiseSellValue") {
    if (state.charms.length === 0) return;
    return quick(() => { state.charms = state.charms.map((c) => ({ ...c, sellBonus: (c.sellBonus || 0) + eff.value })); });
  }
  if (eff.type === "moneyPerActionLeft") return quick(() => { state.money += (state.playsLeft + state.discardsLeft) * eff.value; });
  if (eff.type === "interestNow") return quick(() => { state.money += getInterestBonus(state.items, state.money); });
  if (eff.type === "reshuffleUsed") {
    if (state.usedCards.length === 0) return;
    return quick(() => {
      state.deck = shuffleArray([...state.deck, ...state.usedCards]);
      state.usedCards = [];
    });
  }
  if (eff.type === "spreadSleeve") {
    const lead = getSortedHand()[0];
    if (!lead || !lead.sleeve) return;
    return quick(() => mapHand((c) => (c.rank === lead.rank && c.id !== lead.id ? withSleeve(c, lead.sleeve) : c)));
  }
  if (eff.type === "openPack") {
    activateCharmSlide(item, () => {
      tryConsumeItem(item, itemUid);
      openPack(eff.pack);
    });
    return;
  }
  if (eff.type === "stampRandom") {
    if (state.hand.length === 0) return;
    const ids = shuffleArray(state.hand).slice(0, eff.count).map((c) => c.id);
    return quick(() => mapHand((c) => (ids.includes(c.id) ? { ...c, stamp: randomOf(STAMP_KINDS) } : c)));
  }
  if (eff.type === "echoStamp") {
    const hand = getSortedHand();
    if (hand.length < 2 || !hand[0].stamp) return;
    return quick(() => mapHand((c) => (c.id === hand[1].id ? { ...c, stamp: hand[0].stamp } : c)));
  }
  if (eff.type === "stampSleeved") {
    if (!state.hand.some((c) => c.sleeve)) return;
    return quick(() => mapHand((c) => (c.sleeve ? { ...c, stamp: randomOf(STAMP_KINDS) } : c)));
  }
  if (eff.type === "sleeveRandom") {
    if (state.hand.length === 0) return;
    const ids = shuffleArray(state.hand).slice(0, eff.count).map((c) => c.id);
    return quick(() => mapHand((c) => (ids.includes(c.id) ? withSleeve(c, eff.sleeve) : c)));
  }
  if (eff.type === "moltCapsule") {
    const lead = getSortedHand()[0];
    if (!lead) return;
    return quick(() => mapHand((c) => (c.id === lead.id ? { ...c, sleeve: undefined, moltBuff: (c.moltBuff || 0) + eff.value } : c)));
  }
  if (eff.type === "larvaJar") {
    const lead = getSortedHand()[0];
    if (!lead) return;
    return quick(() => {
      for (let n = 0; n < eff.count; n++) state.deck.push(withSleeve({ ...lead, id: lead.id + "_jar_" + Date.now() + "_" + n + Math.random().toString(36).slice(2, 6) }, "larva"));
      noteAdded(eff.count);
      state.deck = shuffleArray(state.deck);
    });
  }
  if (eff.type === "copycatItem") {
    const others = state.items.filter((i) => i.uid !== itemUid && i.effect.type !== "copycatItem");
    if (others.length === 0) return;
    activateCharmSlide(item, () => {
      const pick = randomOf(others);
      state.items = state.items.map((i) => (i.uid === itemUid ? { ...pick, uid: newUid(), cameraSaves: 0 } : i));
      saveGame();
      render();
    });
    return;
  }
  if (eff.type === "pruneLow") {
    const isLow = (c) => c.rank === "2" || c.rank === "3";
    const count = state.deck.filter(isLow).length + state.usedCards.filter(isLow).length;
    if (count === 0) return;
    return quick(() => {
      state.deck = state.deck.filter((c) => !isLow(c));
      noteDestroyed([...state.deck, ...state.usedCards].filter(isLow));
      state.deck = state.deck.filter((c) => !isLow(c));
      state.usedCards = state.usedCards.filter((c) => !isLow(c));
    });
  }
  if (eff.type === "forgeAce") {
    if (!inPlay || state.selected.length === 0) return;
    const id = state.selected[0];
    return quick(() => mapHand((c) => (c.id === id ? { ...c, rank: "A" } : c)));
  }
  if (eff.type === "jackpotRoll") {
    return quick(() => {
      if (Math.random() < Math.min(1, eff.chance * chanceMultiplier())) {
        state.money += eff.value;
        state.bossBlindMessage = `Jackpot! +$${eff.value}`;
      } else {
        state.bossBlindMessage = "No luck this time";
      }
      setTimeout(() => { state.bossBlindMessage = null; render(); }, 1600);
    });
  }
  if (eff.type === "rallySuit") {
    const lead = getSortedHand()[0];
    if (!lead) return;
    return quick(() => mapHand((c) => ({ ...c, suit: lead.suit })));
  }
  if (eff.type === "swapRanks") {
    const sel = selectedInOrder();
    if (!inPlay || sel.length < 2) return;
    const a = sel[0], b = sel[sel.length - 1];
    return quick(() => mapHand((c) => (c.id === a.id ? { ...c, rank: b.rank } : c.id === b.id ? { ...c, rank: a.rank } : c)));
  }
  if (eff.type === "bountyFaces") return quick(() => { state.money += state.hand.filter((c) => ["J", "Q", "K"].includes(c.rank)).length * eff.value; });

  if (eff.type === "piggyBankDiscardsToMoney") {
    activateCharmSlide(item, () => {
      state.money += state.discardsLeft * eff.value;
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "flatMoneyGain") {
    activateCharmSlide(item, () => {
      state.money += eff.value;
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "hangedManSellCards") {
    if (state.overlay !== "playing" || state.selected.length === 0) return; // needs cards selected in hand
    const idsToDestroy = state.selected.slice(0, eff.maxCards);
    activateCharmSlide(item, () => {
      const earned = idsToDestroy.length * eff.pricePerCard;
      noteDestroyed(state.hand.filter((c) => idsToDestroy.includes(c.id)));
      state.hand = state.hand.filter((c) => !idsToDestroy.includes(c.id));
      state.deck = state.deck.filter((c) => !idsToDestroy.includes(c.id));
      state.selected = state.selected.filter((id) => !idsToDestroy.includes(id));
      state.money += earned;
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "loversTransformSuit") {
    const visualHand = getSortedHand();
    if (visualHand.length === 0) return;
    const targetId = visualHand[visualHand.length - 1].id;
    activateCharmSlide(item, () => {
      state.hand = state.hand.map((c) => (c.id === targetId ? { ...c, suit: eff.suit } : c));
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "strengthRankUp") {
    if (state.overlay !== "playing" || state.selected.length === 0) return; // needs cards selected in hand
    const idsToRaise = state.selected.slice(0, eff.maxCards);
    activateCharmSlide(item, () => {
      state.hand = state.hand.map((c) => {
        if (!idsToRaise.includes(c.id)) return c;
        const nextIdx = (RANKS.indexOf(c.rank) + eff.value) % RANKS.length;
        return { ...c, rank: RANKS[nextIdx] };
      });
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "temperanceSetRank") {
    if (state.hand.length === 0) return;
    const targetIds = shuffleArray(state.hand).slice(0, eff.count).map((c) => c.id);
    activateCharmSlide(item, () => {
      state.hand = state.hand.map((c) => (targetIds.includes(c.id) ? { ...c, rank: eff.rank } : c));
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "towerRerollRanks") {
    if (state.hand.length === 0) return;
    activateCharmSlide(item, () => {
      state.hand = state.hand.map((c) => ({ ...c, rank: RANKS[Math.floor(Math.random() * RANKS.length)] }));
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "transformRandomSuit") {
    if (state.hand.length === 0) return;
    const targetIds = shuffleArray(state.hand).slice(0, eff.count).map((c) => c.id);
    activateCharmSlide(item, () => {
      state.hand = state.hand.map((c) => (targetIds.includes(c.id) ? { ...c, suit: eff.suit } : c));
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "coinDoubleMult") {
    activateCharmSlide(item, () => {
      state.nextHandDoubleMult = true;
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "justiceBalanceHand") {
    activateCharmSlide(item, () => {
      state.nextHandBalance = true;
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "judgementCreateCharm") {
    if (state.charms.length >= state.charmSlots) return;
    const hasRingmaster = state.charms.some((c) => c.effect.type === "ringmasterDuplicates");
    const ownedCharmIds = hasRingmaster ? new Set() : new Set(state.charms.map((c) => c.id));
    const pool = CHARM_DEFS.filter((c) => !ownedCharmIds.has(c.id));
    if (pool.length === 0) return;
    const charmDef = pool[Math.floor(Math.random() * pool.length)];
    activateCharmSlide(item, () => {
      const newCharm = { ...charmDef, uid: Math.random().toString(36).slice(2, 9) };
      state.charms.push(newCharm);
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "emperorCreateItems") {
    const hasRingmaster = state.charms.some((c) => c.effect.type === "ringmasterDuplicates");
    activateCharmSlide(item, () => {
      const capacity = getEffectiveItemSlots();
      let currentCount = state.items.filter((i) => i.uid !== itemUid).length;
      const ownedItemIds = hasRingmaster ? new Set() : new Set(state.items.map((i) => i.id));
      for (let n = 0; n < eff.count; n++) {
        if (currentCount >= capacity) break;
        const pool = ITEM_DEFS.filter((i) => !ownedItemIds.has(i.id));
        if (pool.length === 0) break;
        const def = pool[Math.floor(Math.random() * pool.length)];
        const newItem = { ...def, uid: Math.random().toString(36).slice(2, 9) };
        state.items.push(newItem);
        ownedItemIds.add(def.id);
        currentCount++;
      }
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "deathCopyCard") {
    if (state.overlay !== "playing" || state.selected.length < 2) return; // needs at least 2 selected cards
    // Determine leftmost/rightmost among selected cards by their current visual position.
    const visualHand = getSortedHand();
    const selectedInOrder = visualHand.filter((c) => state.selected.includes(c.id));
    const leftmostId = selectedInOrder[0].id;
    const rightmostCard = selectedInOrder[selectedInOrder.length - 1];
    activateCharmSlide(item, () => {
      state.hand = state.hand.map((c) =>
        c.id === leftmostId ? { ...c, rank: rightmostCard.rank, suit: rightmostCard.suit, sleeve: rightmostCard.sleeve, stamp: rightmostCard.stamp } : c
      );
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "magicianSleeveCard") {
    const visualHand = getSortedHand();
    if (visualHand.length === 0) return;
    const targetId = visualHand[0].id; // leftmost card in hand
    activateCharmSlide(item, () => {
      playSleeveAnimation(targetId, eff.sleeve, () => {
        state.hand = state.hand.map((c) => (c.id === targetId ? withSleeve(c, eff.sleeve) : c));
        if (eff.sleeve === "molt") {
          state.moltTargets = { ...state.moltTargets, [targetId]: true };
        }
        tryConsumeItem(item, itemUid);
        saveGame();
        render();
      });
    });
    return;
  }

  if (eff.type === "stampCard") {
    const visualHand = getSortedHand();
    if (visualHand.length === 0) return;
    const targetId = visualHand[0].id; // leftmost card in hand
    activateCharmSlide(item, () => {
      playStampAnimation(targetId, eff.stamp, () => {
        state.hand = state.hand.map((c) => (c.id === targetId ? { ...c, stamp: eff.stamp } : c));
        tryConsumeItem(item, itemUid);
        saveGame();
        render();
      });
    });
    return;
  }

  if (eff.type === "jokerTransform" && state.lastDestroyedItem) {
    activateCharmSlide(item, () => {
      const transformed = { ...state.lastDestroyedItem, uid: Math.random().toString(36).slice(2, 9) };
      state.items = state.items.map((it, i) => (i === idx ? transformed : it));
      // The Joker itself is consumed by transforming, not destroyed as "used" in the
      // traditional sense (it becomes something else), so we don't remove the slot
      // and we don't set lastDestroyedItem here.
      saveGame();
    });
    return;
  }

  activateCharmSlide(item, () => {
    if (eff.type === "devilMultiplier") {
      state.runMultiplier = Math.round(state.runMultiplier * eff.value * 100) / 100;
    } else if (eff.type === "fortuneNextHandChips") {
      state.nextHandChipBonus += eff.value;
    } else if (eff.type === "sunRefillDiscards") {
      state.discardsLeft = 4 + getExtraDiscards(state.items);
    } else if (eff.type === "empressRetrigger") {
      state.nextHandRetrigger = true;
    } else if (eff.type === "hermitDoubleMoney") {
      state.money += Math.min(state.money, eff.cap);
    } else if (eff.type === "starDoubleChips") {
      state.nextHandDoubleChips = true;
    }
    // No prior destroyed item for Joker to become - it just fizzles and is used up.

    // Track this item as the most recently destroyed/used item (for future Joker uses),
    // then remove it from the item slots since it has been consumed - unless a Camera
    // charm preserves it.
    tryConsumeItem(item, itemUid);
    saveGame();
  });
}

function leaveShop() {
  state.charms.filter((c) => c.effect.type === "vaultCopyItem").forEach(() => {
    if (state.items.length) state.items = [...state.items, { ...randomOf(state.items), uid: newUid(), cameraSaves: 0 }];
  });
  goNextBlind();
}

function takeTheWin() {
  state.overlay = "won";
  clearSave();
  render();
}

function goNextBlind() {
  let nextAnte = state.ante;
  let nextBlindIdx = state.blindIdx + 1;
  if (nextBlindIdx > 2) {
    nextBlindIdx = 0;
    nextAnte = state.ante + 1;
  }
  startNextBlind(nextAnte, nextBlindIdx);
}

function setSortMode(mode) {
  if (mode === "manual" && state.sortMode !== "manual") {
    // Seed manual order from whatever's currently displayed so the switch is seamless.
    state.handOrder = getSortedHand().map((c) => c.id);
  }
  state.sortMode = mode;
  render();
}

function getSortedHand() {
  if (state.sortMode === "manual") {
    syncHandOrder();
    return state.handOrder.map((id) => state.hand.find((c) => c.id === id)).filter(Boolean);
  }
  const arr = [...state.hand];
  if (state.sortMode === "suit") {
    arr.sort((a, b) => {
      const s = SUIT_KEYS.indexOf(a.suit) - SUIT_KEYS.indexOf(b.suit);
      return s !== 0 ? s : rankStraightValueHigh(a.rank) - rankStraightValueHigh(b.rank);
    });
  } else {
    arr.sort((a, b) => rankStraightValueHigh(a.rank) - rankStraightValueHigh(b.rank));
  }
  return arr;
}

// Keeps handOrder in sync with state.hand: drops ids no longer in hand,
// appends any new ids (newly dealt/drawn cards) to the end.
function syncHandOrder() {
  const handIds = state.hand.map((c) => c.id);
  const stillValid = state.handOrder.filter((id) => handIds.includes(id));
  const missing = handIds.filter((id) => !stillValid.includes(id));
  state.handOrder = [...stillValid, ...missing];
}

// Reorders a card within the current visual order (used by drag-to-reorder).
// Works no matter which sortMode is active - dragging always switches to manual.
function moveCardToPosition(cardId, targetIndex) {
  const currentVisual = getSortedHand().map((c) => c.id);
  const fromIndex = currentVisual.indexOf(cardId);
  if (fromIndex === -1) return;
  currentVisual.splice(fromIndex, 1);
  const clampedIndex = Math.max(0, Math.min(targetIndex, currentVisual.length));
  currentVisual.splice(clampedIndex, 0, cardId);
  state.handOrder = currentVisual;
}

// A small clickable deck pile + counter, docked bottom-left so it never sits
// over the hand fan, preview text, or action buttons. Clicking opens a modal
// showing every card in the 52-card deck: still-in-deck cards are shown face
// up at full opacity, while cards currently in hand or already played/
// discarded this blind are shown dimmed as sleeved card backs.
function renderDeckWidget() {
  const widget = document.createElement("div");
  widget.className = "deck-widget";

  const stack = document.createElement("div");
  stack.className = "deck-stack";
  const stackW = 26, stackH = 36;
  stack.style.width = stackW + "px";
  stack.style.height = stackH + "px";

  // Draw a few layered card-backs so the pile reads as a physical deck,
  // capped so an empty/near-empty deck doesn't look full.
  const layers = Math.max(1, Math.min(3, Math.ceil(state.deck.length / 17)));
  for (let i = 0; i < layers; i++) {
    const back = document.createElement("div");
    back.className = "deck-card-back";
    back.style.width = stackW + "px";
    back.style.height = stackH + "px";
    back.style.left = -i * 1 + "px";
    back.style.top = -i * 1 + "px";
    back.style.zIndex = i;
    const inner = document.createElement("div");
    inner.className = "deck-card-back-inner";
    back.appendChild(inner);
    stack.appendChild(back);
  }
  widget.appendChild(stack);

  const pill = document.createElement("div");
  pill.className = "deck-count-pill";
  pill.textContent = `${state.deck.length} left`;
  widget.appendChild(pill);

  const label = document.createElement("div");
  label.className = "deck-label";
  label.textContent = "Deck";
  widget.appendChild(label);

  widget.onclick = () => {
    state.deckOverlayOpen = true;
    render();
  };

  return widget;
}

function renderDeckModal() {
  const overlay = document.createElement("div");

    <span><span class="deck-legend-swatch" style="background:linear-gradient(160deg,#FBF6E8,#ECE2C5);opacity:.32"></span>In hand / played / discarded</span>

  const allCardsForSleeves = [...state.deck, ...state.hand, ...state.usedCards];
  const sleevesPresent = [...new Set(allCardsForSleeves.filter((c) => c.sleeve).map((c) => c.sleeve))];
  if (sleevesPresent.length > 0) {

    ).join("");
    overlay.appendChild(sleeveLegend);
  }

  const stampsPresent = [...new Set(allCardsForSleeves.filter((c) => c.stamp).map((c) => c.stamp))];
  if (stampsPresent.length > 0) {
    const stampLegend = document.createElement("div");
    stampLegend.className = "deck-modal-legend";
    stampLegend.style.marginTop = "-8px";
    stampLegend.innerHTML = stampsPresent.map((s) =>
      `<span><span class="deck-legend-dot" style="background:${STAMP_COLORS[s]}"></span>${STAMP_LABELS[s]} Stamp</span>`
    ).join("");
    overlay.appendChild(stampLegend);
  }

  const grid = document.createElement("div");
  grid.className = "deck-modal-grid";

  const inHandIds = new Set(state.hand.map((c) => c.id));
  const usedIds = new Set(state.usedCards.map((c) => c.id));
  // Include duplicate/cloned cards (from charms like Mirror/Larva) alongside
  // the base 52 so the modal reflects the deck's true current contents.
  const allCards = [...state.deck, ...state.hand, ...state.usedCards];

  SUIT_KEYS.forEach((suit) => {
    const suitCards = allCards
      .filter((c) => c.suit === suit)
      .sort((a, b) => RANKS.indexOf(a.rank) - RANKS.indexOf(b.rank));
    if (suitCards.length === 0) return;

    const section = document.createElement("div");
    const rowLabel = document.createElement("div");
    rowLabel.className = "deck-suit-row-label";
    rowLabel.innerHTML = `${suitIconSVG(suit, 10)} ${SUITS[suit].label}`;
    rowLabel.style.display = "flex";
    rowLabel.style.alignItems = "center";
