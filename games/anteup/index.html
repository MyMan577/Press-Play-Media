/* ============================== ARTIFACT SLEEVES ==============================
   Shop artifacts (and Artifact Pack ones) sometimes come in a sleeve. Two
   are shared with playing cards, three are artifact-only. Chances are per
   artifact; Polish / Lacquer multiply them. Negative is the rarest: an
   artifact with it doesn't take up a slot. */
const CHARM_SLEEVES = {
  sparkler: { name: "Sparkler", desc: "+50 Chips", price: 2, chance: 0.02, color: "#FFB84D" },
  tithe: { name: "Tithe", desc: "Earns $2 every time you clear a blind", price: 2, chance: 0.015, color: "#B8956A" },
  gilded: { name: "Gilded", desc: "+10 Mult", price: 3, chance: 0.015, color: "#F2C94C" },
  prismatic: { name: "Prismatic", desc: "X1.5 Mult", price: 5, chance: 0.007, color: "#c38bff" },
  negative: { name: "Negative", desc: "Doesn't take up an artifact slot", price: 5, chance: 0.003, color: "#7a55b0" },
};
function rollCharmSleeve(def) {
  const rate = voucherBest("charmSleeveRate", Math.max);
  let r = Math.random();
  for (const [k, sl] of Object.entries(CHARM_SLEEVES)) {
    if (r < sl.chance * rate) return withCharmSleeve(def, k);
    r -= sl.chance * rate;
  }
  return def;
}
function withCharmSleeve(def, sleeve) {
  const base = def.price - (def.sleevePrice || 0);
  const sp = CHARM_SLEEVES[sleeve] ? CHARM_SLEEVES[sleeve].price : 0;
  return { ...def, sleeve, sleevePrice: sp, price: base + sp };
}
// Artifacts that take up a slot (Negative ones don't).
function charmsUsed() {
  return state.charms.filter((c) => c.sleeve !== "negative").length;
}
function hasCharmRoom() {
  return charmsUsed() < state.charmSlots;
}
function charmSleeveLine(def) {
  const sl = def && def.sleeve && CHARM_SLEEVES[def.sleeve];
  return sl ? `<div class="sleeve-line" style="--sc:${sl.color}"><b>${sl.name} sleeve</b> ${sl.desc}</div>` : "";
}

/* Negative playing cards: +1 hand size while in your hand. Drawing one means
   you draw another card on top. */
function handSizeFor(hand) {
  return getHandSize() - (state.hand || []).filter((c) => c.sleeve === "negative").length + hand.filter((c) => c.sleeve === "negative").length;
}
function drawInto(hand, deck) {
  const drawn = [];
  while (deck.length && hand.length + drawn.length < handSizeFor([...hand, ...drawn])) drawn.push(deck.shift());
  return drawn;
}

/* ============================== NEWER ARTIFACTS ==============================
   Helpers for the artifacts modelled on the genre's best-known jokers. */
function isFace(card) {
  return ["J", "Q", "K"].includes(card.rank) || hasCharm("pareidoliaFaces");
}
// Artifacts the shop and packs can offer. Ripe Plum only turns up once a
// Wild Plum has rotted away this run.
function artifactPool() {
  return CHARM_DEFS.filter((c) => !c.locked || (c.locked === "plum" && state.plumGone));
}
// The shelf as scoring sees it: Carbon Copy takes on the artifact to its
// right, Echo Chamber your leftmost one (copies of copies follow the chain).
function effectiveCharms() {
  const list = state.charms;
  const resolve = (i, depth) => {
    const c = list[i];
    if (!c || depth > list.length) return null;
    if (c.effect.type === "copyRight") return resolve(i + 1, depth + 1);
    if (c.effect.type === "copyLeftmost") return i === 0 ? null : resolve(0, depth + 1);
    return c;
  };
  return list.map((c, i) => {
    if (c.effect.type !== "copyRight" && c.effect.type !== "copyLeftmost") return c;
    const src = resolve(i, 0);
    return src ? { ...src, uid: c.uid, name: c.name, copyOf: src.uid, sleeve: c.sleeve } : c;
  });
}
// What a copier is copying right now (for its popup).
function copyTarget(charm) {
  const e = effectiveCharms().find((c) => c.uid === charm.uid);
  return e && e.copyOf ? state.charms.find((c) => c.uid === e.copyOf) : null;
}
function flashMessage(text, ms = 1800) {
  state.bossBlindMessage = text;
  setTimeout(() => { if (state.bossBlindMessage === text) { state.bossBlindMessage = null; render(); } }, ms);
}
function noteSold() {
  state.charms = state.charms.map((c) => (c.effect.type === "bonfireX" ? { ...c, bonfireBonus: (c.bonfireBonus || 0) + c.effect.value } : c));
}
function noteChartUsed() {
  state.charms = state.charms.map((c) => (c.effect.type === "stargazerX" ? { ...c, stars: (c.stars || 0) + 1 } : c));
}
// After every played hand: Fizz and Sundae run down.
function afterHandCharms() {
  const gone = [];
  state.charms = state.charms.map((c) => {
    const e = c.effect;
    if (e.type === "fizzRetrigger") { const n = (c.fizzLeft ?? e.hands) - 1; if (n <= 0) gone.push(c); return { ...c, fizzLeft: n }; }
    if (e.type === "sundaeChips") { const n = (c.chipsLeft ?? e.value) + e.drop; if (n <= 0) gone.push(c); return { ...c, chipsLeft: n }; }
    return c;
  });
  if (gone.length) {
    state.charms = state.charms.filter((c) => !gone.some((g) => g.uid === c.uid));
    flashMessage(gone.map((g) => (g.effect.type === "fizzRetrigger" ? `${g.name} went flat` : `${g.name} melted`)).join(" · "));
  }
}
// When a blind is cleared: plums may rot, Popcorn shrinks, Nest Egg grows,
// Bonfire burns out after a boss.
function roundEndCharms(wasBoss) {
  const notes = [];
  const gone = [];
  state.charms = state.charms.map((c) => {
    const e = c.effect;
    if ((e.type === "plumMult" || e.type === "ripePlumX") && Math.random() < e.rot) {
      gone.push(c);
      if (e.type === "plumMult") state.plumGone = true;
      notes.push(`${c.name} rotted away`);
      return c;
    }
    if (e.type === "popcornMult") { const n = (c.multLeft ?? e.value) + e.drop; if (n <= 0) { gone.push(c); notes.push(`${c.name} is empty`); } return { ...c, multLeft: n }; }
    if (c.sleeve === "tithe") state.money += 2;
    if (e.type === "nestEgg") return { ...c, sellBonus: (c.sellBonus || 0) + e.value };
    if (e.type === "bonfireX" && wasBoss && c.bonfireBonus) { notes.push(`${c.name} burned out`); return { ...c, bonfireBonus: 0 }; }
    return c;
  });
  if (gone.length) state.charms = state.charms.filter((c) => !gone.some((g) => g.uid === c.uid));
  if (notes.length) flashMessage(notes.join(" · "), 2400);
}

/* ============================== ARTIFACT PROGRESS ==============================
   What an artifact has built up, for the shelf and its detail popup:
   bar   — progress toward its next trigger (Specter, Oracle, Tally Lantern)
   stat  — its current value, for artifacts that grow over the run */
function charmProgress(c) {
  const e = c.effect || {};
  const out = {};
  switch (e.type) {
    case "specterDuplicate": {
      const n = Math.min(3, e.blindCounter || 0);
      out.bar = { value: n, max: 3, label: n >= 3 ? "Ready: sell to copy an artifact" : `${n} / 3 blinds`, ready: n >= 3 };
      break;
    }
    case "oracleCompoundMult": {
      const n = (state.handsPlayedRun || 0) % e.everyN;
      out.bar = { value: n, max: e.everyN, label: `${n} / ${e.everyN} hands to the next X${e.value}` };
      out.stat = `X${(c.oracleMultBonus || 1).toFixed(2)}`;
      break;
    }
    case "lanternDiscardX": {
      const d = c.lanternDiscards || 0;
      out.bar = { value: d % e.per, max: e.per, label: `${d % e.per} / ${e.per} discards to the next X1` };
      out.stat = `X${1 + Math.floor(d / e.per) * e.value}`;
      break;
    }
    case "ratchetBossMult": out.stat = `+${c.ratchetBonus || 0}`; break;
    case "punchCardX": {
      const n = (state.handsPlayedRun || 0) % e.everyN;
      out.bar = { value: n, max: e.everyN, label: `${n} / ${e.everyN} hands — X${e.value} on the ${e.everyN}th`, ready: n === e.everyN - 1 };
      break;
    }
    case "fizzRetrigger": { const n = c.fizzLeft ?? e.hands; out.bar = { value: n, max: e.hands, label: `${n} hands of fizz left` }; break; }
    case "sundaeChips": { const n = c.chipsLeft ?? e.value; out.stat = `+${n}`; out.chips = true; out.bar = { value: n, max: e.value, label: `Melts ${-e.drop} Chips every hand` }; break; }
    case "popcornMult": { const n = c.multLeft ?? e.value; out.stat = `+${n}`; out.bar = { value: n, max: e.value, label: `Loses ${-e.drop} Mult every round` }; break; }
    case "leechX": out.stat = `X${(1 + (c.leechBonus || 0)).toFixed(1)}`; break;
    case "bonfireX": out.stat = `X${(1 + (c.bonfireBonus || 0)).toFixed(2)}`; break;
    case "commuterMult": out.stat = `+${(c.busCount || 0) * e.value}`; break;
    case "stargazerX": out.stat = `X${(1 + (c.stars || 0) * e.value).toFixed(1)}`; break;
    case "jackknifeX": out.stat = `X${1 + (c.jackBonus || 0)}`; break;
    case "deuceChips": out.stat = `+${c.deuceBonus || 0}`; out.chips = true; break;
    case "almanacMultPerAnte": out.stat = `+${Math.max(0, state.ante - 1) * e.value}`; break;
    case "streakMult": out.stat = `+${(state.streakCounter || 0) * e.value}`; break;
    case "furnaceChipsPerDiscard": out.stat = `+${(state.totalDiscardedRun || 0) * e.value}`; out.chips = true; break;
    case "pocketwatchChipsPerHand": out.stat = `+${(state.handsPlayedRun || 0) * e.value}`; out.chips = true; break;
    case "vultureMultPerDestroyed": out.stat = `+${(state.cardsDestroyedRun || 0) * e.value}`; break;
    case "mirrorsAddedX": out.stat = `X${(1 + (state.cardsAddedRun || 0) * e.value).toFixed(1)}`; break;
    case "saintFaceDestroyedX": out.stat = `X${c.saintX || 1}`; break;
    case "midnightSunX": out.stat = `X${1 + Object.keys(state.handTypeCounts || {}).length * e.value}`; break;
  }
  return out;
}
// The little bar + value badge drawn over a shelf piece.
function progressOverlay(c) {
  const p = charmProgress(c);
  let html = "";
  if (p.stat) html += `<span class="prog-stat${p.chips ? " chips" : ""}">${p.stat}</span>`;
  if (p.bar) html += `<span class="prog-bar${p.bar.ready ? " ready" : ""}"><i style="width:${Math.round((p.bar.value / p.bar.max) * 100)}%"></i></span>`;
  return html;
}
// The bigger version for the detail popup.
function progressBlock(c) {
  const p = charmProgress(c);
  if (!p.bar && !p.stat) return "";
  return `<div class="prog-block">` +
    (p.stat ? `<div class="prog-block-stat">Now <b class="${p.chips ? "c" : "m"}">${p.stat}</b> ${p.chips ? "Chips" : "Mult"}</div>` : "") +
    (p.bar ? `<div class="prog-block-bar${p.bar.ready ? " ready" : ""}"><i style="width:${Math.round((p.bar.value / p.bar.max) * 100)}%"></i></div><div class="prog-block-label">${p.bar.label}</div>` : "") +
    `</div>`;
}

/* ============================== ARCANA ==============================
   Arcana Packs hold items that act on your cards (or pay out), used the
   moment you pick them on the hand the pack draws. Items that only boost
   your next hand, or only make sense mid-round, are left out. */
const ARCANA_EXCLUDE = new Set([
  // next-hand / scoring buffs
  "devil", "fortune", "empress", "star", "justice", "coinItem", "dice", "doubleDownToken", "encoreTicket", "loadedDice",
  // only mean something during a round
  "sun", "theGravedigger", "batteryPack", "freshDeal", "luckyBreak", "secondWind", "piggyBank", "pocketChange", "shufflePass",
  // refer to other items or open packs
  "joker", "copycat", "supplyCrate",
]);
function arcanaPool() {
  return ITEM_DEFS.filter((d) => !d.secret && !d.chart && !ARCANA_EXCLUDE.has(d.id));
}
// Arcana that need cards picked in the hand: [min, max].
function arcanaSelection(def) {
  const e = def.effect || {};
  switch (e.type) {
    case "eraserRemoveCard": return [1, e.maxCards || 1];
    case "duplicatorCopyCard": return [1, 1];
    case "hangedManSellCards": return [1, e.maxCards || 2];
    case "loversShareMods": return [2, 2];
    case "deathCopyCard": return [2, 2];
    case "strengthRankUp": return [1, e.maxCards || 3];
    case "forgeAce": return [1, 1];
    case "swapRanks": return [2, 2];
  }
  return null;
}
let ITEM_INSTANT = false; // items resolve at once, with no animation (arcana in a pack)

// Uses an arcana item on the pack's hand. The pack's cards stand in as your
// hand while the item runs, then every change is written back to wherever
// those cards live in your deck. Returns false if it couldn't be used.
function useArcana(def, selectedIds) {
  const inPlay = state.overlay === "playing";
  const real = { hand: state.hand, selected: state.selected, overlay: state.overlay, sortMode: state.sortMode, handOrder: state.handOrder };
  const before = packHandCards();
  const beforeIds = before.map((c) => c.id);
  const token = { ...def, uid: "arcana_" + newUid() };
  state.items = [...state.items, token];
  if (!inPlay) {
    state.hand = before;
    state.overlay = "playing";
    state.sortMode = "manual";
    state.handOrder = packHandOrdered().map((c) => c.id);
  }
  state.selected = selectedIds.slice();
  ITEM_INSTANT = true;
  try {
    useItem(token.uid);
  } finally {
    ITEM_INSTANT = false;
  }
  const used = !state.items.includes(token);
  state.items = state.items.filter((i) => i.uid !== token.uid);
  if (!inPlay) {
    const after = state.hand;
    const afterById = new Map(after.map((c) => [c.id, c]));
    const gone = new Set(beforeIds.filter((id) => !afterById.has(id)));
    const fix = (arr) => arr.filter((c) => !gone.has(c.id)).map((c) => afterById.get(c.id) || c);
    state.deck = fix(state.deck);
    state.usedCards = fix(state.usedCards || []);
    const realHand = fix(real.hand);
    const known = new Set(allRunCards().map((c) => c.id).concat(realHand.map((c) => c.id)));
    const fresh = after.filter((c) => !beforeIds.includes(c.id) && !known.has(c.id));
    if (fresh.length) state.deck = shuffleArray([...state.deck, ...fresh]);
    state.hand = realHand;
    state.overlay = real.overlay;
    state.sortMode = real.sortMode;
    state.handOrder = real.handOrder;
    state.selected = real.selected;
    if (state.packOpen) state.packOpen.hand = after.map((c) => c.id).filter((id) => !gone.has(id));
  } else {
    state.selected = [];
    if (state.packOpen) state.packOpen.hand = state.hand.map((c) => c.id);
  }
  return used;
}

/* ============================== SPECTRAL CARDS ==============================
   Found only in Spectral Packs and used the moment you pick them. A Spectral
   Pack shows a hand of your cards (your real hand mid-round, otherwise 8
   drawn from the deck) and the spectral works on that hand. Each one has a
   big upside paid for with something permanent. */
const SPECTRAL_DEFS = [
  { id: "kinfolk", name: "Kinfolk", desc: "Destroys 1 random card in your hand, adds 3 stamped face cards to your deck", color: "#8e7cc3" },
  { id: "bonePact", name: "Bone Pact", desc: "Destroys 1 random card in your hand, adds 2 sleeved Aces to your deck", color: "#cfc6b0" },
  { id: "chorus", name: "Chorus", desc: "Destroys 1 random card in your hand, adds 4 stamped number cards to your deck", color: "#5fa8c9" },
  { id: "paupersPact", name: "Pauper's Pact", desc: "Gives you a random artifact (needs room), and your money drops to $0", color: "#8a96a3" },
  { id: "seance", name: "Séance", desc: "Every card in your hand becomes the same random rank. −1 hand size for good", color: "#7E57C2" },
  { id: "phantomLimb", name: "Phantom Limb", desc: "A random artifact gets a Negative sleeve (it stops taking a slot). −1 hand size for good", color: "#6fb3a8" },
  { id: "halo", name: "Halo", desc: "A random unsleeved artifact gets a Sparkler, Gilded or Prismatic sleeve", color: "#FFE28A" },
  { id: "prismHex", name: "Prism Hex", desc: "A random artifact gets a Prismatic sleeve. Every other artifact is destroyed", color: "#c38bff" },
  { id: "pyre", name: "Pyre", desc: "Destroys 5 random cards in your hand, gain $20", color: "#E8743B" },
  { id: "effigy", name: "Effigy", desc: "Copies a random artifact you own. Every other artifact is destroyed", color: "#b0805a" },
  { id: "shroud", name: "Shroud", desc: "3 random cards in your hand each get a random sleeve and stamp", color: "#9fb3c6" },
  { id: "exorcism", name: "Exorcism", desc: "Strips every sleeve and stamp in your hand, gain $4 for each one", color: "#e6eef2" },
  { id: "revenant", name: "Revenant", desc: "The last artifact you sold comes back (needs room)", color: "#5fbf86" },
  { id: "hollowCrown", name: "Hollow Crown", desc: "+1 item slot for good. Every item you hold is destroyed", color: "#C9A227" },
  { id: "wispLantern", name: "Wisp Lantern", desc: "Levels up your most played hand twice. −1 discard for good", color: "#7fd0e0" },
  { id: "soulShard", name: "Soul Shard", desc: "Gives you a random legendary artifact (needs room)", color: "#F2A65A", rare: true },
  { id: "eventHorizon", name: "Event Horizon", desc: "Levels up every hand", color: "#24325c", rare: true },
].map((d) => ({ type: "item", spectral: true, price: 4, ...d }));

// Spectral choices: the two rare ones turn up much less often.
function pickSpectrals(n) {
  const out = [];
  const pool = [...SPECTRAL_DEFS];
  while (out.length < n && pool.length) {
    const weights = pool.map((d) => (d.rare ? 0.12 : 1));
    let r = Math.random() * weights.reduce((a, b) => a + b, 0);
    let i = 0;
    while (i < pool.length - 1 && r > weights[i]) r -= weights[i++];
    out.push({ ...pool[i] });
    pool.splice(i, 1);
  }
  return out;
}

// ----- cards a spectral works on -----
function allRunCards() {
  return [...state.deck, ...(state.usedCards || []), ...state.hand];
}
// The hand shown in a Spectral Pack, as card objects.
function packHandCards(po = state.packOpen) {
  if (!po || !po.hand) return [];
  const all = allRunCards();
  return po.hand.map((id) => all.find((c) => c.id === id)).filter(Boolean);
}
function packHandIds() {
  if (state.overlay === "playing") return state.hand.map((c) => c.id);
  return shuffleArray(allRunCards()).slice(0, BASE_HAND_SIZE).map((c) => c.id);
}
// Swap cards (by id) for new versions everywhere they live.
function mapRunCards(ids, fn) {
  const set = new Set(ids);
  const m = (arr) => arr.map((c) => (set.has(c.id) ? fn(c) : c));
  state.deck = m(state.deck);
  state.usedCards = m(state.usedCards || []);
  state.hand = m(state.hand);
}
function destroyRunCards(ids) {
  const set = new Set(ids);
  noteDestroyed(allRunCards().filter((c) => set.has(c.id)));
  state.deck = state.deck.filter((c) => !set.has(c.id));
  state.usedCards = (state.usedCards || []).filter((c) => !set.has(c.id));
  state.hand = state.hand.filter((c) => !set.has(c.id));
  state.selected = (state.selected || []).filter((id) => !set.has(id));
  if (state.packOpen && state.packOpen.hand) state.packOpen.hand = state.packOpen.hand.filter((id) => !set.has(id));
}
function addRunCards(cards) {
  state.deck = shuffleArray([...state.deck, ...cards]);
  noteAdded(cards.length);
}
function randomCharmDef(pool) {
  const owned = new Set(state.charms.map((c) => c.id));
  const free = pool.filter((d) => !owned.has(d.id));
  return free.length ? randomOf(free) : null;
}

// Runs a spectral card. Returns a short line saying what happened.
function useSpectral(def) {
  const hand = packHandCards();
  const ids = hand.map((c) => c.id);
  const pickIds = (n) => shuffleArray(ids).slice(0, n);
  const charmRoom = charmsUsed() < state.charmSlots;
  switch (def.id) {
    case "kinfolk":
      destroyRunCards(pickIds(1));
      addRunCards(Array.from({ length: 3 }, () => makeCard(randomOf(FACE_RANKS), randomOf(SUIT_KEYS), { stamp: randomOf(STAMP_KINDS) })));
      return "3 face cards joined your deck";
    case "bonePact":
      destroyRunCards(pickIds(1));
      addRunCards(Array.from({ length: 2 }, () => makeCard("A", randomOf(SUIT_KEYS), { sleeve: randomOf(SLEEVE_KINDS) })));
      return "2 Aces joined your deck";
    case "chorus":
      destroyRunCards(pickIds(1));
      addRunCards(Array.from({ length: 4 }, () => makeCard(randomOf(RANKS.slice(1, 10)), randomOf(SUIT_KEYS), { stamp: randomOf(STAMP_KINDS) })));
      return "4 number cards joined your deck";
    case "paupersPact": {
      const d = charmRoom && randomCharmDef(artifactPool());
      if (d) state.charms = [...state.charms, { ...d, uid: newUid() }];
      state.money = 0;
      return d ? `${d.name} is yours. Your purse is empty` : "No room for an artifact. Your purse is empty";
    }
    case "seance": {
      const r = randomOf(RANKS);
      mapRunCards(ids, (c) => ({ ...c, rank: r }));
      state.permHandSize = (state.permHandSize || 0) - 1;
      return `Every card became ${["A", "8"].includes(r) ? "an" : "a"} ${r}`;
    }
    case "phantomLimb": {
      const pool = state.charms.filter((c) => c.sleeve !== "negative");
      if (!pool.length) return "No artifact to touch";
      const t = randomOf(pool);
      state.charms = state.charms.map((c) => (c.uid === t.uid ? withCharmSleeve(c, "negative") : c));
      state.permHandSize = (state.permHandSize || 0) - 1;
      return `${t.name} turned Negative`;
    }
    case "halo": {
      const pool = state.charms.filter((c) => !c.sleeve);
      if (!pool.length) return "Every artifact is already sleeved";
      const t = randomOf(pool);
      const sl = randomOf(["sparkler", "gilded", "prismatic"]);
      state.charms = state.charms.map((c) => (c.uid === t.uid ? withCharmSleeve(c, sl) : c));
      return `${t.name} got a ${CHARM_SLEEVES[sl].name} sleeve`;
    }
    case "prismHex": {
      if (!state.charms.length) return "You had no artifacts";
      const t = randomOf(state.charms);
      state.charms = [withCharmSleeve(t, "prismatic")];
      return `${t.name} went Prismatic`;
    }
    case "pyre":
      destroyRunCards(pickIds(5));
      state.money += 20;
      return "Burned 5 cards for $20";
    case "effigy": {
      if (!state.charms.length) return "You had no artifacts to copy";
      const keep = randomOf(state.charms);
      state.charms = [keep, { ...keep, uid: newUid() }];
      return `Two of ${keep.name} remain`;
    }
    case "shroud":
      mapRunCards(pickIds(3), (c) => ({ ...c, sleeve: randomOf(SLEEVE_KINDS), stamp: randomOf(STAMP_KINDS) }));
      return "3 cards were shrouded";
    case "exorcism": {
      let n = 0;
      mapRunCards(ids, (c) => { n += (c.sleeve ? 1 : 0) + (c.stamp ? 1 : 0); return { ...c, sleeve: undefined, stamp: undefined }; });
      state.money += n * 4;
      return `Cast out ${n} for $${n * 4}`;
    }
    case "revenant": {
      const c = state.lastSoldCharm;
      if (!c || !charmRoom) return c ? "No room for it" : "You haven't sold an artifact yet";
      state.charms = [...state.charms, { ...c, uid: newUid() }];
      state.lastSoldCharm = null;
      return `${c.name} came back`;
    }
    case "hollowCrown":
      state.items = [];
      state.itemSlots += 1;
      return "+1 item slot";
    case "wispLantern": {
      const counts = state.handTypeCounts || {};
      const fav = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0] || "High Card";
      state.handLevels = { ...(state.handLevels || {}), [fav]: handLevel(fav) + 2 };
      state.permDiscards = (state.permDiscards || 0) - 1;
      return `${fav} went up 2 levels`;
    }
    case "soulShard": {
      const d = charmRoom && randomCharmDef(LEGENDARY_DEFS);
      if (d) state.charms = [...state.charms, { ...d, uid: newUid() }];
      return d ? `${d.name} is yours` : "No room for a legend";
    }
    case "eventHorizon": {
      const lv = { ...(state.handLevels || {}) };
      Object.keys(HAND_TABLE).forEach((h) => { lv[h] = handLevel(h) + 1; });
      state.handLevels = lv;
      return "Every hand went up a level";
    }
  }
  return "";
}


// Chance-based effects: Horseshoe doubles the odds, Lucky Break makes them certain.
function chanceMultiplier() {
  if (state.luckyRound) return 1000;
  return state.charms.some((c) => c.effect.type === "horseshoeDoubleChance") ? 2 : 1;
}
function hasCharm(type) {
  return state.charms.some((c) => c.effect.type === type);
}
function newUid() {
  return Math.random().toString(36).slice(2, 9);
}
const STAMP_KINDS = ["gold", "crimson", "azure"];
const SLEEVE_KINDS = ["sparkler", "tithe", "molt", "larva", "anchor", "mirror"];
function randomOf(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}
// Puts a sleeve on a card (returns the new card). Archivist adds a stamp too.
function withSleeve(card, sleeve) {
  const out = { ...card, sleeve };
  if (hasCharm("archivistStampOnSleeve") && !out.stamp) out.stamp = randomOf(STAMP_KINDS);
  return out;
}
function makeCard(rank, suit, extra) {
  return { rank, suit, id: `${rank}-${suit}-${Math.random().toString(36).slice(2, 8)}`, ...(extra || {}) };
}
// How many times a scoring card fires. Crimson doubles the card; each
// retrigger artifact that applies adds another full round of firing.
function scoringPings(card) {
  let rounds = 1;
  if (hasCharm("engineRetrigger")) rounds++;
  if (hasCharm("lowTideRetrigger") && ["2", "3", "4", "5"].includes(card.rank)) rounds++;
  if (hasCharm("maskFaceRetrigger") && isFace(card)) rounds++;
  return (card.stamp === "crimson" ? 2 : 1) * rounds;
}
// Cards added to the deck this run (Hall of Mirrors).
function noteAdded(n) {
  state.cardsAddedRun = (state.cardsAddedRun || 0) + n;
}
// Cards destroyed this run (Vulture) and face cards destroyed (Ossuary Saint).
function noteDestroyed(cards) {
  state.cardsDestroyedRun = (state.cardsDestroyedRun || 0) + cards.length;
  const faces = cards.filter((c) => c && isFace(c)).length;
  if (faces) {
    state.charms = state.charms.map((c) => (c.effect.type === "saintFaceDestroyedX" ? { ...c, saintX: (c.saintX || 1) + faces * c.effect.value } : c));
  }
}
// Price in the shop after Clearance Sale, or $0 while The Merchant's free buy is waiting.
function shopPriceFor(entry) {
  if (state.freeBuy) return 0;
  return Math.ceil(entry.price * shopDiscountFactor());
}

function generateShopStock(count) {
  // Check if Ringmaster is equipped (allows duplicates)
  const hasRingmaster = state.charms.some((c) => c.effect.type === "ringmasterDuplicates");

  // Don't offer charms/items the player currently has equipped or holding -
  // they reappear in the shop pool once sold (charms) or used (items).
  // UNLESS Ringmaster is equipped, which allows duplicates.
  const ownedCharmIds = hasRingmaster ? new Set() : new Set(state.charms.map((c) => c.id));
  const ownedItemIds = hasRingmaster ? new Set() : new Set(state.items.map((i) => i.id));
  const availableCharms = artifactPool().filter((c) => !ownedCharmIds.has(c.id));
  const availableItems = ITEM_DEFS.filter((i) => !ownedItemIds.has(i.id) && !i.secret);

  // Sleight of Hand: some slots hold playing cards instead.
  const cardSlots = voucherSum("shopPlayingCards") ? Array.from({ length: count }, () => Math.random() < 0.25).filter(Boolean).length : 0;
  const n = count - cardSlots;
  // Split between artifacts and items (Peddler / Bazaar tip it toward items)
  const w = voucherBest("itemRate", Math.max);
  const itemCount = Math.min(availableItems.length, Math.round((n * w) / (1 + w)));
  const charmCount = Math.min(availableCharms.length, n - itemCount);

  // weighted shuffle: Star Vendor / Planetarium make charts likelier
  const chartW = voucherBest("chartRate", Math.max);
  const weighted = (arr, wf) => arr.map((d) => [Math.pow(Math.random(), 1 / wf(d)), d]).sort((x, y) => y[0] - x[0]).map((x) => x[1]);
  const charmPool = weighted(availableCharms, () => 1);
  const itemPool = weighted(availableItems, (d) => (d.chart ? chartW : 1));

  let selected = [
    ...charmPool.slice(0, charmCount).map(rollCharmSleeve),
    ...itemPool.slice(0, itemCount)
  ];

  // If one side came up short (e.g. most charms are already owned), backfill
  // the remaining slots from whichever pool still has stock left over.
  const remaining = n - selected.length;
  if (remaining > 0) {
    const leftover = [...charmPool.slice(charmCount), ...itemPool.slice(itemCount)]
      .sort(() => Math.random() - 0.5);
    selected = [...selected, ...leftover.slice(0, remaining).map((d) => (d.type === "charm" ? rollCharmSleeve(d) : d))];
  }
  for (let i = 0; i < cardSlots; i++) selected.push(shopPlayingCard());

  // Shuffle the combined pool
  for (let i = selected.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [selected[i], selected[j]] = [selected[j], selected[i]];
  }
  return selected;
}

// A playing card for sale (Sleight of Hand). Grand Illusion: often sleeved
// and/or stamped, and now and then Negative.
function shopPlayingCard() {
  const fancy = voucherSum("shopPlayingCards") >= 2;
  const extra = {};
  if (fancy && Math.random() < 0.5) extra.sleeve = Math.random() < 0.06 ? "negative" : randomOf(SLEEVE_KINDS);
  if (fancy && Math.random() < 0.4) extra.stamp = randomOf(STAMP_KINDS);
  const card = makeCard(randomOf(RANKS), randomOf(SUIT_KEYS), extra);
  const suit = card.suit[0].toUpperCase() + card.suit.slice(1);
  const lines = [];
  if (card.sleeve) lines.push(`${AnteArt.sleeveLabel(card.sleeve)} sleeve: ${SLEEVE_INFO[card.sleeve]}`);
  if (card.stamp) lines.push(`${STAMP_LABELS[card.stamp]} stamp: ${STAMP_INFO[card.stamp]}`);
  return { type: "playing", id: card.id, card, name: `${card.rank} of ${suit}`, desc: `Goes into your deck.${lines.length ? "<br>" + lines.join("<br>") : ""}`, price: 3 + (card.sleeve ? 2 : 0) + (card.stamp ? 1 : 0), color: "#D9CFB5" };
}

function applyItemEffects(result, cards, items) {
  let { totalChips, totalMult } = result;
  const handName = result.name;
  items.forEach((item) => {
    const eff = item.effect;
    switch (eff.type) {
      case "flatChips":
        totalChips += eff.value;
        break;
      case "flatMult":
        totalMult += eff.value;
        break;
      case "pairOrBetter":
        if (!["High Card"].includes(handName)) {
          totalChips += eff.chips;
          totalMult += eff.mult;
        }
        break;
      case "flushMultMult":
        if (["Flush", "Straight Flush", "Flush House", "Flush Five", "Royal Flush"].includes(handName)) totalMult *= eff.value;
        break;
      case "perFaceChips": {
        const count = cards.filter((c) => ["J", "Q", "K", "A"].includes(c.rank)).length;
        totalChips += count * eff.value;
        break;
      }
      case "highCardMult":
        if (handName === "High Card") totalMult += eff.value;
        break;
      case "perSuitChips": {
        const count = cards.filter((c) => c.suit === eff.suit).length;
        totalChips += count * eff.value;
        break;
      }
      case "tripsMult":
        if (["Three of a Kind", "Four of a Kind", "Full House", "Flush House", "Five of a Kind", "Flush Five"].includes(handName)) totalMult += eff.value;
        break;
      default:
        break;
    }
  });
  const score = Math.round(totalChips * totalMult);
  return { ...result, totalChips: Math.round(totalChips), totalMult: Math.round(totalMult * 100) / 100, score };
}

// Applies active Boss Blind scoring penalties (currently just The Fang) on
// top of a charm-adjusted result. Kept mult from going negative.
function applyBossBlindScoringEffects(result, cards) {
  const boss = state.bossBlind;
  if (!boss || !boss.multPenaltyPerCard) return result;
  const penalty = cards.length * boss.multPenaltyPerCard;
  const totalMult = Math.max(1, result.totalMult - penalty);
  const score = Math.round(result.totalChips * totalMult);
  return { ...result, totalMult, score };
}

function applyCharmEffects(result, cards, charms) {
  let { totalChips, totalMult } = result;
  const handName = result.name;
  charms.forEach((charm) => {
    const eff = charm.effect;
    switch (eff.type) {
      case "worldSuitMult": {
        const uniqueSuits = new Set(cards.map((c) => c.suit)).size;
        totalMult += uniqueSuits * eff.multPerSuit;
        break;
      }
      case "prismChipsPerCard":
        totalChips += cards.length * eff.value;
        break;
      case "scaleMultPerDiscard":
        totalMult += state.discardsLeft * eff.value;
        break;
      case "firstHandX":
        if ((state.handsThisRound || 0) === 0) totalMult *= eff.value;
        break;
      case "pppEncore":   // Press Play exclusive
        totalMult = (totalMult + eff.add) * eff.x;
        break;
      case "miserMultPerTenDollars":
        totalMult += Math.floor(state.money / 10) * eff.value;
        break;
      case "ratchetBossMult":
        totalMult += charm.ratchetBonus || 0;
        break;
      case "almanacMultPerAnte":
        totalMult += Math.max(0, state.ante - 1) * eff.value;
        break;
      case "crownFaceCardMult": {
        const faceCardCount = cards.filter((c) => isFace(c)).length;
        totalMult += faceCardCount * eff.value;
        break;
      }
      case "bellMoneyPerChips": {
        // Store the chips before scoring for later use in finishPlay
        result.bellChips = totalChips;
        break;
      }
      case "grimoireMultPerCharm": {
        const charmCount = charms.length;
        totalMult += charmCount * eff.value;
        break;
      }
      case "thornsMultPerCard": {
        totalMult += state.hand.length * eff.value;
        break;
      }
      case "coinFlip": {
        if (state.coinMultBonus) {
          totalMult += eff.multValue;
        }
        break;
      }
      case "streakMult": {
        totalMult += state.streakCounter * eff.value;
        break;
      }
      case "dukeKingMult": {
        const kingCount = state.hand.filter((c) => c.rank === "K").length;
        let multFactor = 1;
        for (let i = 0; i < kingCount; i++) {
          multFactor *= eff.value;
        }
        totalMult *= multFactor;
        break;
      }
      case "monumentHandTypeMult": {
        totalMult *= Math.pow(1.2, state.consecutiveHandsWithoutMostPlayed * eff.value);
        break;
      }
      case "batteryFlatChips":
        totalChips += eff.value;
        break;
      case "torchFlatMult":
        totalMult += eff.value;
        break;
      case "amplifierMultX":
        totalMult *= eff.value;
        break;
      case "locksmithNoFaceMult": {
        const hasFaceCard = cards.some((c) => isFace(c));
        if (!hasFaceCard) totalMult += eff.value;
        break;
      }
      case "conductorUniqueRankMult": {
        const uniqueRanks = new Set(cards.map((c) => c.rank)).size;
        totalMult += uniqueRanks * eff.value;
        break;
      }
      case "alchemistDoubleMultNoDiscards": {
        if (state.discardsLeft === 0) totalMult *= eff.multiplier;
        break;
      }
      case "tinkererChipsPerDeckCard":
        totalChips += state.deck.length * eff.value;
        break;
      case "furnaceChipsPerDiscard":
        totalChips += (state.totalDiscardedRun || 0) * eff.value;
        break;
      case "oracleCompoundMult":
        totalMult *= charm.oracleMultBonus || 1;
        break;
      case "zenithLastPlayMult":
        if (state.isLastPlayThisRound) totalMult *= eff.value;
        break;
      case "cascadeMultPerExtraCard": {
        const extraCards = Math.max(0, cards.length - eff.threshold);
        totalMult *= Math.pow(eff.value, extraCards);
        break;
      }
      case "abacusCardChipsBoost":
        totalChips += cards.filter((c) => !isCardDebuffed(c)).reduce((sum, c) => sum + rankChipValue(c.rank), 0) * eff.value;
        break;
      case "blueprintSleeveChips":
        totalChips += cards.filter((c) => c.sleeve).length * eff.value;
        break;
      case "midasGoldStampChips":
        totalChips += cards.filter((c) => c.stamp === "gold").length * eff.value;
        break;
      case "redThreadCrimsonMult":
        totalMult += cards.filter((c) => c.stamp === "crimson").length * eff.value;
        break;
      case "spiralRanksMult":
        totalMult += cards.filter((c) => !isCardDebuffed(c) && ["A", "2", "3", "5", "8"].includes(c.rank)).reduce((n, c) => n + scoringPings(c), 0) * eff.value;
        break;
      case "evenRanksMult":
        totalMult += cards.filter((c) => !isCardDebuffed(c) && ["2", "4", "6", "8", "10"].includes(c.rank)).reduce((n, c) => n + scoringPings(c), 0) * eff.value;
        break;
      case "oddRanksChips":
        totalChips += cards.filter((c) => !isCardDebuffed(c) && ["A", "3", "5", "7", "9"].includes(c.rank)).reduce((n, c) => n + scoringPings(c), 0) * eff.value;
        break;
      case "portraitFirstFaceX": {
        const face = cards.find((c) => !isCardDebuffed(c) && isFace(c));
        if (face) totalMult *= Math.pow(eff.value, scoringPings(face));
        break;
      }
      case "tidepoolFlushX":
        if (handName.includes("Flush")) totalMult *= eff.value;
        break;
      case "heartstoneChance":
        // Rolled once when the hand is played (state.heartstoneHits); the
        // preview leaves it out rather than guess.
        if (state.heartstoneHits) totalMult *= Math.pow(eff.value, state.heartstoneHits);
        break;
      case "mirrorsAddedX":
        totalMult *= 1 + (state.cardsAddedRun || 0) * eff.value;
        break;
      case "gildedHeldX":
        totalMult *= Math.pow(eff.value, state.hand.filter((c) => c.stamp === "gold" && !state.selected.includes(c.id)).length);
        break;
      case "saintFaceDestroyedX":
        totalMult *= charm.saintX || 1;
        break;
      case "thronesKingQueenX":
        totalMult *= Math.pow(eff.value, cards.filter((c) => !isCardDebuffed(c) && (c.rank === "K" || c.rank === "Q")).reduce((n, c) => n + scoringPings(c), 0));
        break;
      case "lanternDiscardX":
        totalMult *= 1 + Math.floor((charm.lanternDiscards || 0) / eff.per) * eff.value;
        break;
      case "hydraSleeveX":
        totalMult *= Math.pow(eff.value, cards.filter((c) => c.sleeve).length);
        break;
      case "midnightSunX":
        totalMult *= 1 + Object.keys(state.handTypeCounts || {}).length * eff.value;
        break;
      case "grandLedgerX":
        totalMult *= 1 + Math.floor(Math.max(0, state.money) / 5) * eff.value;
        break;
      case "chainsNoDiscardX":
        totalMult *= eff.value;
        break;
      case "curatorStampedCardChips":
        totalChips += cards.filter((c) => c.stamp).length * eff.value;
        break;
      case "reliquaryUniqueSleeveMult": {
        const uniqueSleeves = new Set(cards.filter((c) => c.sleeve).map((c) => c.sleeve)).size;
        totalMult += uniqueSleeves * eff.value;
        break;
      }
      case "pocketwatchChipsPerHand":
        totalChips += (state.handsPlayedRun || 0) * eff.value;
        break;
      case "vultureMultPerDestroyed":
        totalMult += (state.cardsDestroyedRun || 0) * eff.value;
        break;
      case "parchmentChipsPerUsedCard":
        totalChips += state.usedCards.length * eff.value;
        break;
      case "keepsakeMultPerItem":
        totalMult += state.items.length * eff.value;
        break;
      case "workshopModifiedCardMult":
        if (cards.some((c) => c.sleeve || c.stamp)) totalMult += eff.value;
        break;
      case "paladinBossMult":
        if (state.bossBlind) totalMult += eff.value;
        break;
      case "smugglerLowMoneyMult":
        if (state.money <= eff.threshold) totalMult += eff.value;
        break;
      case "solitaireHighCardX":
        if (handName === "High Card") totalMult *= eff.value;
        break;
      case "duetPairX":
        if (handName === "Pair") totalMult *= eff.value;
        break;
      case "triptychTripsMult":
        if (["Three of a Kind", "Four of a Kind", "Full House", "Flush House", "Five of a Kind", "Flush Five"].includes(handName)) totalMult += eff.value;
        break;
      case "checkmateStraightX":
        if (handName.includes("Straight")) totalMult *= eff.value;
        break;
      case "rainbowAllSuitsX":
        if (new Set(cards.map((c) => c.suit)).size >= 4) totalMult *= eff.value;
        break;
      case "crescendoMultPerRoundHand":
        totalMult += (state.handTypesPlayedThisRound || []).length * eff.value;
        break;
      case "keymasterLuckCharmMult": {
        const luckTypes = new Set(["calculatorReplay", "cameraPreserve", "horseshoeDoubleChance", "rouletteRandomBonus", "coinFlip", "heartstoneChance"]);
        totalMult += charms.filter((c) => luckTypes.has(c.effect.type)).length * eff.value;
        break;
      }
      default:
        break;
    }
  });
  
  
  const score = Math.round(totalChips * totalMult);
  return { ...result, totalChips: Math.round(totalChips), totalMult: Math.round(totalMult * 100) / 100, score };
}

// Double Down Token: adds the hand type's base Chips/Mult a second time.
function withNextHandBase(result) {
  if (!state.nextHandDoubleBase || !result || !HAND_TABLE[result.name]) return result;
  const base = handBase(result.name);
  return { ...result, totalChips: result.totalChips + base.chips, totalMult: result.totalMult + base.mult };
}

function getExtraPlays(items) {
  const extra = [...items, ...state.charms].filter((i) => i.effect.type === "extraPlays").reduce((s, i) => s + i.effect.value, 0);
  const voucherExtra = state.vouchers.filter((v) => v.effect.type === "extraPlays").reduce((s, v) => s + v.effect.value, 0);
  const gamblerReduction = state.charms.filter((c) => c.effect.type === "gamblerMult").reduce((s, c) => s + c.effect.playReduction, 0);
  // Vouchers can take hands away too (Time Warp), but never below 1 hand.
  return Math.max(-3, Math.max(0, extra - gamblerReduction) + voucherExtra);
}
function getExtraDiscards(items) {
  const extra = [...items, ...state.charms].filter((i) => i.effect.type === "extraDiscards").reduce((s, i) => s + i.effect.value, 0);
  const voucherExtra = state.vouchers.filter((v) => v.effect.type === "extraDiscards").reduce((s, v) => s + v.effect.value, 0);
  return Math.max(-4, extra + voucherExtra + (state.permDiscards || 0));
}
function getExtraHandSize(items) {
  return [...items, ...state.charms].filter((i) => i.effect.type === "extraHandSize").reduce((s, i) => s + i.effect.value, 0);
}
function getMoneyOnDiscard(items) {
  return [...items, ...state.charms].filter((i) => i.effect.type === "moneyOnDiscard").reduce((s, i) => s + i.effect.value, 0);
}
function getTollboothBonus(charms) {
  return charms.filter((c) => c.effect.type === "tollboothMoneyPerHand").reduce((s, c) => s + c.effect.value, 0);
}
function getInterestBonus(items, money) {
  // Baseline economy mechanic: everyone earns $1 per $5 banked, capped at $5
  // (i.e. it stops helping past $25) so money can't snowball out of control.
  // Vault charms raise that cap.
  const vaultBonus = state.charms.filter((c) => c.effect.type === "vaultInterestCap").reduce((s, c) => s + c.effect.value, 0);
  const interestVoucherBonus = state.vouchers.filter((v) => v.effect.type === "interestBonus").reduce((s, v) => s + v.effect.value, 0);
  return Math.min(5 + vaultBonus + voucherSum("interestCap"), Math.floor(money / 5)) + interestVoucherBonus;
}
function getLeftoverHandsBonus(playsLeft, discardsLeft) {
  // Guaranteed baseline income: $1 per unused play and $1 per unused discard
  // when a round is cleared, so efficient play pays off without needing luck.
  return Math.max(0, playsLeft) + Math.max(0, discardsLeft);
}

/* ============================== SAVE SYSTEM ==============================
   Every consequential action (play, discard, shop purchase, item use, etc.)
   saves to localStorage the moment its outcome is fully resolved in memory —
   BEFORE that outcome is revealed to the player via animation/render. This
   means there is never a window where a bad (or good) result is visible on
   screen but not yet persisted: by the time anything shows up, it's already
   locked into the save. Refreshing or closing the tab at any point simply
   resumes exactly where the last resolved action left off; it can never be
   used to "undo" an action and reroll it. On a run loss, the save is deleted
   outright instead, so a dead run can never be resumed. */
const SAVE_KEY = "anteup_save_v1";

function saveGame() {
  try {
    // Transient, purely-visual fields are reset to their idle defaults in the
    // saved snapshot (but NOT in live memory) so that resuming a save never
    // drops the player into the middle of an animation that will never finish.
    const snapshot = {
      ...state,
      popup: null,
      popupStartedAt: null,
      scoringIds: [],
      dealAnim: false,
      activeCharm: null,
      activeCharmStartedAt: null,
      activeCharmClosing: false,
      deckOverlayOpen: false,
      menuOpen: false,
      confirmingReset: false,
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(snapshot));
  } catch (e) {
    console.warn("Save failed:", e);
  }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const saved = JSON.parse(raw);
    Object.assign(state, saved);
    // Saves from before the rework hold old effect definitions: refresh every
    // owned/stocked artifact and item from the current lists by id, keeping
    // per-instance progress (uid, Ratchet/Oracle bonuses, sell bonus, saves).
    const refresh = (d, pools) => {
      if (!d) return d;
      for (const pool of pools) {
        const def = pool.find((x) => x.id === d.id);
        if (def) return { ...d, name: def.name, desc: def.desc, price: def.price + (d.sleevePrice || 0), color: def.color, effect: { ...def.effect, ...(d.effect && d.effect.blindCounter != null ? { blindCounter: d.effect.blindCounter } : {}) }, rarity: def.rarity };
      }
      return d;
    };
    state.charms = (state.charms || []).map((c) => refresh(c, [CHARM_DEFS, LEGENDARY_DEFS]));
    state.items = (state.items || []).map((i) => refresh(i, [ITEM_DEFS]));
    state.shopStock = (state.shopStock || []).map((x) => (x && x.type === "charm" ? refresh(x, [CHARM_DEFS, LEGENDARY_DEFS]) : refresh(x, [ITEM_DEFS])));
    const vref = (v) => (v && VOUCHER_BY_ID[v.id] ? { ...VOUCHER_BY_ID[v.id] } : v);
    state.vouchers = (state.vouchers || []).map(vref).filter(Boolean);
    state.voucherStock = (state.voucherStock || []).map(vref);
    // Saves from when the shop offered four vouchers at once: keep one.
    if (!state.voucherReady) { state.voucherStock = state.voucherStock.filter(Boolean).slice(0, 1); state.voucherReady = true; }
    return true;
  } catch (e) {
    console.warn("Load failed:", e);
    return false;
  }
}

function clearSave() {
  try {
    localStorage.removeItem(SAVE_KEY);
  } catch (e) {}
}

const CARD_W = 62;

// The Fool grants +1 consumable slot per copy equipped. Computed live off state.charms
// so that selling/removing the charm immediately shrinks capacity back down.
function getEffectiveItemSlots() {
  const foolBonus = state.charms.reduce(
    (sum, c) => sum + (c.effect?.type === "foolExtraSlot" ? (c.effect.value || 1) : 0),
    0
  );
  const voucherBonus = state.vouchers.reduce(
    (sum, v) => sum + (v.effect?.type === "extraItemSlot" ? (v.effect.value || 1) : 0),
    0
  );
  return state.itemSlots + foolBonus + voucherBonus;
}
const BASE_HAND_SIZE = 8;
const MAX_FAN_WIDTH = 640;
const MIN_OVERLAP = -14;
const MAX_OVERLAP = 44;

function getHandSize() {
  const extra = getExtraHandSize(state.items);
  const voucherExtra = state.vouchers.filter((v) => v.effect.type === "extraHandSize").reduce((s, v) => s + v.effect.value, 0);
  const chainsReduction = state.charms.filter((c) => c.effect.type === "chainsMoneyPerHand").reduce((s, c) => s + c.effect.handSizeReduction, 0);
  const bossDelta = (state.bossBlind && state.bossBlind.handSizeDelta) || 0;
  const negInHand = (state.hand || []).filter((c) => c.sleeve === "negative").length;
  return Math.max(1, BASE_HAND_SIZE + extra + voucherExtra - chainsReduction + bossDelta + (state.roundHandSizeBonus || 0) + (state.permHandSize || 0)) + negInHand;
}

function computeFanLayout() {
  const viewportW = window.innerWidth;
  // In landscape the deck/sort column and the button column flank the hand.
  const sidePadding = isLandscape() ? 16 + 2 * 170 : 16;
  const available = viewportW - sidePadding;
  const handSize = getHandSize();
  const target = Math.min(available, MAX_FAN_WIDTH);
  const rawOverlap = CARD_W - (target - CARD_W) / (handSize - 1);
  const overlap = Math.max(MIN_OVERLAP, Math.min(MAX_OVERLAP, rawOverlap));
  const widthAtOverlap = CARD_W + (handSize - 1) * (CARD_W - overlap);
  const scale = Math.max(0.62, Math.min(1, available / widthAtOverlap));
  return { overlap, scale };
}

const ANCHOR_CAP = 3;

  const anchors = shuffleArray(freshDeckArg.filter((c) => c.sleeve === "anchor")).slice(0, ANCHOR_CAP);

  const h = drawInto([], d);
  tagBossDebuffedCards(h);
  state.deck = d;
  state.hand = h;
  state.selected = [];
  state.usedCards = [];
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startNextBlind(nextAnte, nextBlindIdx) {
  // The round that just ended: state.hand is what was held at the end of it.
  // (Larva/Azure used to rely on a list taken at round start, before the new
  // hand was dealt, so a card sleeved or stamped mid-round never copied.)

  // ===== LARVA SLEEVE: every Larva card still held copies itself into the deck =====
  state.hand.filter((c) => c.sleeve === "larva").forEach((card) => {
    const clone = { ...card, id: card.id + "_larva_" + Date.now() + "_" + Math.random().toString(36).slice(2), sleeve: undefined };
    state.deck.push(clone);
    noteAdded(1);
  });
  state.larvaTracking = {};

  // ===== AZURE STAMP: every Azure-stamped card still held copies itself into the deck =====
  // Copies keep the card's stamp and sleeve.
  state.hand.filter((c) => c.stamp === "azure").forEach((card) => {
    const clone = { ...card, id: card.id + "_azure_" + Date.now() + "_" + Math.random().toString(36).slice(2) };
    state.deck.push(clone);
    noteAdded(1);
  });
  state.azureTracking = {};

  // ===== MOLT SLEEVE: hop to another card and leave a +1 Mult mark behind =====
  // Looks in hand, deck AND the cards played/discarded this round (a played
  // Molt card sits in usedCards, which is why it used to vanish), and finds
  // Molt cards by their sleeve, so copies made by The Death etc. hop too.
  {
    const allCards = [...state.hand, ...state.deck, ...state.usedCards];
    const moltCards = allCards.filter((c) => c.sleeve === "molt");
    const nextTargets = {};
    moltCards.forEach((moltCard) => {
      moltCard.moltBuff = (moltCard.moltBuff || 0) + 1;
      moltCard.sleeve = undefined;
      // Prefer a card with no sleeve so Molt doesn't overwrite another sleeve.
      const others = allCards.filter((c) => !moltCards.includes(c) && c.sleeve !== "molt");
      const bare = others.filter((c) => !c.sleeve);
      const candidates = bare.length ? bare : others;
      const target = candidates.length ? candidates[Math.floor(Math.random() * candidates.length)] : moltCard;
      target.sleeve = "molt";
      nextTargets[target.id] = true;
    });
    state.moltTargets = nextTargets;
  }
  
  state.ante = nextAnte;
  state.blindIdx = nextBlindIdx;
  state.roundScore = 0;
  state.bossBlind = nextBlindIdx === 2 ? (nextAnte === FINAL_ANTE ? pickFinalBoss() : pickBossBlind()) : null;
  if (state.bossBlind && hasCharm("crownDisableBoss")) {
    const b = state.bossBlind;
    state.bossBlind = { id: b.id, name: b.name, isFinal: b.isFinal, disabled: true, desc: "Disabled by the Iron Crown" };
  }
  state.handTypesPlayedThisRound = [];
  state.firstHandTypeThisRound = null;
  state.bossBlindMessage = null;
  state.playsLeft = 4 + getExtraPlays(state.items);
  state.discardsLeft = 4 + getExtraDiscards(state.items);
  if (state.bossBlind) {
    if (state.bossBlind.forcedPlays != null) state.playsLeft = state.bossBlind.forcedPlays;
    if (state.bossBlind.forcedDiscards != null) state.discardsLeft = state.bossBlind.forcedDiscards;
  }
  // Cat Burglar: +3 hands, no discards. Jackknife starts each round at X1.
  state.charms.forEach((c) => {
    if (c.effect.type === "burglarHands") { state.playsLeft += c.effect.value; state.discardsLeft = 0; }
    if (c.effect.type === "jackknifeX") c.jackBonus = 0;
  });
  state.streakCounter = 0; // Reset Streak for new round
  state.handsThisRound = 0;
  state.luckyRound = false;
  state.roundHandSizeBonus = 0;
  state.collectorUsedThisRound = false;
  
  // Apply starting money bonus from Liquid Assets voucher
  state.money += voucherSum("startingMoneyBonus");
  
  // Increment Specter blind counter
  state.charms.forEach((charm) => {
    if (charm.effect.type === "specterDuplicate") {
      charm.effect.blindCounter = (charm.effect.blindCounter || 0) + 1;
    }
  });
  
  // The deck persists across blinds and rounds: the remaining deck, every
  // played/discarded card from the blind that just ended, AND any cards
  // still sitting in hand (held-but-unplayed cards, since dealInitialHand
  // below deals a brand new hand from scratch) are all gathered back up and
  // reshuffled into a new deck, rather than generating a brand new 52-card
  // deck. Sleeves, molt buffs, and any charm-added duplicate cards all carry
  // over with it.
  const returningCards = [...state.deck, ...state.usedCards, ...state.hand];
  state.deck = shuffleArray(returningCards);
  
  dealInitialHand(state.deck);
  state.overlay = "playing";
  state.dealAnim = true;
  saveGame();
  render();
}

function toggleSelect(id) {
  if (state.overlay !== "playing") return;
  const sel = state.selected;
  if (sel.includes(id)) {
    state.selected = sel.filter((s) => s !== id);
  } else if (sel.length < 5) {
    state.selected = [...sel, id];
  }
  render();
}

function refillHand(currentDeck, currentHand, removeIds) {
  let d = [...currentDeck];
  const remaining = currentHand.filter((c) => !removeIds.includes(c.id));
  const need = getHandSize() - remaining.length;
  if (d.length < need) {
    // Reshuffle every card already played/discarded this blind back into the
    // deck, rather than conjuring a brand new 52-card deck, so the deck's
    // actual contents (and any sleeves/duplicates on those cards) persist.
    const playedOrDiscarded = state.usedCards.filter((c) => !currentHand.some((h) => h.id === c.id));
    d = shuffleArray([...d, ...playedOrDiscarded]);
    state.usedCards = state.usedCards.filter((c) => !playedOrDiscarded.some((p) => p.id === c.id));
  }
  
  const drawn = drawInto(remaining, d);
  tagBossDebuffedCards(drawn);

  return { newDeck: d, newHand: [...remaining, ...drawn] };
}

function activateCharmSlide(charm, callback) {

    ghost.style.left = r.left + "px";
    ghost.style.top = r.top + "px";
    ghost.style.width = r.width + "px";
    ghost.style.height = r.height + "px";
    document.body.appendChild(ghost);
    setTimeout(() => ghost.remove(), 900);
  }
  
  setTimeout(() => {

    if (callback) {
      callback();

    setTimeout(() => {
