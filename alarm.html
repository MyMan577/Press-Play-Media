<!DOCTYPE html>
<html lang="en">
<head>
<!-- The page an alarm opens on Android (AlarmActivity.kt), instead of the whole app: the ringing screen's background,
     Snooze and Stop, and the widgets put on the ringing screen, nothing else. The music is already playing when this
     loads (the phone's own player started it); the widgets work it through the stand-ins in src/alarm/alarm-shim.js.
     Built into www/alarm.html by tools/assemble.py. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Alarm</title>
<meta name="theme-color" content="#0c0d10">
<script>window.__ppAlarmPage = {};</script>
<style>
  :root{
    --bg: #0c0d10;
    --bg-elev: #16171b;
    --line: #232429;
    --text: #e8e8ea;
    --text-dim: #8b8c93;
    --accent: #6ee7d0;
    --accent-dim: #3a5f57;
    --danger: #e0667a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    overflow:hidden;
  }
  #app{
    display:grid;
    grid-template-columns: 320px 1fr;
    height:100vh;
  }

  /* ---------- Sidebar / Playlist ---------- */
  #sidebar{
    background:var(--bg-elev);
    border-right:1px solid var(--line);
    display:flex; flex-direction:column;
    min-width:0;
    position:relative;
  }
  #sidebar-resize-handle{
    position:absolute;
    top:0; right:-10px; bottom:0;
    width:20px;
    cursor:col-resize;
    z-index:20;
    touch-action:none;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #sidebar-resize-handle::before{
    content:'';
    width:4px;
    height:100%;
    background:transparent;
    transition:background .15s;
  }
  #sidebar-resize-handle:hover::before, #sidebar-resize-handle.active::before{
    background:var(--accent-dim);
  }
  #sidebar-resize-handle::after{
    content:'';
    position:absolute;
    width:5px;
    height:44px;
    border-radius:calc(3px*var(--ui-round,1));
    background:var(--line);
    transition:background .15s, height .15s;
  }
  #sidebar-resize-handle:hover::after, #sidebar-resize-handle.active::after{
    background:var(--accent);
    height:64px;
  }
  #sidebar-header{
    padding:20px 20px 14px 20px;
    border-bottom:1px solid var(--line);
  }
  #sidebar-header h1{
    font-size:15px; font-weight:600; margin:0 0 2px 0;
    letter-spacing:0.2px;
  }
  .title-mode{ color:var(--accent); }
  .title-mode[data-ed="lite"]{ color:#a78bfa; }
  .title-mode[data-ed="plus"]{ color:#22d3ee; }
  .title-mode[data-ed="focus"]{ color:#34d399; }
  .title-mode[data-ed="playground"]{
    background:linear-gradient(90deg,#6ee7d0,#8b5cff,#ff5fd8,#ffb36e,#6ee7d0); background-size:200% 100%;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
    animation:ppgTitleFlow 6s linear infinite;
  }
  @keyframes ppgTitleFlow{ to{ background-position:200% 0; } }
  .title-mode[data-ed="premium"]{
    background:linear-gradient(90deg,#ff3b3b,#ff9f1c,#ffe14d,#3ddc84,#22d3ee,#4f7cff,#b05cff);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
  }
  #sidebar-header p{
    margin:0; font-size:12px; color:var(--text-dim);
  }

  /* ---------- Sidebar tabs ---------- */
  #sidebar-tabs{
    display:flex;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .sidebar-tab{
    flex:1;
    padding:11px 8px;
    background:none;
    border:none;
    border-bottom:2px solid transparent;
    color:var(--text-dim);
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    transition:color .15s, border-color .15s;
  }
  .sidebar-tab:hover{ color:var(--text); }
  .sidebar-tab.active{ color:var(--accent); border-bottom-color:var(--accent); }
  .sidebar-tab[data-sidebar-tab="settings"]{
    flex:none;
    width:40px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .sidebar-tab[data-sidebar-tab="settings"] svg{
    width:17px; height:17px;
    stroke:currentColor;
    transition:transform .3s ease;
  }
  .sidebar-tab[data-sidebar-tab="settings"]:hover svg{ transform:rotate(35deg); }

  .sidebar-pane{
    display:none;
    flex-direction:column;
    flex:1;
    min-height:0;
    overflow-y:auto;
  }
  .sidebar-pane.active{ display:flex; }
  #sidebar-pane-playlist::-webkit-scrollbar{ width:8px; }
  #sidebar-pane-playlist::-webkit-scrollbar-thumb{ background:var(--line); border-radius:calc(4px*var(--ui-round,1)); }
  /* Toolbar rows scroll away with the track list rather than staying pinned,
     so the list can claim the full sidebar height when scrolled. */
  #action-row, #search-row, #playlist-view-row{ flex-shrink:0; }

  /* ---------- Settings tab ---------- */
  .settings-section{
    padding:16px 20px;
    border-bottom:1px solid var(--line);
  }
  .settings-section-label{
    font-size:11px; text-transform:uppercase; letter-spacing:0.4px;
    color:var(--text-dim); margin:0 0 10px 0;
  }
  .settings-row{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
  }
  .settings-row-text{ min-width:0; }
  .settings-row-title{ font-size:13px; font-weight:600; color:var(--text); }
  .settings-row-sub{ font-size:11px; color:var(--text-dim); margin-top:3px; line-height:1.45; }
  .settings-toggle-btn{
    flex-shrink:0;
    padding:7px 13px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-dim);
    border-radius:calc(7px*var(--ui-round,1));
    font-size:11px;
    cursor:pointer;
    transition:border-color .15s, background .15s, color .15s;
  }
  .settings-toggle-btn:hover{ border-color:var(--accent-dim); background:var(--accent-soft,#1a2422); color:var(--text); }

  .settings-switch{ position:relative; display:inline-block; width:38px; height:22px; flex-shrink:0; }
  .settings-switch input{ opacity:0; width:0; height:0; position:absolute; }
  .settings-switch-track{
    position:absolute; inset:0; background:var(--line); border-radius:calc(999px*var(--ui-round,1));
    transition:background .15s; cursor:pointer;
  }
  .settings-switch-thumb{
    position:absolute; top:2px; left:2px; width:18px; height:18px;
    border-radius:50%; background:var(--text-dim);
    transition:transform .15s, background .15s;
  }
  .settings-switch input:checked + .settings-switch-track{ background:var(--accent-dim); }
  .settings-switch input:checked + .settings-switch-track .settings-switch-thumb{
    transform:translateX(16px); background:var(--accent);
  }

  #storage-usage-bar{
    width:100%; height:6px; border-radius:calc(999px*var(--ui-round,1));
    background:var(--line); overflow:hidden; margin:8px 0 4px;
  }
  #storage-usage-fill{ height:100%; width:0%; background:var(--accent); transition:width .3s, background .3s; }
  #storage-usage-fill.storage-warn{ background:#e0b95f; }
  #storage-usage-fill.storage-danger{ background:var(--danger); }
  #storage-usage-text{ font-size:11px; color:var(--text-dim); }
  #storage-backup-row{ display:flex; gap:8px; margin-top:10px; }
  #storage-backup-row button{
    flex:1; padding:7px 10px; background:transparent; border:1px solid var(--line);
    color:var(--text); border-radius:calc(7px*var(--ui-round,1)); font-size:11.5px; cursor:pointer;
  }
  #storage-backup-row button:hover{ border-color:var(--accent-dim); background:var(--accent-soft,#1a2422); }
  #backup-speed-row{ margin-top:12px; }
  #backup-speed-head{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--text); margin-bottom:4px; }
  #backup-speed-value{ color:var(--text-dim); }
  #backup-speed-slider{ width:100%; }
  #backup-speed-hint{ font-size:10.5px; color:var(--text-dim); margin-top:2px; }
  #library-import-input{ display:none; }
  #progress-backup-row{ display:flex; gap:8px; }
  #progress-backup-row button{
    flex:1; padding:7px 10px; background:transparent; border:1px solid var(--line);
    color:var(--text); border-radius:calc(7px*var(--ui-round,1)); font-size:11.5px; cursor:pointer;
  }
  #progress-backup-row button:hover{ border-color:var(--accent-dim); background:var(--accent-soft,#1a2422); }
  #progress-import-input{ display:none; }

  /* ---------- Press Play XP: leveling, ranks & unlockable cosmetics ---------- */
  @keyframes ppxp-bg-pan{
    0%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
    100%{ background-position:0% 50%; }
  }
  .ppxp-anim-bg{ background-size:300% 300% !important; animation:ppxp-bg-pan 16s ease infinite; }

  #ppxp-badge-rank{
    font-size:10px; color:var(--text-dim); letter-spacing:.2px; margin-top:1px;
  }
  #ppxp-badge-rank .ppxp-crown{ margin-right:3px; }
  #ppxp-badge.ppxp-legend #ppxp-badge-track{
    background:linear-gradient(90deg, var(--line), #4a3a10);
  }
  #ppxp-badge.ppxp-legend #ppxp-badge-fill{
    background:linear-gradient(90deg, var(--accent), #e0c25f);
  }
  #ppxp-badge.ppxp-caesar #ppxp-badge-track{
    background:linear-gradient(90deg, var(--line), #6b4420);
  }
  #ppxp-badge.ppxp-caesar #ppxp-badge-fill{
    background:linear-gradient(90deg, #d4af57, #f0d896);
  }
  #ppxp-badge.ppxp-platinum #ppxp-badge-track{
    background:linear-gradient(90deg, var(--line), #3a4a5c);
  }
  #ppxp-badge.ppxp-platinum #ppxp-badge-fill{
    background:linear-gradient(90deg, #9fd4e8, #e6f4fb);
  }
  #ppxp-badge.ppxp-immortal #ppxp-badge-track{
    background:linear-gradient(90deg, var(--line), #4d2a6b);
  }
  #ppxp-badge.ppxp-immortal #ppxp-badge-fill{
    background:linear-gradient(90deg, #6ee7d0, #d4af57, #c78cff);
  }
  #ppxp-badge.ppxp-celestial #ppxp-badge-track{
    background:linear-gradient(90deg, var(--line), #1f3a6b);
  }
  #ppxp-badge.ppxp-celestial #ppxp-badge-fill{
    background:linear-gradient(90deg, #7dd3fc, #a78bfa, #f9a8d4);
  }
  @keyframes ppxp-eternal-flow{ to{ background-position:200% 0; } }
  #ppxp-badge.ppxp-eternal #ppxp-badge-track{
    background:linear-gradient(90deg, var(--line), #6b1f4d);
  }
  #ppxp-badge.ppxp-eternal #ppxp-badge-fill{
    background:linear-gradient(90deg, #fde68a, #f9a8d4, #7dd3fc, #6ee7d0, #fde68a);
    background-size:200% 100%; animation:ppxp-eternal-flow 4s linear infinite;
  }
  #ppxp-view-rank-row{ cursor:pointer; }

  .ppxp-bg-presets-label{
    font-size:11px; color:var(--text-dim); margin:0 0 8px 0;
  }
  .ppxp-bg-presets-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(84px, 1fr));
    gap:8px; margin-bottom:16px;
  }
  .ppxp-bg-swatch{
    position:relative;
    height:52px; border-radius:calc(9px*var(--ui-round,1)); border:1px solid var(--line);
    cursor:pointer; overflow:hidden;
    display:flex; align-items:flex-end;
    padding:0; background-size:300% 300%;
    transition:border-color .12s, transform .1s;
  }
  .ppxp-bg-swatch:hover{ border-color:var(--accent-dim); transform:translateY(-1px); }
  .ppxp-bg-swatch-name{
    display:block; width:100%; padding:4px 6px;
    font-size:9.5px; font-weight:600; color:#fff; text-align:left;
    background:rgba(0,0,0,0.42); text-shadow:0 1px 2px rgba(0,0,0,0.6);
  }
  .ppxp-bg-swatch-lock{
    display:none; position:absolute; top:5px; right:6px; font-size:11px;
  }
  .ppxp-bg-swatch.locked{ cursor:pointer; opacity:0.55; filter:grayscale(0.5); }
  .ppxp-bg-swatch.locked .ppxp-bg-swatch-lock{ display:block; }

  .ppxp-eq-pro-btn{ position:relative; }
  .ppxp-eq-pro-btn .ppxp-lock{ display:none; margin-right:3px; font-size:9px; }
  .ppxp-eq-pro-btn.locked{ opacity:0.5; }
  .ppxp-eq-pro-btn.locked .ppxp-lock{ display:inline; }

  /* Playback perks (Level 340+) */
  .ppxp-quick{ display:flex; flex-wrap:wrap; gap:4px; margin:6px 0 4px; }
  .ppxp-chip{ flex:1 1 22%; min-width:34px; font-size:10px; padding:4px 2px; border:1px solid var(--line); background:transparent; color:var(--text-dim); border-radius:calc(6px*var(--ui-round,1)); cursor:pointer; }
  .ppxp-chip:hover{ border-color:var(--accent-dim); color:var(--text); }
  .ppxp-chip.active{ border-color:var(--accent); color:var(--accent); }

  /* Custom EQ slots (Level 320+) */
  #ppxp-eq-custom{ margin-top:10px; }
  .ppxp-eqc-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; font-size:11px; color:var(--text-dim); }
  .ppxp-eqc-edit{ background:none; border:1px solid var(--line); color:var(--text-dim); border-radius:calc(6px*var(--ui-round,1)); padding:3px 9px; font-size:10px; cursor:pointer; }
  .ppxp-eqc-edit.on{ color:var(--accent); border-color:var(--accent-dim); }
  .ppxp-eqc-grid{ display:flex; flex-wrap:wrap; gap:6px; }
  .ppxp-eqc-slot{ flex:1 1 28%; min-width:84px; display:flex; gap:3px; }
  .ppxp-eqc-main{ flex:1; min-width:0; font-size:10px; padding:6px 4px; border:1px solid var(--line); background:transparent; color:var(--text); border-radius:calc(6px*var(--ui-round,1)); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ppxp-eqc-main:hover:not(.locked){ border-color:var(--accent-dim); }
  .ppxp-eqc-main.empty{ color:var(--text-dim); border-style:dashed; }
  .ppxp-eqc-main.locked{ opacity:0.45; }
  .ppxp-eqc-mini{ font-size:10px; padding:6px 7px; border:1px solid var(--line); background:transparent; color:var(--text-dim); border-radius:calc(6px*var(--ui-round,1)); cursor:pointer; }

  #ppxp-rank-modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6);
    z-index:110; align-items:center; justify-content:center;
  }
  #ppxp-rank-modal-overlay.open{ display:flex; }
  #ppxp-rank-modal{
    background:var(--bg-elev); border:1px solid var(--line); border-radius:calc(14px*var(--ui-round,1));
    width:min(480px, 94vw); max-height:86vh;
    display:flex; flex-direction:column; overflow:hidden;
  }
  #ppxp-rank-modal-header{ padding:18px 22px 14px 22px; border-bottom:1px solid var(--line); }
  #ppxp-rank-modal-header h2{ margin:0 0 3px 0; font-size:15px; font-weight:600; }
  #ppxp-rank-modal-header p{ margin:0; font-size:12px; color:var(--text-dim); }
  #ppxp-rank-modal-body{ padding:10px 12px; overflow-y:auto; }
  .ppxp-rank-row{
    display:flex; align-items:flex-start; gap:12px;
    padding:10px 10px; border-radius:calc(10px*var(--ui-round,1)); margin-bottom:2px;
  }
  .ppxp-rank-row.current{ background:rgba(var(--accent-rgb,110,231,208),0.08); }
  .ppxp-rank-badge{
    flex-shrink:0; width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700;
    background:var(--bg); border:1px solid var(--line); color:var(--text-dim);
  }
  .ppxp-rank-row.achieved .ppxp-rank-badge{ color:var(--accent); border-color:var(--accent-dim); }
  .ppxp-rank-row.locked .ppxp-rank-badge{ opacity:0.5; }
  .ppxp-rank-name{ font-size:13px; font-weight:600; color:var(--text); }
  .ppxp-rank-row.locked .ppxp-rank-name{ color:var(--text-dim); }
  .ppxp-rank-level{ font-size:10.5px; color:var(--text-dim); margin-top:1px; }
  .ppxp-rank-reward{ font-size:11px; color:var(--text-dim); margin-top:4px; line-height:1.4; }
  #ppxp-rank-modal-footer{ padding:12px 22px 18px 22px; border-top:1px solid var(--line); text-align:right; }

  #ppxp-expshop-modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6);
    z-index:110; align-items:center; justify-content:center;
  }
  #ppxp-expshop-modal-overlay.open{ display:flex; }
  #ppxp-expshop-modal{
    background:var(--bg-elev); border:1px solid var(--line); border-radius:calc(14px*var(--ui-round,1));
    width:min(480px, 94vw); max-height:86vh;
    display:flex; flex-direction:column; overflow:hidden;
  }
  #ppxp-expshop-modal-header{ padding:18px 22px 14px 22px; border-bottom:1px solid var(--line); }
  #ppxp-expshop-modal-header h2{ margin:0 0 3px 0; font-size:15px; font-weight:600; }
  #ppxp-expshop-modal-header p{ margin:0; font-size:12px; color:var(--text-dim); }
  #ppxp-expshop-status{
    padding:12px 22px; border-bottom:1px solid var(--line);
    display:flex; flex-direction:column; gap:4px;
  }
  .ppxp-expshop-status-row{ display:flex; justify-content:space-between; font-size:12px; color:var(--text-dim); }
  .ppxp-expshop-status-row span:last-child{ color:var(--text); font-weight:600; }
  #ppxp-expshop-modal-body{ padding:10px 12px; overflow-y:auto; }
  .ppxp-expshop-section-label{
    font-size:11px; text-transform:uppercase; letter-spacing:0.4px;
    color:var(--text-dim); margin:12px 10px 6px 10px;
  }
  .ppxp-expshop-item{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:10px 10px; border-radius:calc(10px*var(--ui-round,1)); margin-bottom:2px;
  }
  .ppxp-expshop-item-info{ min-width:0; }
  .ppxp-expshop-item-name{ font-size:13px; font-weight:600; color:var(--text); }
  .ppxp-expshop-item-sub{ font-size:11px; color:var(--text-dim); margin-top:2px; line-height:1.4; }
  .ppxp-expshop-buy-btn{
    flex-shrink:0; padding:7px 13px; background:transparent;
    border:1px solid var(--line); color:var(--text); border-radius:calc(7px*var(--ui-round,1));
    font-size:11px; font-weight:600; cursor:pointer;
    transition:border-color .15s, background .15s, color .15s;
  }
  .ppxp-expshop-buy-btn:hover:not(:disabled){ border-color:var(--accent-dim); background:var(--accent-soft,#1a2422); color:var(--accent); }
  .ppxp-expshop-buy-btn:disabled{ opacity:0.45; cursor:default; }
  #ppxp-expshop-sprint-status{
    margin:10px 22px 0 22px; padding:10px 12px; border-radius:calc(8px*var(--ui-round,1));
    background:#2a1414; border:1px solid #5a2626;
  }
  #ppxp-expshop-sprint-status .ppxp-sprint-title{ font-size:12px; font-weight:700; color:#ff8b8b; margin-bottom:4px; }
  #ppxp-expshop-sprint-status .ppxp-expshop-status-row span:last-child{ color:var(--text); }
  #ppxp-expshop-sprint-cancel-btn{
    margin-top:8px; width:100%; padding:6px 10px; border-radius:calc(6px*var(--ui-round,1));
    border:1px solid #5a2626; background:#3a1a1a; color:#ff8b8b;
    font-size:11.5px; cursor:pointer;
  }
  #ppxp-expshop-sprint-cancel-btn:hover{ background:#4a2020; }
  #ppxp-expshop-modal-footer{ padding:12px 22px 18px 22px; border-top:1px solid var(--line); text-align:right; }

  #ppxp-quiz-modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6);
    z-index:110; align-items:center; justify-content:center;
  }
  #ppxp-quiz-modal-overlay.open{ display:flex; }
  #ppxp-quiz-modal{
    background:var(--bg-elev); border:1px solid var(--line); border-radius:calc(14px*var(--ui-round,1));
    width:min(480px, 94vw); max-height:86vh;
    display:flex; flex-direction:column; overflow:hidden;
  }
  #ppxp-quiz-modal-header{ padding:18px 22px 14px 22px; border-bottom:1px solid var(--line); }
  #ppxp-quiz-modal-header h2{ margin:0 0 3px 0; font-size:15px; font-weight:600; }
  #ppxp-quiz-modal-header p{ margin:0; font-size:12px; color:var(--text-dim); }
  #ppxp-quiz-modal-body{ padding:16px 22px; overflow-y:auto; }
  .ppxp-quiz-progress{ font-size:11px; color:var(--text-dim); margin-bottom:10px; }
  .ppxp-quiz-question{ font-size:13.5px; font-weight:600; color:var(--text); margin-bottom:14px; line-height:1.4; }
  .ppxp-quiz-option{
    display:block; width:100%; text-align:left;
    padding:10px 12px; margin-bottom:8px;
    background:var(--bg); border:1px solid var(--line); border-radius:calc(9px*var(--ui-round,1));
    color:var(--text); font-size:12.5px; cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .ppxp-quiz-option:hover:not(:disabled){ border-color:var(--accent-dim); background:var(--accent-soft,#1a2422); }
  .ppxp-quiz-option.correct{ border-color:var(--accent); background:rgba(var(--accent-rgb,110,231,208),0.12); color:var(--accent); }

  #playlists-list{ display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }

  #new-playlist-row{ display:flex; gap:8px; }
  #new-playlist-name{
    flex:1; min-width:0;
    background:var(--bg); border:1px solid var(--line); color:var(--text);
    border-radius:calc(7px*var(--ui-round,1)); padding:8px 10px; font-size:12.5px; font-family:inherit;
  }

  .settings-number-input{
    width:56px; flex-shrink:0; text-align:center;

  }
  .settings-number-input:focus{ outline:none; border-color:var(--accent-dim); }

  /* Light video mode: stop decorative animation/blur so the decoder gets the GPU. */
  body.perf-light *, body.perf-light *::before, body.perf-light *::after{
    animation:none !important; transition:none !important;

  }

  body.video-ui-lite .ppxp-anim-bg{ animation:none !important; }
  body.video-ui-lite *, body.video-ui-lite *::before, body.video-ui-lite *::after{
    backdrop-filter:none !important; -webkit-backdrop-filter:none !important;
  }
  body.video-ui-flat .custom-bg-active[style*="--flat-c1"]{

  }
  #video-ui-select, #lossless-quality-select, #perf-mode-select{ background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:calc(7px*var(--ui-round,1)); padding:7px 8px; font-size:12.5px; font-family:inherit; }
  #perf-check-btn{ margin-top:8px; background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:calc(8px*var(--ui-round,1)); padding:8px 12px; font-size:12.5px; font-family:inherit; cursor:pointer; }
  #perf-check-btn:hover{ border-color:var(--accent-dim); color:var(--accent); }
  #perf-check-out{ display:none; margin:8px 0 0; padding:8px 10px; background:var(--bg); border:1px solid var(--line); border-radius:calc(8px*var(--ui-round,1)); font-size:11.5px; line-height:1.5; white-space:pre-wrap; color:var(--text-dim); }
  #new-playlist-btn{
    flex-shrink:0;
    padding:8px 12px;
    background:transparent; border:1px solid var(--line); color:var(--text);
    border-radius:calc(7px*var(--ui-round,1)); font-size:12px; cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  #new-playlist-btn:hover{ border-color:var(--accent-dim); background:var(--accent-soft,#1a2422); }

  /* ================= Media player layout (opt-in setting) =================
     body.player-layout: browse screens (Library / Settings) with a bottom tab
     bar and a docked mini-player. Tapping a video opens a separate full-screen
     player page (body[data-pl-player]); closing it returns to the browse
     screen with the mini-player showing. */
  :root{ --pl-bar:58px; --pl-mini:64px; }
  #pl-tabbar, #pl-mini, #pl-back{ display:none; }
  body.player-layout #pl-tabbar{
    display:flex; position:fixed; left:0; right:0; bottom:0; z-index:60;
    height:calc(var(--pl-bar) + env(safe-area-inset-bottom, 0px));
    padding-bottom:env(safe-area-inset-bottom, 0px);
    background:var(--bg-elev); border-top:1px solid var(--line);
  }
  #pl-tabbar button{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    background:none; border:none; color:var(--text-dim);
    font-size:11px; font-weight:600; font-family:inherit; cursor:pointer; transition:color .15s;
  }
  #pl-tabbar button svg{ width:22px; height:22px; }
  #pl-tabbar button.active{ color:var(--accent); }
  #pl-tabbar button:focus-visible{ outline:2px solid var(--accent); outline-offset:-4px; }

  body.player-layout #app{ display:block; height:100vh; height:100dvh; }
  body.player-layout #sidebar-resize-handle{ display:none; }
  body.player-layout #sidebar-tabs{ display:none; }
  body.player-layout #sidebar-header{ padding-top:max(20px, env(safe-area-inset-top, 0px)); }

  /* Browse screens: the sidebar fills the screen above the tab bar (and above
     the mini-player when one is showing). */
  body.player-layout #sidebar{
    position:fixed; left:0; right:0; top:0; z-index:30;
    bottom:calc(var(--pl-bar) + env(safe-area-inset-bottom, 0px));
    width:auto; height:auto; max-height:none; min-height:0;
    border:none; display:flex; flex-direction:column; overflow:hidden;
  }
  body.player-layout.pl-has-track:not([data-pl-player]) #sidebar{
    bottom:calc(var(--pl-bar) + var(--pl-mini) + env(safe-area-inset-bottom, 0px));
  }

  /* Player page: a full-screen layer above everything. visibility (not
     display) keeps the visualizer and video sized and running while it is
     closed. */
  body.player-layout #main{
    position:fixed; inset:0; z-index:70; width:auto; height:auto; min-height:0;
    visibility:hidden; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:safe center;
    gap:clamp(14px, 3dvh, 28px);
    padding:max(60px, calc(env(safe-area-inset-top, 0px) + 52px)) 24px max(18px, env(safe-area-inset-bottom, 0px));
    background:transparent;
    overflow-x:hidden; overflow-y:auto; scrollbar-width:none;
  }
  body.player-layout #main::-webkit-scrollbar{ display:none; }
  body.player-layout[data-pl-player] #main{ visibility:visible; pointer-events:auto; }
  body.player-layout[data-pl-player] #pl-tabbar,
  body.player-layout[data-pl-player] #pl-mini{ display:none !important; }
  /* Audio player page: #main is transparent, so hide the browse screens underneath
     and let the app background (set on <body>) show through. Video keeps its black stage. */
  body.player-layout[data-pl-player]:not(.pl-video) #sidebar,
  body.player-layout[data-pl-player]:not(.pl-video) #pl-home{ visibility:hidden; pointer-events:none; }

  body.player-layout[data-pl-player] #pl-back{
    display:flex; align-items:center; justify-content:center;
    position:fixed; z-index:80;
    top:max(14px, env(safe-area-inset-top, 0px)); left:14px;
    width:36px; height:36px; border-radius:calc(8px*var(--ui-round,1));
    background:rgba(0,0,0,0.5); border:1px solid var(--line);
    color:var(--text); cursor:pointer; transition:background .15s, color .15s;
  }
  body.player-layout[data-pl-player] #pl-back:hover{ background:rgba(0,0,0,0.75); color:var(--accent); }
  #pl-back svg{ width:20px; height:20px; }
  body.player-layout:not([data-pl-player]) #immersive-btn,
  body.player-layout:not([data-pl-player]) #menu-btn{ display:none; }
  body.player-layout #immersive-btn, body.player-layout #menu-btn{ z-index:80; }

  body.player-layout #viz-wrap{
    width:min(380px, 82vw, 40dvh); height:min(380px, 82vw, 40dvh);
    max-width:none; max-height:none; margin:0; flex:0 0 auto;
  }
  body.player-layout #video-wrap{ width:min(640px, 100%); max-height:42dvh; margin:0; flex:0 0 auto; }
  body.player-layout #video-el, body.player-layout #video-delay-canvas{ max-height:42dvh; }

  body.player-layout #controls-col{
    display:flex; flex-direction:column; align-items:stretch;
    width:100%; max-width:480px; flex:0 0 auto;
  }
  body.player-layout #controls-col.custom-bg-active{ flex:0 0 auto; }
  body.player-layout #now-playing{ order:1; margin:0 0 16px; max-width:none; }
  body.player-layout #np-title{ font-size:clamp(18px, 2.6dvh, 22px); }
  body.player-layout #np-artist{ font-size:14px; }
  body.player-layout #seek-row{ order:2; width:100%; max-width:none; margin:0 0 6px; }
  body.player-layout #transport{ order:3; gap:clamp(16px, 5vw, 30px); margin:8px 0 16px; }
  body.player-layout #transport .ctrl-btn{ padding:10px; }
  body.player-layout #transport .ctrl-btn svg{ width:24px; height:24px; }
  body.player-layout #play-btn{ width:72px; height:72px; flex:0 0 72px; }
  body.player-layout #play-btn svg{ width:30px; height:30px; }
  body.player-layout #extra-transport{ order:4; justify-content:center; flex-wrap:wrap; margin:0 0 4px; }
  body.player-layout #controls-footer{ order:5; margin-top:10px; }
  body.player-layout #hint{ display:none; }

  /* Mini-player: docked above the tab bar once a track is loaded. */
  body.player-layout.pl-has-track:not([data-pl-player]) #pl-mini{
    display:flex; align-items:center; gap:10px;
    position:fixed; left:8px; right:8px; z-index:55;
    bottom:calc(var(--pl-bar) + env(safe-area-inset-bottom, 0px) + 6px);
    height:calc(var(--pl-mini) - 6px); padding:0 6px 0 8px;
    background:var(--g-1d1e23,#1d1e23); border:1px solid var(--line); border-radius:calc(12px*var(--ui-round,1));
    box-shadow:0 6px 20px rgba(0,0,0,.45); cursor:pointer; overflow:hidden;
  }
  #pl-mini-art{
    flex:0 0 auto; width:42px; height:42px; border-radius:calc(8px*var(--ui-round,1)); overflow:hidden;
    background:linear-gradient(145deg,var(--g-1c1d22,#1c1d22),var(--g-101114,#101114)); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; color:var(--text-dim);
  }
  #pl-mini-art img{ width:100%; height:100%; object-fit:cover; display:none; }
  #pl-mini-art svg{ width:20px; height:20px; }
  #pl-mini-art.has-art img{ display:block; }
  #pl-mini-art.has-art svg{ display:none; }
  #pl-mini-text{ flex:1; min-width:0; }
  #pl-mini-title{ font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #pl-mini-artist{ font-size:11.5px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  #pl-mini button{
    flex:0 0 auto; width:40px; height:40px; display:flex; align-items:center; justify-content:center;
    background:none; border:none; color:var(--text); border-radius:50%; cursor:pointer;
  }
  #pl-mini button:hover{ color:var(--accent); }
  #pl-mini button svg{ width:22px; height:22px; }
  #pl-mini-prog{ position:absolute; left:0; right:0; bottom:0; height:2px; background:var(--line); }
  #pl-mini-prog i{ display:block; height:100%; width:100%; background:var(--accent); transform-origin:0 50%; transform:scaleX(0); }   /* scaled, not resized: no layout while it moves */

  body.player-layout.immersive #pl-back{ display:none; }
  body.player-layout.immersive #main{ padding:0; }


  /* ---------- Home screen (media player layout) ---------- */
  #pl-home{ display:none; }
  body.player-layout[data-pl-view="home"] #sidebar,
  body.player-layout[data-pl-view="playlists"] #sidebar{ visibility:hidden; pointer-events:none; }
  /* While a browse screen is hidden, the browser skips it entirely. visibility alone still restyled and laid out every
     row of the Library (3000 rows for 3000 songs) each time a class on <body> changed, which happens many times while
     the app starts: seconds of a frozen app on a phone. content-visibility:hidden keeps its layout and scroll position,
     so coming back is still instant. Same cases as the visibility:hidden rules (here, pp-widgets.css, and the audio
     player page above). */
  body.player-layout[data-pl-view="home"] #sidebar,
  body.player-layout[data-pl-view="playlists"] #sidebar,
  body.player-layout[data-pw-page] #sidebar,
  body.player-layout[data-pw-page] #pl-home,
  body.player-layout[data-pl-player]:not(.pl-video) #sidebar,
  body.player-layout[data-pl-player]:not(.pl-video) #pl-home{ content-visibility:hidden; }
  body.player-layout[data-pl-view="home"] #pl-home,
  body.player-layout[data-pl-view="playlists"] #pl-home{
    display:block; position:fixed; left:0; right:0; top:0; z-index:30;
    bottom:calc(var(--pl-bar) + env(safe-area-inset-bottom, 0px));
    overflow-y:auto; overflow-x:hidden; background:transparent;
    padding:max(18px, env(safe-area-inset-top, 0px)) 0 20px;
    --ph-l:max(24px, calc(env(safe-area-inset-left, 0px) + 16px));
    --ph-r:max(24px, calc(env(safe-area-inset-right, 0px) + 16px));
  }
  body.player-layout.pl-has-track:not([data-pl-player])[data-pl-view="home"] #pl-home,
  body.player-layout.pl-has-track:not([data-pl-player])[data-pl-view="playlists"] #pl-home{
    bottom:calc(var(--pl-bar) + var(--pl-mini) + env(safe-area-inset-bottom, 0px));
  }
  #pl-home::-webkit-scrollbar{ width:8px; }
  #pl-home::-webkit-scrollbar-thumb{ background:var(--line); border-radius:calc(4px*var(--ui-round,1)); }
  .ph-app-title{ font-size:20px; font-weight:700; padding:0 var(--ph-r, 24px) 0 var(--ph-l, 24px); margin:0; letter-spacing:.2px; }
  .ph-sec{ margin-top:22px; }
  .ph-sec-head{ display:flex; align-items:baseline; gap:8px; padding:0 var(--ph-r, 24px) 10px var(--ph-l, 24px); }
  .ph-sec-head h2{ margin:0; font-size:16px; font-weight:700; }
  .ph-count{ font-size:12px; color:var(--text-dim); }
  .ph-sec-head .ph-spacer{ flex:1; }
  .ph-link{
    background:none; border:none; color:var(--accent); font:600 12.5px inherit; font-family:inherit;
    cursor:pointer; padding:4px 0 4px 8px;
  }
  .ph-link.dim{ color:var(--text-dim); }
  .ph-row{
    display:flex; gap:12px; overflow-x:auto; padding:0 var(--ph-r, 24px) 6px var(--ph-l, 24px); scroll-snap-type:x proximity;
    scroll-padding:0 var(--ph-l, 24px);
    scrollbar-width:none;
  }
  .ph-row::-webkit-scrollbar{ display:none; }
  .ph-row .ph-card{ flex:0 0 156px; scroll-snap-align:start; }
  .ph-row.expanded{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); overflow:visible; gap:14px 12px;
  }
  .ph-row.expanded .ph-card{ flex:none; }
  .ph-card{
    background:none; border:none; padding:0; text-align:left; color:inherit; font-family:inherit; cursor:pointer;
    min-width:0;
  }
  .ph-thumb{
    position:relative; aspect-ratio:16/9; border-radius:calc(10px*var(--ui-round,1)); overflow:hidden;
    background:linear-gradient(145deg,var(--g-1c1d22,#1c1d22),var(--g-101114,#101114)); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; color:var(--text-dim);
  }
  .ph-thumb img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .ph-thumb svg.ph-ph{ width:26px; height:26px; opacity:.7; }
  .ph-thumb.has-img svg.ph-ph{ display:none; }
  .ph-dur{
    position:absolute; right:6px; bottom:6px; font-size:10.5px; font-weight:600;
    background:rgba(0,0,0,.72); color:#fff; padding:2px 5px; border-radius:calc(5px*var(--ui-round,1));
  }
  .ph-title{
    margin-top:7px; font-size:12.5px; font-weight:600; line-height:1.3;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word;
  }
  .ph-sub{ margin-top:2px; font-size:11px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ph-card.cur .ph-title{ color:var(--accent); }
  .ph-card.cur .ph-thumb{ border-color:var(--accent); }
  .ph-card:active .ph-thumb{ transform:scale(.98); }

  /* ---------- Home / playlist selection (same actions as Library multi-select, own look) ---------- */
  .ph-card, .ph-trk{ -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  body.ph-selecting .ph-card .ph-thumb::after{
    content:''; position:absolute; left:7px; top:7px; width:20px; height:20px; border-radius:50%;
    border:2px solid rgba(255,255,255,.9); background:rgba(0,0,0,.38); box-sizing:border-box;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; line-height:1; font-weight:800; color:#0b0c0e;
  }
  body.ph-selecting .ph-card.sel .ph-thumb::after{ content:'\2713'; background:var(--accent); border-color:var(--accent); }
  body.ph-selecting .ph-card.sel .ph-thumb{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent); }
  body.ph-selecting .ph-card.sel .ph-thumb img{ opacity:.65; }
  body.ph-selecting .ph-card.sel .ph-title{ color:var(--accent); }
  body.ph-selecting .ph-trk::before{

    font-size:12px; line-height:1; font-weight:800; color:#0b0c0e;
  }
  body.ph-selecting .ph-trk.sel::before{ content:'\2713'; background:var(--accent); border-color:var(--accent); }
  body.ph-selecting .ph-trk.sel{ background:var(--accent-dim); }
  @supports (background:color-mix(in srgb, red 10%, transparent)){

  body.player-layout.ph-selecting[data-pl-view] #pl-home{ padding-bottom:170px; }

    bottom:calc(var(--pl-bar) + env(safe-area-inset-bottom, 0px) + 10px);

  }
  body.player-layout.ph-selecting:not([data-pl-player]) #ph-select-bar{ display:block; }
  .phs-top{ display:flex; align-items:center; gap:8px; padding:0 4px 8px; }

<script id="pp-theme-boot">

// so the app never flashes the stock colours first.
(function(){
  try {
    var css = localStorage.getItem('ppThemeCssV1');
    if (!css) return;
    var root = document.documentElement;
    root.setAttribute('data-pp-theme', '');
    var s = document.createElement('style');
    s.id = 'pp-theme-live';
    s.textContent = css;
    document.head.appendChild(s);
    var bg = localStorage.getItem('ppThemeBarV1');
    var m = document.querySelector('meta[name="theme-color"]');
    if (bg && m) m.setAttribute('content', bg);
  } catch(e){}
})();

    color:#fff; border-radius:calc(16px*var(--ui-round,1)); padding:12px 14px; overflow:hidden; }

  /* ===== Widgets fit their box, however narrow it is set =====

  .pw-md-st{ position:absolute; translate:-50% -50%; display:flex; flex-direction:column; align-items:center; gap:2px; padding:4px; border:0; background:none; color:var(--text-dim); font:inherit; font-size:11px; font-weight:700; white-space:nowrap; cursor:pointer; transition:color .15s, transform .15s; }
  .pw-md-st svg{ width:18px; height:18px; }
  .pw-md-st.on{ color:var(--pw-fc, var(--accent)); transform:scale(1.12); }
  .pw-md-now{ display:flex; align-items:center; gap:12px; }
  .pw-md-now b{ font-size:20px; font-weight:800; color:var(--pw-fg, var(--text)); min-width:5ch; text-align:right; }
  .pw-md-go{ height:36px; padding:0 16px; display:inline-flex; align-items:center; gap:7px; border:0; border-radius:999px; background:var(--pw-fc, var(--accent)); color:var(--on-accent, #08110f); font:inherit; font-size:13px; font-weight:700; cursor:pointer; }
  .pw-md-go svg{ width:13px; height:13px; }

  /* stem mixer */
  .pw-mx-rows{ display:flex; flex-direction:column; gap:4px; }
  .pw-mx-r{ display:flex; align-items:center; gap:10px; min-width:0; }

  .pw-mx-m{ flex:none; width:34px; height:34px; display:grid; place-items:center; border:0; border-radius:50%; background:var(--accent-soft, #1a2422); color:var(--accent); cursor:pointer; padding:0; }
  .pw-mx-m svg{ width:16px; height:16px; }
  .pw-mx-off .pw-mx-m{ background:color-mix(in srgb, var(--text, #fff) 10%, transparent); color:var(--text-dim); }

  .pw-mx-r input[type=range]::-webkit-slider-runnable-track{ height:6px; border-radius:3px; background:linear-gradient(90deg, var(--accent) var(--p), var(--line) var(--p)); }
  .pw-mx-r input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:18px; height:18px; margin-top:-6px; border-radius:50%; background:var(--accent); border:0; box-shadow:0 1px 4px rgba(0,0,0,.4); }
  .pw-mx-pre{ margin-top:8px; }
  .pw-mx-b{ display:flex; gap:6px; margin-top:8px; }
  .pw-mx-b button{ height:38px; padding:0 14px; display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:calc(10px*var(--ui-round,1)); border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; font-size:13px; font-weight:650; cursor:pointer; }
  .pw-mx-b button[hidden]{ display:none; }
  .pw-mx-b .pw-mx-go{ flex:1 1 auto; background:var(--accent); color:var(--on-accent, #08110f); border-color:transparent; }
  .pw-mx-b .pw-mx-go:disabled{ opacity:.4; cursor:default; }
  .pw-mx-b svg{ width:14px; height:14px; }
  .pw-mx-e{ margin:6px 0 0; font-size:12.5px; color:var(--text-dim); line-height:1.4; }
  .pw-mx-e:empty{ display:none; }
  .pw-mx-none .pw-mx-rows, .pw-mx-none .pw-mx-pre{ opacity:.45; pointer-events:none; }
  .pw-mx-on .pw-wh .pw-mx-s{ color:var(--accent); font-variant-numeric:tabular-nums; }

  /* sing-along */
  .pw-sa{ position:relative; text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px; padding:6px 0; }
  .pw-sa-p, .pw-sa-n{ font-size:.62em; color:var(--text-dim); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-height:1.3em; }
  .pw-sa-p{ opacity:.6; }
  .pw-sa-c{ font-weight:800; line-height:1.25; color:color-mix(in srgb, var(--pw-fg, var(--text)) 38%, transparent); overflow-wrap:anywhere; }
  .pw-sa-l{ font-size:24px; } .pw-sa-m{ font-size:18px; } .pw-sa-xl{ font-size:32px; }
  .pw-sa-c span{ --w:0%; background:linear-gradient(90deg, var(--accent) var(--w), color-mix(in srgb, var(--pw-fg, var(--text)) 38%, transparent) var(--w)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .pw-sa-c span.on{ text-shadow:0 0 18px color-mix(in srgb, var(--accent) 35%, transparent); }
  .pw-sa.pw-dim .pw-sa-c{ font-size:.62em; font-weight:600; color:var(--text-dim); }
  .pw-sa-in{ animation:pw-sa-in .3s ease-out; }
  @keyframes pw-sa-in{ from{ opacity:.2; transform:translateY(8px); } to{ opacity:1; transform:none; } }
  .pw-sa-v{ margin-top:4px; height:32px; padding:0 14px; display:inline-flex; align-items:center; gap:6px; border-radius:999px; border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; font-size:12.5px; font-weight:650; cursor:pointer; }
  .pw-sa-v[hidden]{ display:none; }
  .pw-sa-v.on{ background:var(--accent); color:var(--on-accent, #08110f); border-color:transparent; }
  .pw-sa-v svg{ width:14px; height:14px; }
  @media (prefers-reduced-motion: reduce){ .pw-rc-in, .pw-sa-in{ animation:none; } .pw-md-knob{ transition:none; } }
  /* ===== Handy widgets: alarm, queue, playlist tiles, tag chips, storage, practice loop (pp-widgets-tools.js) ===== */
  /* the on / off switch (alarms in the Pendulum and its widget) */
  .pw-al-sw{ flex:none; position:relative; width:58px; height:34px; border:0; padding:0; border-radius:999px; cursor:pointer; background:color-mix(in srgb, var(--text, #fff) 16%, transparent); transition:background .2s; }
  .pw-al-sw i{ position:absolute; top:4px; left:4px; width:26px; height:26px; border-radius:50%; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.35); transition:left .22s cubic-bezier(.3,1.5,.5,1); }
  .pw-al-sw[aria-checked="true"]{ background:var(--accent); }
  .pw-al-sw[aria-checked="true"] i{ left:28px; }

  /* queue */
  .pw-qb-i{ display:flex; align-items:center; gap:2px; min-width:0; }
  .pw-qb-i .pw-song{ flex:1 1 auto; }
  .pw-qb-i .pw-song em{ flex:none; width:16px; font-style:normal; font-size:12px; font-weight:700; color:var(--text-dim); text-align:center; }
  .pw-qb-i .pw-song .pw-art{ width:36px; height:36px; }
  .pw-qb-more{ margin:2px 0 0 28px; font-size:12px; color:var(--text-dim); }
  .pw-qb-end{ text-transform:none; letter-spacing:0; font-weight:650; }
  .pw-qb-f{ margin-top:8px; }
  .pw-qb-f input{ width:100%; height:38px; padding:0 12px; border-radius:calc(10px*var(--ui-round,1)); border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; font-size:14px; box-sizing:border-box; }
  .pw-qb-r{ display:flex; flex-direction:column; gap:2px; margin-top:4px; }
  .pw-qb-hit{ display:flex; align-items:center; gap:10px; padding:7px 6px; border:0; border-radius:8px; background:none; color:var(--text); font:inherit; text-align:left; cursor:pointer; min-width:0; }
  .pw-qb-hit:hover{ background:color-mix(in srgb, var(--text, #fff) 6%, transparent); }
  .pw-qb-hit > svg{ flex:none; width:16px; height:16px; color:var(--accent); }
  .pw-qb-hit span{ min-width:0; display:flex; flex-direction:column; }
  .pw-qb-hit b{ font-size:13.5px; font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pw-qb-hit small{ font-size:11.5px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* playlist tiles */
  .pw-plt{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px; }
  .pw-plt-i{ position:relative; min-width:0; }
  .pw-plt-c{ position:relative; display:block; width:100%; aspect-ratio:1; padding:0; border:0; border-radius:calc(16px*var(--ui-round,1)); overflow:hidden; cursor:pointer; background:var(--bg-elev, #15171b); color:#fff; text-align:left; font:inherit; box-shadow:0 6px 16px rgba(0,0,0,.28); }
  .pw-plt-c > img, .pw-plt-mo{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .pw-plt-mo{ display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }
  .pw-plt-mo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .pw-plt-ph{ position:absolute; inset:0; display:grid; place-items:center; background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 45%, #1b1d22), #121317); color:rgba(255,255,255,.85); }
  .pw-plt-ph svg{ width:34%; height:34%; }
  .pw-plt-t{ position:absolute; left:0; right:0; bottom:0; padding:28px 10px 9px; display:flex; flex-direction:column; background:linear-gradient(transparent, rgba(0,0,0,.78)); }
  .pw-plt-t b{ font-size:14.5px; font-weight:750; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-shadow:0 1px 3px rgba(0,0,0,.5); }
  .pw-plt-t small{ font-size:11.5px; opacity:.8; }
  .pw-plt-p{ position:absolute; right:9px; bottom:12px; width:32px; height:32px; border-radius:50%; display:grid; place-items:center; background:var(--accent); color:var(--on-accent, #08110f); box-shadow:0 3px 10px rgba(0,0,0,.45); }
  .pw-plt-p svg{ width:13px; height:13px; }
  .pw-plt-t{ padding-right:46px; }
  .pw-plt-o{ position:absolute; top:8px; right:8px; width:30px; height:30px; border:0; border-radius:50%; display:grid; place-items:center; background:rgba(0,0,0,.45); color:#fff; cursor:pointer; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .pw-plt-o svg{ width:15px; height:15px; }

  /* tag chips */
  .pw-chips{ display:flex; flex-wrap:wrap; gap:7px; }
  .pw-chip{ display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 13px; border-radius:999px; border:1px solid var(--line); background:var(--bg-elev, #15171b); color:var(--pw-fg, var(--text)); font:inherit; font-size:13px; font-weight:650; cursor:pointer; }
  .pw-chip small{ font-size:11px; font-weight:700; color:var(--text-dim); }
  .pw-chip-v{ background:color-mix(in srgb, var(--accent) 14%, var(--bg-elev, #15171b)); border-color:color-mix(in srgb, var(--accent) 35%, transparent); }
  .pw-chip:active{ transform:scale(.96); }

  /* storage */
  .pw-sto-bar{ display:flex; height:12px; border-radius:6px; overflow:hidden; background:var(--line); gap:2px; }
  .pw-sto-bar i{ display:block; height:100%; min-width:0; }
  .pw-sto-v{ background:var(--accent); } .pw-sto-a{ background:#7cc4ff; } .pw-sto-s{ background:#f2b84b; }
  .pw-sto-k{ display:flex; flex-wrap:wrap; gap:4px 14px; margin:8px 0 4px; font-size:12.5px; color:var(--pw-fg, var(--text)); }
  .pw-sto-k span{ display:inline-flex; align-items:center; gap:6px; }
  .pw-sto-k i{ width:9px; height:9px; border-radius:3px; }
  .pw-sto-k small{ color:var(--text-dim); }
  .pw-sto-top{ margin-top:4px; }
  .pw-sto .pw-otd-e{ margin:4px 0; font-size:12px; }
  .pw-sto-go{ margin-top:6px; border:0; background:none; padding:4px 0; color:var(--accent); font:inherit; font-size:13px; font-weight:650; cursor:pointer; }

  /* practice loop */
  .pw-pr-ab{ display:flex; align-items:center; gap:10px; }
  .pw-pr-ab > button{ flex:none; min-width:76px; height:52px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; border-radius:calc(12px*var(--ui-round,1)); border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; cursor:pointer; }
  .pw-pr-ab > button small{ font-size:11px; font-weight:700; color:var(--text-dim); }
  .pw-pr-ab > button b{ font-size:15px; font-weight:800; font-variant-numeric:tabular-nums; }
  .pw-pr-ab > button.on{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--bg)); }
  .pw-pr-ab > button.on small{ color:var(--accent); }
  .pw-pr-line{ position:relative; flex:1 1 auto; height:6px; border-radius:3px; background:var(--line); }
  .pw-pr-line i{ position:absolute; top:-2px; bottom:-2px; min-width:3px; border-radius:4px; background:var(--accent); }
  .pw-pr-line i[hidden]{ display:none; }
  .pw-pr-l{ display:block; margin:10px 0 5px; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); }
  .pw-pr-st{ margin:8px 0 0; font-size:12.5px; color:var(--text-dim); line-height:1.4; min-height:1.4em; }
  .pw-pr-sp{ color:var(--accent); text-transform:none; letter-spacing:0; }
  /* ===== Toys: beat pad, tap tempo, guess the song, cover globe, Bloopy pet, record player (pp-widgets-toys.js) ===== */
  /* beat pad */
  .pw-bp-g{ display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px; }
  .pw-bp-4 .pw-bp-g{ grid-template-columns:repeat(2, minmax(0, 1fr)); }
  .pw-bp-p{ position:relative; aspect-ratio:1.25; min-width:0; border:0; padding:0; border-radius:calc(14px*var(--ui-round,1)); cursor:pointer; touch-action:none; overflow:hidden;
    background:linear-gradient(160deg, color-mix(in srgb, var(--pc) 34%, #23262c), color-mix(in srgb, var(--pc) 14%, #121317)); box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--pc) 45%, transparent), 0 4px 0 color-mix(in srgb, var(--pc) 25%, #08090b);
    color:#fff; font:inherit; transition:transform .06s; }
  .pw-bp-4 .pw-bp-p{ aspect-ratio:1.6; }
  .pw-bp-p span{ position:absolute; left:9px; bottom:7px; font-size:11.5px; font-weight:750; opacity:.85; }
  .pw-bp-p::after{ content:''; position:absolute; inset:0; border-radius:inherit; background:radial-gradient(circle at 50% 50%, var(--pc), transparent 75%); opacity:0; }
  .pw-bp-p.hit{ transform:translateY(3px); box-shadow:inset 0 0 0 1.5px var(--pc), 0 1px 0 color-mix(in srgb, var(--pc) 25%, #08090b); }
  .pw-bp-p.hit::after{ animation:pw-bp-hit .35s ease-out; }
  @keyframes pw-bp-hit{ 0%{ opacity:.95; } 100%{ opacity:0; } }
  .pw-bp-pulse .pw-bp-p{ animation:pw-bp-beat var(--beat, .6s) ease-out infinite; }
  @keyframes pw-bp-beat{ 0%{ filter:brightness(1.25); } 40%, 100%{ filter:none; } }
  .pw-bp-b{ display:flex; align-items:center; gap:10px; margin-top:10px; }
  .pw-bp-rec{ flex:none; height:36px; padding:0 14px 0 10px; display:inline-flex; align-items:center; gap:8px; border-radius:999px; border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; font-size:12.5px; font-weight:650; cursor:pointer; }
  .pw-bp-rec i{ width:12px; height:12px; border-radius:50%; background:#ff4d5e; }
  .pw-bp-recording .pw-bp-rec i{ animation:pw-bp-blink .5s steps(2) infinite; }
  .pw-bp-looping .pw-bp-rec i{ border-radius:2px; background:var(--text); }
  @keyframes pw-bp-blink{ 50%{ opacity:.2; } }
  .pw-bp-bar{ flex:1 1 auto; height:5px; border-radius:3px; background:var(--line); overflow:hidden; }
  .pw-bp-bar i{ display:block; height:100%; width:0; background:var(--accent); }
  .pw-bp-recording .pw-bp-bar i{ background:#ff4d5e; }
  .pw-bp-bpm{ flex:none; font-size:11.5px; font-weight:650; color:var(--text-dim); font-variant-numeric:tabular-nums; }

  /* tap tempo */
  .pw-tt{ display:flex; align-items:center; gap:16px; }
  .pw-tt-b{ flex:none; width:112px; height:112px; border-radius:50%; border:0; cursor:pointer; touch-action:manipulation; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    background:radial-gradient(circle at 38% 30%, color-mix(in srgb, var(--accent) 60%, #fff), var(--accent) 58%, color-mix(in srgb, var(--accent) 55%, #000)); color:var(--on-accent, #08110f); font:inherit;
    box-shadow:0 6px 0 color-mix(in srgb, var(--accent) 45%, #000), 0 10px 18px rgba(0,0,0,.3); transition:transform .07s, box-shadow .07s; }

  .pw-tt-b.hit{ animation:pw-tt-hit .16s ease-out; }
  @keyframes pw-tt-hit{ 0%{ transform:translateY(5px); box-shadow:0 1px 0 color-mix(in srgb, var(--accent) 45%, #000), 0 3px 6px rgba(0,0,0,.3); } 100%{ transform:none; } }
  .pw-tt-r{ flex:1 1 auto; min-width:0; }
  .pw-tt-v{ display:flex; align-items:baseline; gap:6px; }
  .pw-tt-v b{ font-size:44px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums; color:var(--pw-fg, var(--text)); line-height:1; }
  .pw-tt-v small{ font-size:13px; font-weight:700; color:var(--text-dim); }
  .pw-tt-s{ margin:4px 0 8px; font-size:12.5px; color:var(--text-dim); }
  .pw-tt-go{ height:34px; padding:0 12px; display:inline-flex; align-items:center; gap:6px; border-radius:999px; border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; font-size:12.5px; font-weight:650; cursor:pointer; }
  .pw-tt-go:disabled{ opacity:.4; cursor:default; }
  .pw-tt-go svg{ width:13px; height:13px; }

  /* guess the song */
  .pw-gs-go{ margin-top:10px; height:40px; padding:0 18px; display:inline-flex; align-items:center; gap:8px; border:0; border-radius:999px; background:var(--accent); color:var(--on-accent, #08110f); font:inherit; font-size:14px; font-weight:700; cursor:pointer; }
  .pw-gs-go svg{ width:13px; height:13px; }
  .pw-gs-wave{ display:flex; justify-content:center; align-items:center; gap:5px; height:40px; margin:4px 0 6px; }
  .pw-gs-wave i{ width:6px; height:100%; border-radius:3px; background:var(--accent); animation:pw-gs-w .9s ease-in-out infinite; }
  .pw-gs-wave i:nth-child(2){ animation-delay:-.2s; } .pw-gs-wave i:nth-child(3){ animation-delay:-.45s; } .pw-gs-wave i:nth-child(4){ animation-delay:-.1s; } .pw-gs-wave i:nth-child(5){ animation-delay:-.6s; }
  .pw-gs-still i{ animation:none; transform:scaleY(.2); opacity:.5; }
  @keyframes pw-gs-w{ 0%, 100%{ transform:scaleY(.25); } 50%{ transform:scaleY(1); } }
  .pw-gs-time{ height:4px; border-radius:2px; background:var(--line); overflow:hidden; margin-bottom:10px; }
  .pw-gs-time i{ display:block; height:100%; background:var(--accent); animation:pw-gs-t linear forwards; transform-origin:left; }
  @keyframes pw-gs-t{ from{ transform:scaleX(1); } to{ transform:scaleX(0); } }
  .pw-gs-o{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px; }
  .pw-gs-a{ min-width:0; min-height:58px; padding:8px 10px; display:flex; flex-direction:column; justify-content:center; gap:2px; text-align:left; border-radius:calc(12px*var(--ui-round,1)); border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; cursor:pointer; }
  .pw-gs-a b{ font-size:13.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pw-gs-a small{ font-size:11.5px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pw-gs-a.ok{ border-color:#3ddc84; background:color-mix(in srgb, #3ddc84 18%, var(--bg)); }
  .pw-gs-a.no{ border-color:#ff5f6d; background:color-mix(in srgb, #ff5f6d 18%, var(--bg)); }
  .pw-gs-a.dim{ opacity:.45; }
  .pw-gs-a:disabled{ cursor:default; color:var(--text); }
  .pw-gs-res{ margin:10px 0 0; font-size:14px; font-weight:700; color:var(--pw-fg, var(--text)); }

  /* cover globe */
  .pw-fd-globe{ container-type:size; touch-action:pan-y; }

  /* Bloopy pet */
  .pw-pet{ position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; overflow:hidden; }
  .pw-pet-me{ position:relative; flex:1 1 auto; min-height:0; width:100%; border:0; padding:0; background:none; cursor:pointer; display:flex; align-items:flex-end; justify-content:center; -webkit-tap-highlight-color:transparent; }
  .pw-pet-ball{ width:auto !important; height:78% !important; aspect-ratio:1; max-width:60%; transform-origin:50% 100%; }
  .pw-pet-ball svg{ width:100%; height:100%; overflow:visible; display:block; }
  .pw-pet[data-mood="dance"] .pw-pet-ball{ animation:pw-pet-dance calc(var(--beat, .5s) * 2) ease-in-out infinite; }
  .pw-pet[data-mood="sway"] .pw-pet-ball{ animation:pw-pet-sway calc(var(--beat, .6s) * 4) ease-in-out infinite; }

  /* record player */
  .pw-tt2{ container-type:size; }

  .pw-tt2-deck::before{ content:''; position:absolute; inset:0; opacity:.18; background:repeating-linear-gradient(100deg, transparent 0 9px, rgba(0,0,0,.35) 9px 10px, transparent 10px 23px); pointer-events:none; }

  .pw-tt2-plat{ position:absolute; left:6cqmin; top:50%; translate:0 -50%; width:86cqmin; height:86cqmin; border-radius:50%; touch-action:pan-y; cursor:grab;
    background:radial-gradient(circle, #3a3d44 0 66%, #9aa1aa 67%, #555b63 69%, #2a2d33 71%); box-shadow:0 6px 14px rgba(0,0,0,.45); }
  .pw-tt2-rec{ position:absolute; inset:4%; border-radius:50%; will-change:transform;
    background:repeating-radial-gradient(circle, #111 0 1.5px, #1d1e22 1.5px 3px), #111; box-shadow:inset 0 0 0 2px #050505; }
  .pw-tt2-rec::after{ content:''; position:absolute; inset:0; border-radius:50%; background:conic-gradient(from 20deg, transparent 0 12%, rgba(255,255,255,.12) 16%, transparent 22% 60%, rgba(255,255,255,.08) 64%, transparent 70%); }
  .pw-tt2-lab{ position:absolute; inset:33%; border-radius:50%; overflow:hidden; background:var(--accent); display:grid; place-items:center; z-index:1; box-shadow:0 0 0 2px rgba(0,0,0,.4); }

  /* the arm hangs down from its pivot (top right of the record) and turns towards the middle */
  .pw-tt2-arm{ position:absolute; left:calc(6cqmin + 86cqmin - 4cqmin); top:7%; width:12cqmin; height:66%; transform-origin:50% 6cqmin; z-index:2; cursor:grab; transition:transform .5s ease; }

  .pw-tt2-rod{ position:absolute; left:50%; top:6cqmin; bottom:12%; width:2.4cqmin; margin-left:-1.2cqmin; border-radius:2cqmin; background:linear-gradient(90deg, #8e959e, #eef0f3, #8e959e); box-shadow:2px 3px 5px rgba(0,0,0,.35); }
  .pw-tt2-head{ position:absolute; left:50%; bottom:2%; width:7cqmin; height:13%; margin-left:-3.5cqmin; border-radius:1.5cqmin; background:linear-gradient(180deg, #2a2d33, #0e0f12); box-shadow:2px 3px 6px rgba(0,0,0,.45); transform:rotate(-14deg); }
  .pw-tt2-info{ position:absolute; right:4%; bottom:5%; max-width:calc(100% - 96cqmin - 6%); display:flex; flex-direction:column; align-items:flex-end; text-align:right; gap:1px; color:rgba(255,255,255,.92); text-shadow:0 1px 3px rgba(0,0,0,.5); }

  .pw-tt2-info small{ font-size:11px; opacity:.75; font-variant-numeric:tabular-nums; }
  @media (prefers-reduced-motion: reduce){ .pw-bp-pulse .pw-bp-p, .pw-pet-ball, .pw-gs-wave i{ animation:none !important; } }
  /* ===== Extras: slideshow, the cover behind a widget (pp-widgets-extras.js) ===== */
  /* slideshow */
  .pw-sl2{ position:relative; width:100%; overflow:hidden; border-radius:calc(14px*var(--ui-round,1)); background:var(--bg-elev); cursor:pointer; -webkit-tap-highlight-color:transparent; }

  .pw-sl2-slide .pw-sl2-i.was{ transform:translateX(-100%); }

  .pw-sl2-dots i.on{ background:#fff; width:14px; border-radius:3px; }
  @media (prefers-reduced-motion: reduce){ .pw-sl2-i, .pw-sl2-i img{ transition:none !important; } }

  /* the cover of what is playing behind a widget */
  .pw-bx-cover{ position:relative; isolation:isolate; overflow:hidden; color:#fff; border-radius:calc(16px*var(--ui-round,1)); padding:12px 14px; background:var(--bg-elev); }
  .pw-bx-cover::before{ content:''; position:absolute; inset:calc(var(--pw-bxb, 14px) * -2); z-index:-1; background:var(--pw-cover, none) center/cover no-repeat, var(--bg-elev);

  /* ===== Press Play Pomodoro: the tab and the widget (pp-widgets-pomodoro.js) ===== */
  .ppp, .pw-po{ --po-c:#ff6b5e; }
  .ppp[data-ph="short"], .pw-po[data-ph="short"]{ --po-c:#3ddc97; }
  .ppp[data-ph="long"], .pw-po[data-ph="long"]{ --po-c:#7cc4ff; }

  /* Alarms take the app's own accent colour (and the theme's text-on-accent), like the rest of Press Play. The
     Pomodoro keeps its phase colours (tomato red, break green, long-break blue): they say which phase it is. */
  .ppd[data-sec="alarms"]{ --po-c:var(--accent, #ffb547); --po-ink:var(--on-accent, #14100f); }

  .ppp-today small{ margin-left:5px; font-size:12px; color:var(--text-dim); }

  .ppp-phases{ display:flex; gap:4px; padding:4px; border-radius:999px; background:color-mix(in srgb, var(--text, #fff) 7%, transparent); }

  .ppp-ring, .pw-po-ring{ position:relative; aspect-ratio:1; }

  .ppp-f select{ width:100%; height:40px; padding:0 10px; border-radius:calc(10px*var(--ui-round,1)); border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; font-size:14px; }
  .ppp-seg{ display:flex; flex-wrap:wrap; gap:5px; }

  .ppp-stats b{ font-size:18px; font-weight:800; font-variant-numeric:tabular-nums; } .ppp-stats small{ font-size:11.5px; color:var(--text-dim); }

  .ppp-bar{ position:relative; flex:1 1 0; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; }

    if (st.seek === 'thick') css.push(P + '.player-layout #seek{height:10px!important;border-radius:calc(5px*' + r + ')!important}');
    if (st.seek === 'nothumb') css.push(P + ' #seek::-webkit-slider-thumb{opacity:0!important}', P + '.player-layout #seek{height:6px!important}');

      P + ' .pw-np,' + P + ' .pw-btn,' + P + ' .pw-card{box-shadow:0 16px 34px -14px rgba(0,0,0,.9)}');

  // ---------- colour helpers ----------
  function okHex(h){ return typeof h === 'string' && /^#[0-9a-f]{6}$/i.test(h); }
  function rgb(h){ var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function hex(c){ return '#' + c.map(function(v){ return Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0'); }).join(''); }
  function mix(a, b, t){ var x = rgb(a), y = rgb(b); return hex([0,1,2].map(function(i){ return x[i] + (y[i] - x[i]) * t; })); }
  function scale(a, f){ return hex(rgb(a).map(function(v){ return v * f; })); }
  function avg(h){ var c = rgb(h); return (c[0] + c[1] + c[2]) / 3; }
  function lum(h){
    var c = rgb(h).map(function(v){ v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  function hsl2hex(h, s, l){
    s /= 100; l /= 100;
    var k = function(n){ return (n + h / 30) % 12; }, a = s * Math.min(l, 1 - l);
    var f = function(n){ return l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); };
    return hex([f(0) * 255, f(8) * 255, f(4) * 255]);
  }
  function hue(h){
    var c = rgb(h).map(function(v){ return v / 255; }), mx = Math.max.apply(null, c), mn = Math.min.apply(null, c), d = mx - mn;
    if (!d) return 0;
    var r = c[0], g = c[1], b = c[2], x = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return (x * 60 + 360) % 360;
  }

  // ---------- theme model ----------
  function clean(t){
    if (!t || typeof t !== 'object') return null;
    var c = {};
    Object.keys(STOCK).forEach(function(k){ c[k] = okHex(t.c && t.c[k]) ? t.c[k].toLowerCase() : STOCK[k]; });
    var r = +t.round; if (!isFinite(r)) r = 1;
    return { v:1, name: typeof t.name === 'string' ? t.name.slice(0, 40) : '', preset: typeof t.preset === 'string' ? t.preset : null,
             c:c, round: Math.max(0, Math.min(2, r)), font: FONTS[t.font] ? t.font : 'default', s: cleanStyle(t.s) };
  }
  function isStock(t){
    return !t || (stockColors(t) && t.round === 1 && t.font === 'default' && !Object.keys(t.s || {}).length);
  }
  function stockColors(t){ return Object.keys(STOCK).every(function(k){ return t.c[k] === STOCK[k]; }); }
  function load(){ try { return clean(JSON.parse(localStorage.getItem(KEY))); } catch(e){ return null; } }
  function stockTheme(){ return clean({ c: STOCK }); }

  // A stock grey -> the matching shade of the theme, by where its brightness sits between the stock anchors.
  function greyMap(t){
    var A = [['#000000','#000000'], [STOCK.bg, t.c.bg], [STOCK.surface, t.c.surface], [STOCK.line, t.c.line],
             [STOCK.dim, t.c.dim], [STOCK.text, t.c.text], ['#ffffff', '#ffffff']];
    return function(g){
      var L = avg(g);
      for (var i = 1; i < A.length; i++){
        var lo = avg(A[i-1][0]), hi = avg(A[i][0]);
        if (L <= hi){ return mix(A[i-1][1], A[i][1], hi === lo ? 0 : (L - lo) / (hi - lo)); }
      }
      return A[A.length - 1][1];
    };
  }

  function buildCss(t){
    var c = t.c, map = greyMap(t), v = [];
    var ac = rgb(c.accent);
    var dark = scale(c.accent, 0.07), la = lum(c.accent);   // text on accent: whichever of near-black / white reads better
    var onAccent = (la + 0.05) / (lum(dark) + 0.05) >= 1.05 / (la + 0.05) ? dark : '#ffffff';
    v.push('--bg:' + c.bg, '--bg-elev:' + c.surface, '--line:' + c.line, '--text:' + c.text, '--text-dim:' + c.dim,
           '--accent:' + c.accent, '--accent-dim:' + scale(c.accent, 0.45), '--accent-soft:' + mix(c.bg, c.accent, 0.11),
           '--accent-rgb:' + ac.join(','), '--on-accent:' + onAccent, '--danger:' + c.danger, '--ui-round:' + t.round);
    GREYS.forEach(function(g){ var m = map('#' + g); v.push('--g-' + g + ':' + m, '--g-' + g + '-rgb:' + rgb(m).join(',')); });
    var decl = v.join(';');
    // html[data-pp-theme] body beats body.pp-refined and the shop accent (set inline on <html>, inherited by body).
    // Stock colours with only corners / font / style changed: leave every colour as the app has it.
    var css = stockColors(t) ? 'html[data-pp-theme] body{--ui-round:' + t.round + '}\n' :
              'html[data-pp-theme]{' + decl + ';background:' + c.bg + '}\n' +
              'html[data-pp-theme] body{' + decl + '}\n' +
              'html[data-pp-theme] body.pp-refined{--line:' + map('#2b2d35') + '}\n';
    var f = FONTS[t.font] && FONTS[t.font].css;
    if (f){
      css += 'html[data-pp-theme] body,html[data-pp-theme] body.pp-refined{font-family:' + f + '}\n' +
             ':where(html[data-pp-theme]) :where(button,input,select,textarea){font-family:inherit}\n';
    }
    return css + styleCss(t.s || {}, c);
  }

  var styleEl = null, pending = null, rafId = 0;
  function paint(t){
    var root = document.documentElement, meta = document.querySelector('meta[name="theme-color"]');
    styleEl = styleEl || document.getElementById('pp-theme-live');
    if (!t || isStock(t)){
      root.removeAttribute('data-pp-theme');
      if (styleEl) styleEl.textContent = '';
      if (meta) meta.setAttribute('content', STOCK.bg);
      return;
    }
    if (!styleEl){ styleEl = document.createElement('style'); styleEl.id = 'pp-theme-live'; document.head.appendChild(styleEl); }
    styleEl.textContent = buildCss(t);
    root.setAttribute('data-pp-theme', '');
    if (meta) meta.setAttribute('content', t.c.bg);
  }
  // Slider and colour-wheel drags fire many times a frame; restyle the page at most once a frame.
  function paintSoon(t){
    pending = t;
    if (!rafId) rafId = requestAnimationFrame(function(){ rafId = 0; paint(pending); });
  }
  function persist(t){
    try {
      if (!t || isStock(t)){ localStorage.removeItem(KEY); localStorage.removeItem(CSS_KEY); localStorage.removeItem(BAR_KEY); }
      else { localStorage.setItem(KEY, JSON.stringify(t)); localStorage.setItem(CSS_KEY, buildCss(t)); localStorage.setItem(BAR_KEY, t.c.bg); }
    } catch(e){ if (typeof ppCaught === "function") ppCaught(e); }
  }

  var current = load();
  paint(current);   // repaints what the boot script put up, in case the stylesheet rules moved on since it was cached
  persist(current);

  var saveTimer = 0;
  function setTheme(t, now){
    current = clean(t);
    paintSoon(current);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ persist(current); }, now ? 0 : 300);
    if (ui) ui.sync();
  }
  function fromAccent(a){
    var h = hue(a);
    return { bg: hsl2hex(h, 28, 5), surface: hsl2hex(h, 24, 9), line: hsl2hex(h, 18, 15),
             text: hsl2hex(h, 20, 92), dim: hsl2hex(h, 10, 60), accent: a, danger: '#ff6b81' };
  }

  // ---------- export / import ----------
  function bgApi(){ return window.PPXpCustomization || null; }
  function exportTheme(withBackgrounds){
    var t = current || stockTheme();
    var out = { kind:'press-play-theme', v:1, theme: { name: t.name, c: t.c, round: t.round, font: t.font, s: t.s } };
    var api = bgApi();
    if (withBackgrounds && api) out.backgrounds = JSON.parse(JSON.stringify(api.uiCustomization));
    var blob = new Blob([JSON.stringify(out, null, 2)], { type:'application/json' });
    var name = (t.name || 'theme').replace(/[^\w -]+/g, '').trim().replace(/\s+/g, '-') || 'theme';
    if (window.ppSaveBlob) window.ppSaveBlob(blob, 'press-play-' + name + '.pptheme.json');
  }
  var BG_TYPES = { 'default':1, color:1, gradient:1, animated:1, image:1 };
  function importTheme(file){
    var r = new FileReader();
    r.onload = function(){
      var data;
      try { data = JSON.parse(r.result); } catch(e){ toast('That file is not a Press Play theme.'); return; }
      if (!data || data.kind !== 'press-play-theme' || !data.theme){ toast('That file is not a Press Play theme.'); return; }
      setTheme(data.theme, true);
      var api = bgApi(), b = data.backgrounds;
      if (api && b && typeof b === 'object'){
        ['app','playlist','controls','immersive'].forEach(function(k){
          var x = b[k];
          if (!x || !BG_TYPES[x.type]) return;
          if (x.type === 'image' && !(typeof x.dataUrl === 'string' && x.dataUrl.indexOf('data:image/') === 0)) return;
          api.uiCustomization[k] = x;
        });
        api.applyAllCustomization(); api.saveCustomization();
      }
      toast('Theme loaded' + (data.theme.name ? ': ' + data.theme.name : '') + '.');
    };
    r.readAsText(file);
  }
  function toast(m){ try { window.ppToast(m); } catch(e){} }

  // ---------- saved themes ----------
  function savedList(){ try { var a = JSON.parse(localStorage.getItem(SAVED_KEY)); return Array.isArray(a) ? a.map(clean).filter(Boolean) : []; } catch(e){ return []; } }
  function writeSaved(a){ try { localStorage.setItem(SAVED_KEY, JSON.stringify(a.slice(0, 30))); } catch(e){ toast('Could not save: storage is full.'); } }

  // ---------- editor (in the Customize sheet) ----------
  var ui = null;
  function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

    return '<span class="ppth-sw" style="background:' + c.bg + '"><i style="background:' + c.surface + '"></i><b style="background:' + c.accent + '"></b></span>';
  }

  function buildEditor(){

      '<div class="ppth-h">Presets</div><div class="ppth-presets"></div>' +

      '<div class="ppth-h">Shape</div>' +

      '<div class="ppth-h">Font</div>' +

      '<div class="ppth-h">Style</div><div class="ppth-style"></div>' +
      '<div class="ppth-h">My themes</div>' +
      '<div class="ppth-row ppth-save"><input type="text" id="ppth-name" maxlength="40" placeholder="Name this theme"><button type="button" class="settings-toggle-btn" id="ppth-save">Save</button></div>' +
      '<div class="ppth-saved"></div>' +
      '<div class="ppth-row ppth-io">' +
        '<button type="button" class="settings-toggle-btn" id="ppth-export">Export…</button>' +
        '<button type="button" class="settings-toggle-btn" id="ppth-import">Import…</button>' +
        '<input type="file" id="ppth-import-file" accept="application/json,.json" hidden>' +
      '</div>' +
      '<label class="ppth-check"><input type="checkbox" id="ppth-export-bg"> Include backgrounds when exporting</label>' +
      '<div class="ppth-row"><button type="button" class="settings-toggle-btn ppth-danger" id="ppth-reset">Back to the default look</button></div>';

    var presetsEl = panel.querySelector('.ppth-presets');
    PRESETS.forEach(function(p){
      var b = el('button', 'ppth-preset', swatch(p.c || STOCK) + '<span>' + esc(p.name) + '</span>');
      b.type = 'button'; b.dataset.id = p.id;

      });
      presetsEl.appendChild(b);
    });

    var colorsEl = panel.querySelector('.ppth-colors'), inputs = {};
    COLOR_FIELDS.forEach(function(f){
      var row = el('label', 'ppth-color', '<span><b>' + f[1] + '</b>' + (f[2] ? '<small>' + f[2] + '</small>' : '') + '</span>');
      var inp = el('input', 'customize-color-input'); inp.type = 'color';
      inp.addEventListener('input', function(){
        var t = current || stockTheme(); t = clean(t); t.c[f[0]] = inp.value.toLowerCase(); t.preset = null;
        setTheme(t);
      });
      row.appendChild(inp); colorsEl.appendChild(row); inputs[f[0]] = inp;
    });

    panel.querySelector('#ppth-from-accent').addEventListener('click', function(){
      var t = clean(current || stockTheme()); t.c = fromAccent(t.c.accent); t.preset = null; setTheme(t, true);

    var o0 = el('option', null, esc(FONTS['default'].label)); o0.value = 'default'; font.appendChild(o0);
    FONT_GROUPS.forEach(function(g){ var og = document.createElement('optgroup'); og.label = g[0];

    var styleEl2 = panel.querySelector('.ppth-style'), styleInputs = {};
    STYLE.forEach(function(f){

      } else if (f[2] === 'seg'){

        row.querySelectorAll('button').forEach(function(b){ b.addEventListener('click', function(){ var t = clean(current || stockTheme()); if (b.dataset.v) t.s[k] = b.dataset.v; else delete t.s[k]; setTheme(t, true); }); });

  // Pictures are scaled down (longest side 1280 px, JPEG) so the layout stays small enough to save.
  function shrinkImage(file, cb){
    var r = new FileReader();
    r.onload = function(){
      var img = new Image();
      img.onload = function(){
        var s = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        // pictures that can be see-through (PNG, WebP, GIF) stay see-through, so a cut-out spins as a cut-out (picture fidgets)
        var alpha = /png|webp|gif/i.test(file.type || ''), url;
        try { url = alpha ? c.toDataURL('image/webp', 0.9) : c.toDataURL('image/jpeg', 0.84); if (alpha && url.indexOf('data:image/webp') !== 0) url = c.toDataURL('image/png'); cb(url); } catch(e){ cb(r.result); }
      };
      img.onerror = function(){ toast('That picture could not be opened.'); };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  }
